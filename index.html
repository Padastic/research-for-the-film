<script>
const DATA = [{"f": "DatQfD7RD5I.mp4", "t": "Βίντεο", "s": "Ένα βίντεο αυτογνωσίας που θέτει δέκα ερωτήματα για να ελέγξεις αν είσαι πραγματικά έτοιμος για τη ζωή που λες ότι θέλεις. Ο ομιλητής ζητά να μην απαντήσεις ως το πρόσωπο που θα ήθελες να είσαι, αλλά ως αυτός που είσαι σήμερα. Τα ερωτήματα αγγίζουν την ικανότητα να δέχεσαι την απόρριψη χωρίς να θίγεται η αυτοεκτίμησή σου, να ζητάς συγγνώμη χωρίς δικαιολογίες, να μένεις μόνος με τις σκέψεις σου χωρίς περισπασμούς, να αναζητάς ανάπτυξη αντί για ενόχους, να χαίρεσαι την επιτυχία των άλλων, να δέχεσαι κριτική με περιέργεια, να ευθυγραμμίζεις τις συνήθειές σου με το μέλλον που ευαγγελίζεσαι, να φεύγεις από σχέσεις που σε ακυρώνουν και να μένεις συνεπής στις αξίες σου όταν δεν σε βλέπει κανείς. Το κορυφαίο ερώτημα αφορά το αν θα ήσουν περήφανος αν το παιδί σου γινόταν ακριβώς σαν εσένα. Το μήνυμα κλείνει με τη διαπίστωση ότι η ζωή αλλάζει όχι όταν ακούς την αλήθεια αλλά όταν αποφασίζεις να τη ζήσεις.", "x": "Ask yourself these 10 questions to see if you're ready. Ready for the life you keep saying you want. Don't answer these for the person you wish you were. Answer them for the person you are today. One, can you hear the word no without turning it into a story about your self-worth? Two, can you apologize without explaining why it wasn't really your fault? Three, can you sit alone with your own thoughts without needing your phone, food, alcohol, work, or someone else's attention to rescue you? Four, when life gets hard, do you look for someone to blame or somewhere to grow? Five, can you celebrate someone else's success without secretly feeling like it took something away from yours? Six, when someone gives you feedback, do you get curious, or do you immediately get defensive? Seven, do your daily habits match the future you keep talking about, or do your habits just match your excuses? Eight, can you walk away from someone you love if staying means abandoning yourself? Nine, when nobody's watching, do your actions still match your values? 'Cause that's character. Ten, here's the question that matters the most. If your future child grew up to become exactly who you are today, would you be proud, or would you hope they would've chosen differently? Don't answer me, answer yourself. 'Cause your life doesn't change the day you hear the truth. It changes the day you decide to live your truth. Follow me, then comment the word transform, and I'll send you resources to make you strong inside your own life."}, {"f": "DaAEAfCAG7v.jpg", "t": "Φωτογραφία", "s": "Ένα χιουμοριστικό ποιητικό κείμενο στα ελληνικά από τον λογαριασμό onemanstories, που παίζει με τις λέξεις κατάρα και κατσαρίδα. Το κείμενο, όπως προέκυψε από οπτική αναγνώριση, είναι σκόπιμα αλλοιωμένο και δυσανάγνωστο, γεγονός που αποτελεί μέρος του χιούμορ του. Η βασική ιδέα είναι ένα λογοπαίγνιο: το να είναι κάτι κατάρα μοιάζει να μετατρέπεται σε κατσαρίδα, σε έναν σουρεαλιστικό και αυτοσαρκαστικό τόνο. Εμφανίζονται φράσεις που περιγράφουν καταστάσεις του σπιτιού, το κρεβάτι, τον ύπνο και ένα γέλιο που χαρακτηρίζεται ως το νέο βασανιστήριο. Το ύφος θυμίζει σύγχρονη ελληνική διαδικτυακή ποίηση που σατιρίζει την καθημερινότητα με παράλογο χιούμορ και λεκτικά τεχνάσματα. Δεν πρόκειται για συμβατικό νόημα, αλλά για παιχνίδι με τη γλώσσα και την τυπογραφία, όπου η ίδια η δυσκολία ανάγνωσης γίνεται αστείο. Ο δημιουργός σχολιάζει έμμεσα το πώς οι άνθρωποι αντιλαμβάνονται τα προβλήματά τους, μετατρέποντας κάτι σοβαρό σε κάτι γελοίο, δηλαδή μια κατάρα σε κατσαρίδα.", "x": "MOZA OEЛS\nNA ZE ZKIER\nMEXPI NA\nЛІПОРУМНЕОУМЕ\nKI OI AYO\nКРУФТНКА ПІДА АПТО\n\"ENA •PENTO EZTPELO\n[КЕТО ПАРАКАЛЯ\";\nonemanstories\n\n1 Катоаріба\nEival катаріба\nMEXPI VA UTTEL\nOTO OȚTITI GOU\nuETa EivaL\nTOYTANA\nКАТЕАРІДА\nonemanstories\n\nKaulokaiplace\nonemanstories\n\nZaV TOV UTIVO\nolaywvia\nото крЕвать\nAEN EXEI\nonemanstories\n\nEíval To\n«ХАХА»\nTO VEO\nбавотикє;\nonemanstories"}, {"f": "DZTXTYiPlz_.mp4", "t": "Βίντεο", "s": "Μια συζήτηση για την πανδημία της μοναξιάς που διαπερνά τη σύγχρονη εποχή. Οι ομιλητές επισημαίνουν ότι είμαστε πιο συνδεδεμένοι από ποτέ αλλά ταυτόχρονα πιο επιτελεστικοί, με αποτέλεσμα να μην μπορούμε να συνδεθούμε πραγματικά. Το πρόσωπο έχει αντικατασταθεί από το προσωπείο, τον ρόλο που υποδύεται ο καθένας. Το πρόσωπο όμως είναι ανίκανο να δεχθεί αγάπη, μπορεί μόνο να δεχθεί έπαινο. Έτσι, δεν πρέπει να εκπλήσσεται κανείς που δεν νιώθει υπαρξιακή σύνδεση με τις επιδιώξεις του, τις επιτυχίες του ή τους ανθρώπους γύρω του, αφού εκείνοι χειροκροτούν τον ρόλο που παίζει και όχι το ποιος είναι πραγματικά. Η ουσία είναι ότι η αυθεντικότητα έχει χαθεί πίσω από την εικόνα, και η βαθιά ανθρώπινη σύνδεση προϋποθέτει να αφήσουμε κάτω τη μάσκα. Το απόσπασμα καταγγέλλει την επιτελεστική κοινωνική ζωή ως αίτιο της υπαρξιακής κενότητας.", "x": "pandemic that we're in right now of loneliness. Like we're more connected than ever and more performative than ever at the same time. So we, we can't really connect The person has been subsumed by the persona, the role that people are playing. Yeah. But the persona is incapable of receiving love. It can only receive praise at best. So how can you be surprised if you don't genuinely existentially feel the connection with your pursuits and your successes and the people around you? You know that they're just applauding the role that you play as opposed to seeing who you are truly. Yeah."}, {"f": "DZSiSIzE9sq.jpg", "t": "Φωτογραφία", "s": "", "x": ""}, {"f": "DZR_9HtgHJ_.jpg", "t": "Φωτογραφία", "s": "Ένα κείμενο από τον λογαριασμό happycouplesconnect για τον εμφύλιο πόλεμο που γίνεται στην κοινότητα του γάμου ανάμεσα σε δύο απόψεις. Η μία πλευρά λέει διάλεξε τον εαυτό σου, προστάτευσε την ηρεμία σου, αξίζεις καλύτερα. Η άλλη λέει ο γάμος θέλει δουλειά, η αγάπη είναι επιλογή, μείνε και πάλεψε. Ο συγγραφέας προτείνει τρίτη επιλογή. Αναλύει τι σωστό και τι επικίνδυνα λάθος κρύβει κάθε πλευρά: το διάλεξε τον εαυτό σου σωστά λέει ότι οι ανάγκες σου μετράνε, αλλά λάθος εξισώνει το πληγωμένο συναίσθημα με την πραγματική βλάβη. Το πάλεψε για τον γάμο σου σωστά τονίζει τη δέσμευση, αλλά λάθος υπονοεί ότι κάθε γάμος μπορεί να σωθεί, αφού δεν πρέπει να ανέχεσαι κακοποίηση ή προδοσία. Ο στόχος δεν είναι να διαλέξεις εσένα ή τον γάμο, αλλά να χτίσεις έναν γάμο όπου κανένας δεν χάνει τον εαυτό του. Κλείνει προωθώντας το πρόγραμμα επικοινωνίας 28 ημερών.", "x": "The marriage community\nis having a full-blown\ncivil war over \"Choose\nYourself\" vs \"Fight For\nYour Marriage\" and I\nneed to talk about it.\n@happycouplesconnect\n\nOne side says:\n\"Choose yourself.\"\n\"Protect your peace.\"\n\"You deserve better.\"\nThe other side says:\n\"Marriage takes work.\"\n\"Love is a choice.\"\n\"Stay and fight for your\nrelationship.\"\nI'm the third option...\n@happycouplesconnect\n\nHere's what both sides are\ngetting right and what they're\ngetting dangerously wrong.\n@happycouplesconnect\n\n\"Choose yourself.\"\nV Right: Your needs\nmatter too.\nX Wrong: Feeling hurt and\nbeing harmed are not\nalways the same thing. No\nperson can be responsible\nfor your happiness 100% of\nthe time.\n@happycouplesconnect\n\n\"Fight for your marriage.\"\nV Right: Strong marriages\nrequire commitment,\nsacrifice, and hard\nconversations.\nWrong: Not every\nmarriage can or should be\nsaved. You shouldn't\ntolerate abuse, disrespect,\nor betrayal.\n@happycouplesconnect\n\nThe goal isn't to choose\nyourself over your marriage.\nAnd it isn't to choose your\nmarriage over yourself.\nThe goal is to build a marriage\nwhere neither of you has to\nlose yourselves to make it\nwork.\n@happycouplesconnect\n\nA struggling marriage is not\nthe same thing as a hopeless\nmarriage.\nMany couples are one\nconversation, one skill, or one\nbreakthrough away from a\ncompletely different\nrelationship.\n@happycouplesconnect\n\nIf you're both willing to do the\nwork but keep getting stuck in\nthe same arguments, I created\nFighting For Us: The 28-Day\nCommunication Challenge\njust for you.\n@happycouplesconnect\n\nIn just 5 minutes a day for 28\ndays, you'll learn how to\ncommunicate without\ndefensiveness, navigate\nconflict without it turning into\na fight, work through\nresentment, repair after\ndisagreements, and finally feel\nlike you're on the same team\nagain.\nComment 28DAY for the link.\n@happycouplesconnect"}, {"f": "DZMn9bppGpn.jpg", "t": "Φωτογραφία", "s": "Ένα σύντομο ενθαρρυντικό μήνυμα που υπενθυμίζει ότι η καθημερινότητά σου, που θεωρείς δεδομένη, είναι για κάποιον άλλο το όνειρο της ζωής του. Η φράση παροτρύνει τον αναγνώστη να νιώθει ευγνωμοσύνη κάθε μέρα. Το νόημα είναι βαθύ και απλό: συχνά συγκρίνουμε τη ζωή μας με κάτι ανώτερο και χάνουμε την αίσθηση του τι ήδη έχουμε. Η υγεία, η στέγη, η τροφή, οι άνθρωποι γύρω μας, όλα αυτά που θεωρούμε αυτονόητα είναι αγαθά που εκατομμύρια άνθρωποι στερούνται. Το μήνυμα μάς καλεί να σταματήσουμε να κυνηγάμε συνεχώς το επόμενο και να εκτιμήσουμε το παρόν, αναγνωρίζοντας την αξία της συνηθισμένης μέρας. Πρόκειται για μια διαχρονική σκέψη περί ευγνωμοσύνης που συναντάται στη στωική και γενικότερα φιλοσοφική παράδοση, διατυπωμένη με απλό τρόπο ώστε να λειτουργεί ως καθημερινή υπενθύμιση. Είναι ένα μήνυμα που στοχεύει στην αλλαγή οπτικής παρά στην εντυπωσιακή διατύπωση.", "x": "YOUR NORMAL DAY\nIS SOMEONE'S DREAM,\nSO BE THANKFUL\nEUERY DAY."}, {"f": "DZNewPMI1gM.mp4", "t": "Βίντεο", "s": "Μια μεταφορά για την αυτοβελτίωση με βάση το ποτήρι: αν το ποτήρι σου έχει βρωμιά, δεν το πετάς και δεν περιμένεις μέχρι αύριο, το πλένεις και προχωράς. Με τη μέρα σου όμως κάνεις το αντίθετο. Αν σπατάλησες το πρωί, η μέρα δεν τελείωσε εκεί, ξεκίνα τώρα. Αν κόλλησες στο σκρολάρισμα, μην περιμένεις να τελειώσει το βίντεο, κλείδωσε την οθόνη στη μέση της πρότασης. Αν έχασες την προπόνηση, μην περιμένεις τη Δευτέρα, κάνε δέκα κάμψεις αμέσως. Κάθε κακή στιγμή έχει επαναφορά διαθέσιμη μέσα στο επόμενο λεπτό. Ο εγκέφαλος λέει ότι όλα χάλασαν, αυτό οι ψυχολόγοι το ονομάζουν φαινόμενο του τι στο καλό. Όποιος όμως επαναφέρεται άμεσα επαναπρογραμματίζει τον εγκέφαλό του να ανακάμπτει ταχύτερα. Οι άνθρωποι που ανακάμπτουν γρήγορα δεν έχουν απλώς καλύτερες μέρες, έχουν εντελώς διαφορετική ζωή.", "x": "If there is dirt on your glass, you don't throw it away and wait until tomorrow to drink again. You wash it and you move on. But with your day, you do the opposite. You wasted the morning? Your day didn't end there. Start now. You got caught scrolling? Don't wait for the video to end. Lock the screen mid-sentence. You missed a workout? Don't wait for Monday. Do ten pushups right now. Every bad moment has a reset, and it is always available within the next sixty seconds. Your brain tells you, \"Well, it's all already ruined.\" Psychologists call it the what the hell effect. Everybody has it. But every time you reset in the moment instead of waiting for tomorrow, you're reprogramming your brain to recover faster. And people who reset fast, they don't just have better days. They have a completely different life"}, {"f": "DZDJh-Dq1Xn.mp4", "t": "Βίντεο", "s": "Ένα νοητικό πείραμα που δείχνει πώς ο εγκέφαλος παραμορφώνει την πραγματικότητα. Ζητά να πεις πέντε φορές τη λέξη shop και μετά να τη συλλαβίσεις, και τέλος ρωτά τι κάνεις όταν φτάνεις σε πράσινο φανάρι. Οι περισσότεροι απαντούν ότι σταματούν, ενώ στο πράσινο προχωράς. Ο εγκέφαλος ψευδαισθήθηκε ένα κόκκινο φως για να ταιριάξει με προηγούμενη εμπειρία. Το ίδιο συμβαίνει σε όλη τη ζωή: μια νέα επιχειρηματική ευκαιρία φαίνεται κίνδυνος εξαιτίας μιας παλιάς αποτυχίας, ή κάποιος που θέλει να βοηθήσει αντιμετωπίζεται ως εχθρός επειδή κάποιος στο παρελθόν μας πλήγωσε. Για να δεις αν κάτι είναι πραγματικά ευκαιρία ή πράσινο φως, πρέπει να αναγκάσεις τον εγκέφαλό σου να βρει την αντίθετη πραγματικότητα. Αν δεν μπορείς να επιχειρηματολογήσεις ενάντια στην κρίση σου, θα αποφασίζεις πάντα με βάση τη μνήμη και όχι την πραγματικότητα.", "x": "Answer these three questions as fast as you can. Don't think. Number one, say the word shop five times with me. Shop, shop, shop, shop, shop. Number two, spell the word shop out loud right now. Number three, what do you do when you come to a green light? You just said stop, didn't you? You don't stop at a green light. You go. Think of how dangerous that is. Your brain hallucinated a red line to match your past experience. You do this all the time with other things. Look at a new business opportunity, and your brain sees danger because of an old failure. Or someone is trying to help you, but you treat them like an enemy because someone in the past hurt you. If you want to see if someone or something is actually an opportunity or it's a green light, you have to force your brain to find the opposite reality. Because if you can't have arguments against your own judgment, you will always decide based on a memory, not reality."}, {"f": "DYnu3D_xpUo.mp4", "t": "Βίντεο", "s": "Ένα αμφιλεγόμενο μήνυμα αυτοβοήθειας που υποστηρίζει ότι η κατάθλιψη είναι απλώς θλιβερές σκέψεις, το τραύμα απλώς δυσάρεστες αναμνήσεις και ο εθισμός απλώς σκέψεις για πράγματα που δεν πρέπει να κάνεις. Ο ομιλητής ισχυρίζεται ότι όλοι οι φόβοι, τα άγχη και οι διατροφικές διαταραχές είναι κατασκευάσματα του μυαλού, όπως επίσης ότι ακόμη και η καταπίεση και ο ρατσισμός είναι περιοριστικές πεποιθήσεις. Το κείμενο κατηγορεί τον ακροατή ότι εκπαίδευσε το μυαλό του να τον τρομοκρατεί σε μια ζωή μετριότητας. Απορρίπτει ως δικαιολογίες το χρώμα του δέρματος, τη γενετική, τις εμπειρίες και τη βιοχημεία του εγκεφάλου, υποστηρίζοντας ότι το πρόβλημα είναι ότι έχεις πείσει τον εαυτό σου ότι δεν μπορείς να γίνεις καλύτερος. Το μήνυμα καταλήγει ότι δεν είσαι θύμα των περιστάσεων αλλά θύμα της οπτικής σου και της έλλειψης προσπάθειας, μια θέση που αγνοεί τη βιολογική διάσταση της ψυχικής υγείας.", "x": "Depression is just sad thoughts. Trauma is nothing more than unpleasant memories. Addiction is simply you thinking about doing things you shouldn't do. All of your fears, anxieties, and eating disorders are only things you made up in your head. Even oppression and racism are just limiting beliefs, and these are the things you allow to hold you back. You've trained your own mind to bully you into a life of mediocrity. Pathetic. The problem isn't your skin color or your genetics. It's not your experiences, your brain chemicals, or a random disease. The problem is you've convinced yourself you can't be better because of things outside of your control, so you don't even try. You told yourself you can't, so you don't. You're not a victim of circumstance. You're a victim of your perspective and your lack of effort."}, {"f": "DYS-SbyRnvS.mp4", "t": "Βίντεο", "s": "Ένα βίντεο του βελονιστή Μάικλ που εξηγεί γιατί ο εγκέφαλος προτιμά τον γνώριμο πόνο από την άγνωστη ελευθερία. Ο εγκέφαλος δεν νοιάζεται για τους στόχους σου αλλά για την επιβίωση, και εξισώνει το οικείο με την ασφάλεια. Όταν αρχίζεις να αλλάζεις, ενεργοποιούνται παλιά προστατευτικά κομμάτια από την παιδική ηλικία, στρατηγικές επιβίωσης που έμαθες σε χαοτικά περιβάλλοντα, όπως μη γίνεσαι πολύ ορατός, μη χαλαρώνεις, μην εμπιστεύεσαι, μην περιμένεις πολλά. Το νευρικό σύστημα προβλέπει πόνο πριν καν κινηθείς. Έτσι οι άνθρωποι μένουν κολλημένοι στα ίδια μοτίβα σχέσεων, χρημάτων και συναισθημάτων, όχι από αδυναμία αλλά επειδή ένα παιδικό κομμάτι πιστεύει ότι η ασφάλειά του εξαρτάται από το να μείνεις ίδιος. Η πρόταση αλλαγής είναι να πεις μέρος του εαυτού μου φοβάται ότι θα αποτύχω αντί για είμαι αποτυχημένος, δημιουργώντας χώρο μεταξύ μοτίβου και επίγνωσης, όπου αρχίζει η αλλαγή.", "x": "The most addicting thing on Earth might be ruining your life. If you're new here, I'm Michael. I'm an acupuncturist, and I help you up spiral your life. If you're into that, follow me and click the link in my bio. Your brain does not care about your goals. It cares about survival because your brain would rather keep you inside a familiar pain than risk an unfamiliar freedom because familiar equals survival. So your brain is literally addicted to whatever is familiar. So the moment you start trying to become someone new, make more money, be more visible, rest more, love more deeply, actually believe in yourself, old protector parts from childhood get activated inside you. They're old survival strategies you learned when you were a kid when life felt chaotic or dangerous. Strategies like don't be too visible, don't relax, don't trust, don't get too happy, don't expect too much, and don't believe that this will work because the last time you did, you got hurt. So now your nervous system predicts pain before you even move. So before you speak up, you brace for impact. Before you receive, you contract. Before you try anything new, you scan for danger. And then you start thinking that this is just who you are. Like, that's your personality. No, it's a protector part trying to pull you back into the reality that it understands because familiar pain feels safer to your brain than unfamiliar freedom. That's how people can stay stuck in the same relationship pattern, the same money pattern, the same emotional loops, the same fears, the same reactions. And it's got nothing to do with weakness because some childhood part of you still thinks that your safety depends on you staying the same. So here's the power move. Step one, instead of saying, \"I'm broken, I'm failing, I'm behind,\" try this instead, \"Part of me is afraid I'm gonna fail.\" That single sentence creates space between your pattern and your awareness, and that space is where change begins. Step two, take out your phone and set a timer for one minute. Then out loud or under your breath, start naming things you already have in your life that you genuinely appreciate and why you appreciate them. What's already working? What's already good? Because appreciation shifts your attention. Attention shifts your brain chemistry because your brain releases dopamine when it notices possibility and progress and meaning, and you're teaching your brain to stop scanning for danger and to start noticing opportunity as well. Step three, now imagine yourself slightly in the future. Not fantasy, just one level stronger. See yourself calmer, more grounded, more confident. How would that version of you feel inside their body? Proud? Relieved? Strong? Allow yourself to feel it even two percent because your brain responds to expectation, and this is called the expectancy effect. Even a small emotional shift toward possibility creates momentum, and momentum changes behavior. Before long, you start to up spiral your life. Follow me and comment the word transform, and I'll send you some more information about my unique manifestation program. In that program, we give you tools based in neuroscience to put you back in charge of your life. Follow me and comment the word transform. Vibrant beings, have a great day."}, {"f": "DYI83p6Ceei.jpg", "t": "Φωτογραφία", "s": "Ένα απόσπασμα από την ποιήτρια Μέρι Όλιβερ, από τον λογαριασμό writeyourselfalive, που λέει ότι κάποιος που αγάπησε κάποτε της έδωσε ένα κουτί γεμάτο σκοτάδι και ότι της πήρε χρόνια να καταλάβει ότι κι αυτό ήταν δώρο. Το νόημα αφορά τη μεταμόρφωση του πόνου σε κάτι πολύτιμο. Αυτό που αρχικά μοιάζει με βάρος, απώλεια ή πληγή, με τον χρόνο και την επεξεργασία αποκαλύπτεται ως μάθημα που μας διαμόρφωσε. Η ποιήτρια δεν αρνείται τη δυσκολία, αλλά την επανανοηματοδοτεί: το σκοτάδι που μας δόθηκε μέσα από μια σχέση αγάπης γίνεται δώρο γιατί μας δίδαξε κάτι για τον εαυτό μας και τη ζωή. Είναι μια στάση αποδοχής και ευγνωμοσύνης απέναντι σε όσα μας πόνεσαν, που απηχεί τη βαθιά ποιητική ματιά της Όλιβερ πάνω στη φύση και την ανθρώπινη εμπειρία. Το απόσπασμα ενθαρρύνει να δούμε τα τραύματά μας ως κομμάτι της προσωπικής μας εξέλιξης.", "x": "Someone I loved once gave\nme a box full of darkness. It\ntook me years to understand\nthat this too, was a gift.\n@writeyourselfalive\n- Mary Oliver"}, {"f": "DXZhqTWkX5C.jpg", "t": "Φωτογραφία", "s": "Ένα ρομαντικό κείμενο που συνδυάζει αγάπη και τρυφερ OMANTI AS YOU WANT TO BE\nBE AS ROMANTI AS YOUWANI SO BE\nBE AS ROMANTIC AS YOU WANTTOBE\nBE AS ROMANTIL AL YOU WANITORE\nBLAS ROMANTIC AS YOU WANT tODE\nBEAS ROMANtI AS YOU WAnt tORE\nBEAS ROMANTIC AI YOU WANT*OBE\nBEASROMANTIC AI YOU WANTTOBE\nBEASROMANTHAL YOU WANT TO DI\nBE AS ROMARITIC AT YOU LIANTHOE\nDEA POMANIME ALYOU GINA TONE\n/\nLIAN"}, {"f": "DXxO9DRRfMk.mp4", "t": "Βίντεο", "s": "Ένα απόσπασμα για το πρώτο συνθετικό είδος ζωής, τη δημιουργία βακτηρίου από συνθετικό DNA από την ομάδα του Κρεγκ Βέντερ. Η έρευνα κράτησε περίπου δεκαπέντε χρόνια και κόστισε σαράντα εκατομμύρια δολάρια. Σε πρακτικό επίπεδο το αποτέλεσμα είναι περίπου τόσο χρήσιμο όσο η μούχλα στο ψυγείο ενός εργένη, όμως επιστημονικά αποτελεί ορόσημο. Το βακτήριο, παρόμοιο με αυτό που βρίσκεται στο έντερο κατσικιών, σχεδιάστηκε σε υπολογιστή, κατασκευάστηκε στο εργαστήριο και παίρνει τις γενετικές του οδηγίες από συνθετικό χρωμόσωμα φτιαγμένο από τον άνθρωπο. Είναι ζωντανό και αυτοαναπαράγεται. Δεν σχεδιάστηκε για κάτι συγκεκριμένο, μόνο για να αποδειχθεί ότι το πείραμα είναι εφικτό. Ο Βέντερ το θεωρεί πρώτο βήμα μιας βιολογικής επανάστασης, όπου θα προγραμματίζουμε βακτήρια και άλλους οργανισμούς για φάρμακα, τρόφιμα και καθαρή ενέργεια. Το DNA είναι το λογισμικό της ζωής, και το μέλλον της ζωής στον πλανήτη εξαρτάται από την ικανότητά μας να γράφουμε αυτό το λογισμικό.", "x": "So this is what all the fuss is about. This is the first synthetic species. And how long did it take you to make this? Well, if you count the total time from the conception, about 15 years. And how many millions? Uh, about $40 million over that entire time period. In practical terms, it's about as useful as the mold that grows in a bachelor's refrigerator, but scientifically, it's a milestone. The bacteria, which is similar to one found in the intestines of goats, was designed on a computer, manufactured in the laboratory, and gets its genetic instructions from a synthetic chromosome made by man, not nature. And it's alive. It's alive and self-replicating. It means it can indefinitely grow and make copies of itself. Did you design this to do anything in particular? No. We designed this just to see if we could do this whole experiment using synthetic DNA. And now that we know we can do it, it's worth the effort to now make the things that could be valuable. Just how valuable remains to be seen, but Venter believes this is the first baby step in a biological revolution, one in which it will be possible to custom design and reprogram bacteria and other organisms to churn out new medicines, foods, and clean sources of energy. What you're doing is programming cells, like somebody would program software. DNA is the software of life. There's no question about it, and that's key to evolution of life on this planet, and now the key to the future of life on this planet is understanding how to write that software. So you see bioengineered fuel, for example. I see in the future bioengineered almost everything you can imagine that we use. How far off is some of this? The first things will start to come out in the next few years. I think possibly next year's flu vaccine could come from these synthetic DNA processes. Instead of months to make a new vaccine each year, we could do it in 24 hours or less"}, {"f": "DXsUqlBkR9E.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που παρουσιάζει πέντε σημάδια ότι ήρθε η ώρα να χωρίσεις, με νευροεπιστημονική γλώσσα. Πρώτο, το σώμα σου βρίσκεται πιο συχνά σε ένταση παρά σε ηρεμία, με μόνιμο άγχος και περπάτημα πάνω σε αβγά, όπου ο εγκέφαλος κωδικοποιεί τον σύντροφο ως απειλή. Δεύτερο, εκτελείς ρόλο αντί να είσαι ο εαυτός σου, φιλτράρεις συνεχώς όσα λες και διαχειρίζεσαι τις αντιδράσεις του άλλου. Τρίτο, η σύγκρουση μοιάζει με επιβίωση και όχι με επιδιόρθωση, ενεργοποιώντας την αντίδραση μάχης ή φυγής. Τέταρτο, φεύγεις από τις συναναστροφές νιώθοντας μικρότερος και εξαντλημένος αντί για διευρυμένος και ανοιχτός. Πέμπτο, η διαίσθησή σου συνεχίζει να μιλάει και εσύ συνεχίζεις να διαπραγματεύεσαι μαζί της. Το μεταιχμιακό σύστημα καταγράφει ότι κάτι δεν πάει καλά πριν προλάβεις να το εξηγήσεις. Αυτή η σιωπηλή βεβαιότητα δεν είναι δράμα αλλά δεδομένο, και κάθε φορά που την αγνοείς προδίδεις τον εαυτό σου.", "x": "Here's the top five signs it's time to break up. Number one: Your body feels on edge more than it feels at ease. If your baseline is anxiety and walking on eggshells all the time, that's not relationship work. That's your amygdala, your brain's threat center, flagging a crisis. Chronic relationship stress keeps your cortisol high, and over time, your brain codes this other person as a threat. Love should challenge you sometimes, but it should not dysregulate you constantly. Two: You're performing instead of being. Are you constantly editing your tone and filtering what you're about to say? Do you often have to manage their reactions? That's your prefrontal cortex overworking to keep the peace. Real connection reduces self-editing and self-monitoring. If you feel like you're acting all the time, your nervous system doesn't trust the environment. Three: Conflict feels like survival, not repair. Every couple fights, but if conflict sends you into fight, flight, or shutdown, that's not normal. That's conditioning. Your brain is treating disagreement like danger. Healthy relationships activate you, but they also bring you back down. If there's no repair, only escalation and then avoidance, your system never gets a chance to reset. Number four: You leave interactions feeling smaller. So track your energy. After you're with them, do you feel expanded or depleted? Because the right relationship activates connection states, ease, openness, and curiosity. The wrong relationship keeps you contracted, less expressive, and less you, and your body knows the difference. Number five: Your intuition keeps speaking, and you keep negotiating with it. This one's subtle 'cause your brain has predictive systems that are constantly scanning for patterns. And when something's off, your limbic system registers it before you can explain it. You know that quiet knowing inside that this isn't right. That's not you being dramatic. That's data. And every time you override it, you train yourself to ignore your own signal. Here's the big takeaway: Most people wait for something dramatic to leave. But the truth is, your nervous system already decided. You're just catching up with it. Sometimes the quickest way to up-spiral your life is to get out of a relationship that's bringing you down. Follow me and comment \"up-spiral\" and I'll send you some more information about my unique manifestation program. In that program, we explore with you the many ways that relationships can help you up-spiral your life, starting with the relationship you have with yourself. Follow me and comment \"up-spiral.\" Vibrant beings, have a great day."}, {"f": "DWKToJ_yX6d.mp4", "t": "Βίντεο", "s": "Ένα τρυφερό βίντεο για παιδιά όπου ο Τομ κάθεται έξω με τον σκύλο του, τον Μπλου. Μιλάει για ένα βελανίδι που αρχίζει να φυτρώνει στο έδαφος, όπως ακριβώς ένα που φύτρωσε πριν από χίλια χρόνια, και αναρωτιέται πόσο εκπληκτικό είναι που ένα τόσο γιγάντιο δέντρο μπορεί να βγει από κάτι τόσο μικρό. Αυτή η ιστορία του δίνει την ιδέα να βρει ένα βελανίδι και να το φυτέψει, με την ελπίδα να γίνει κι αυτό μια τεράστια βελανιδιά και σπίτι για κουκουβάγιες, νυχτερίδες, σκίουρους και εκατομμύρια έντομα. Στη συνέχεια συνδέει την ανάπτυξη με τον ύπνο, λέγοντας ότι αυτό που βοηθάει να μεγαλώσεις είναι ο ύπνος. Το βίντεο κλείνει ως ιστορία για καληνύχτα, με τον Τομ να εύχεται καληνύχτα και να υπενθυμίζει ότι ίσως αύριο να είσαι λίγο μεγαλύτερος. Το ύφος είναι ζεστό, ήρεμο και κατάλληλο για παιδιά, συνδυάζοντας τη φύση με τη φροντίδα.", "x": "Hello, I'm Tom, and I'm sat here outside with my dog, Blue. On the ground, an acorn starts to grow, just like the one a thousand years ago. How amazing that such a giant tree can grow out of something so small. Right, that story's given me an idea. I'm going to find an acorn and I'm going to plant it, and hopefully it will grow into a huge oak tree too and be a home to owls and bats and squirrels and millions of brilliant bugs. Now, do you know what helps you to grow? Sleep. So, off to bed, snuggle up tight. Maybe, maybe tomorrow you might be just a little bit bigger. Night night."}, {"f": "DUgW6mbDEVr.mp4", "t": "Βίντεο", "s": "", "x": ""}, {"f": "DT_K8IuEfBp.mp4", "t": "Βίντεο", "s": "Ένα κείμενο ψυχολογίας που εξηγεί γιατί μια γυναίκα δίνει τη χειρότερη συμπεριφορά της στον άντρα που της φέρεται καλύτερα. Σύμφωνα με την ψυχολογία δεν είναι σύμπτωση αλλά ασφάλεια: ξέρει ότι δεν θα φύγει. Το έχει δοκιμάσει, έχει ξεπεράσει όρια, έχει διασχίσει γραμμές, κι εκείνος έμεινε κάθε φορά. Έτσι το νευρικό της σύστημα χαλαρώνει αρκετά ώστε να βγουν τα άσχημα κομμάτια, όχι επειδή δεν νοιάζεται αλλά επειδή πιστεύει ότι εκείνος θα τα απορροφήσει. Το κείμενο τονίζει ότι όταν ένας άντρας σε αφήνει να τον πληγώσεις δεν είναι αδυναμία αλλά επιλογή, σε διαλέγει αντί για την περηφάνια του. Αν δεν νοιαζόταν, δεν θα μπορούσες να τον πληγώσεις καθόλου. Όμως η υπομονή δεν είναι άπειρη. Όταν ένας καλός άντρας σταματά να προσπαθεί, δεν μαλώνει ούτε εκλιπαρεί, σωπαίνει, και τότε δεν υπάρχουν δεύτερες ευκαιρίες.", "x": "Why does she give her worst behavior to the man who treats her best? Psychology says it's not coincidence, it's safety. She knows he won't leave. She's tested it, pushed limits, crossed lines, and every time, he stayed. So her nervous system relaxes just enough to let the ugliest parts come out. Not because she doesn't care, because she believes he'll absorb it. Here's what most people get wrong. When a man lets you hurt him, it's not weakness, it's choice. He chooses you over his pride, over being right, over protecting himself. He holds space for your anger because he sees the pain underneath it. If this feels uncomfortable, pause for a second. Here's the truth that matters. If he didn't care, you wouldn't be able to hurt him at all. The only reason your words cut is because he trusted you with his heart. But patience isn't infinite. And when a good man finally stops trying, he doesn't fight, he doesn't beg, he goes quiet. And when that happens, there are no second chances. Follow for psychology that explains love before it turns into regret."}, {"f": "DW_dBXoB36M.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που αναλύει την αφηγηματική τεχνική του Ματ Ντέιμον μέσα από μια ιστορία του. Ο Ντέιμον περιγράφει το πιο τρελό πράγμα που έχει δει: έναν ποδοσφαιρικό αγώνα στην Αργεντινή, όταν πήγε τα Χριστούγεννα στην οικογένεια της συζύγου του. Ο θείος της συζύγου του δέχτηκε να πάνε στον τελικό της Μπόκα Τζούνιορς με την προϋπόθεση χωρίς γυναίκες, χωρίς παιδιά. Ο Ντέιμον κατάλαβε γιατί όταν είδε τρία αστυνομικά μπλόκα, προσωρινή περίφραξη με συρματόπλεγμα και αστυνομικούς με εξοπλισμό ταραχών. Οι καλύτερες θέσεις ήταν άδειες γιατί από εκεί μπορούσαν να πετάξουν αντικείμενα και να χτυπήσουν ο ένας τον άλλον. Ο αναλυτής εξηγεί ότι ο Ντέιμον χτίζει προσμονή από την πρώτη πρόταση και προσθέτει λεπτομέρειες που αυξάνουν την περιέργεια, μια τεχνική που μπορεί να εφαρμοστεί στην αφήγηση κάθε ιστορίας.", "x": "The craziest thing I've ever seen without a doubt, though, is a soccer game in Argentina. My wife's from Argentina. We went to spend Christmas there about eleven, twelve years ago. Her family's team, Boca Juniors, which is a very popular team in, in, uh, Buenos Aires, is, is in the f-- this final. And I say to my uncle, well, to her uncle, you know, \"Hey, can we go, can we go to this game?\" And he gets this very serious look on his face, and he's like \"We can go. We can go\" he says in Spanish. \"We can go.\" He goes, \"No women, no children.\" I was like, \"What?\" Like I thought, you know, I was gonna take the kids, and we were gonna go to soccer- Go to the game, yeah. Well, I saw why when we went because we had to get through, I think, three police barricades. There was temporary fencing with barbed wire put up. I mean, it was just absolute madness, and police with riot gear outside. And if this is the, is the, the field, people were sitting here, and people were sitting here, kind of like as if in the two end zones, what would be end zones of, of our football, and there was nobody sitting. In the best seats, right? 'Cause that was the distance that people could throw things and hit each other. Did you catch what he did here? Matt Damon is a master at building anticipation. His very first sentence, \"The craziest thing I've ever seen, was a soccer game in Argentina.\" Boom. That one sentence gets us super curious. Now we need to hear what happened there. But he doesn't stop there. He keeps adding those juicy details, like his uncle saying, \"We can go, but no women, no children.\" In that moment, we're just thinking, \"Wait, what kind of game is this?\" Every single sentence he says makes you more curious about what's coming next. That's the technique. Before you get into the main problem or event, build it up. Say something like, \"The strangest thing happened to me last week,\" or, \"Just when I closed my laptop, I got a call that changed my life forever.\" That way, you're selling what is about to come. Follow for more tips to become a magnetic storyteller."}, {"f": "DXHp1AECI_5.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που εξηγεί το φίλτρο αντίληψης του εγκεφάλου. Ζητά να διαλέξεις την επιλογή που σου φαίνεται πιο ρεαλιστική χωρίς να το σκεφτείς πολύ. Αυτό που διάλεξε ο εγκέφαλός σου αποκαλύπτει ότι δεν αξιολογεί όλες τις επιλογές ισότιμα, αλλά πρώτα φιλτράρει και μετά αποφασίζει. Αυτό σημαίνει ότι μια ευκαιρία μπορεί να υπάρχει, αλλά επειδή ο εγκέφαλος τη θεωρεί μη ρεαλιστική, την αγνοεί σαν να μην ήταν ποτέ επιλογή. Αυτό ονομάζεται φίλτρο αντίληψης: ο εγκέφαλος αποκλείει αυτόματα ό,τι του φαίνεται μη ρεαλιστικό, και αυτό το φίλτρο διαμορφώνει τη ζωή σου περισσότερο από τις ίδιες τις ευκαιρίες. Δεν μπορείς να διαλέξεις αυτό που ο εγκέφαλός σου δεν σε αφήνει καν να δεις. Το μήνυμα είναι ότι τα όρια των δυνατοτήτων μας τίθενται συχνά από εσωτερικές πεποιθήσεις και όχι από την εξωτερική πραγματικότητα, και ότι η διεύρυνση της οπτικής είναι το πρώτο βήμα.", "x": "Pick the option that feels most realistic to you. Don't overthink it. What your brain picked is what feels realistic to you, which means your brain doesn't evaluate every option equally. It filters first, and then it decides. And that means an opportunity could be there, but because your brain thinks it's unrealistic, it ignores it like it was never one of the options. This is called perception filter. Your brain automatically filters out what feels unrealistic to you, and that filter shapes more of your life than the opportunities themselves. You cannot choose what your brain doesn't even let you see."}, {"f": "DVJ05syj0Am.mp4", "t": "Βίντεο", "s": "Ένα βίντεο στα πορτογαλικά που χρησιμοποιεί τη μεταφορά ενός φορτηγού που μπαίνει σε πολυσύχναστη λεωφόρο. Το φορτηγό δεν περιμένει να αδειάσει ο δρόμος, γιατί αν περίμενε την ιδανική στιγμή θα έμενε ακίνητο όλη μέρα. Αντίθετα προχωρά αργά, σταθερά και χωρίς να ζητά συγγνώμη, και το περιβάλλον οργανώνεται: τα μικρότερα αυτοκίνητα κόβουν ταχύτητα, σταματούν ή παραμερίζουν. Το μήνυμα είναι ότι ο κόσμος σέβεται την κίνηση. Όσο περιμένεις τον τέλειο συγχρονισμό, τα ιδανικά χρήματα, την ιδανική στήριξη, μένεις ακίνητος στο πλάι της ίδιας σου της ζωής. Ο επιχειρηματίας που περιμένει το τέλειο σενάριο χρεοκοπεί, ο γάμος που περιμένει τέλειο κλίμα ψυχραίνεται. Ο πλούσιος δημιουργεί χώρο, ο μέτριος ζητά άδεια. Το φορτηγό δεν κορνάρει ζητώντας έγκριση, καταλαμβάνει χώρο. Δεν είναι αλαζονεία, είναι κατεύθυνση. Η τέλεια στιγμή είναι επινόηση όσων φοβούνται. Αν δεν υπάρχει, τη δημιουργείς.", "x": "Se o momento perfeito não existe, você precisa criá-lo. Olha essa cena. O caminhão não está esperando a avenida esvaziar. Ele sabe que se esperar o momento ideal, ele vai ficar parado ali o dia inteiro. Então o que que ele faz? Observe. Ele avança. Devagar, firme, sem pedir desculpa. E quando ele avança, algo interessante acontece. Os carros menores reduzem, alguns param, outros desviam, o ambiente se organiza. Presta atenção nisso. O mundo respeita o movimento. Enquanto você fica esperando o alinhamento perfeito, o dinheiro ideal, o apoio ideal, a segurança ideal, a confiança ideal, você continua parado no acostamento da sua própria vida. Empreendedor que espera o cenário perfeito quebra, casamento que espera o clima perfeito esfria, família que espera estabilidade perfeita nunca prospera. O rico cria espaço, o medíocre pede permissão. O caminhão não buzina pedindo autorização, ele ocupa. Não é uma arrogância, é direção. Quem tem direção cria o momento, quem não tem direção cria desculpa. O tráfego não abre espaço pra quem hesita, ele abre pra quem avança. Agora eu quero saber, em que área da sua vida você está parado esperando os carros passarem? Negócio, relacionamento, dinheiro, decisão que você sabe que já precisava de tomar? Escreve aqui embaixo. Já salva esse vídeo pra nunca mais esquecer. Momento perfeito é invenção de quem tem medo. Se ele não existe, você cria."}, {"f": "DW7BLveDCgP.mp4", "t": "Βίντεο", "s": "Ένα κωμικό μονόλογο του Άντονι για την παράξενη οικογένειά του. Όλοι οι ενήλικες στο σπίτι ήταν δυστυχισμένοι, και εκτός από τη μητέρα, τη γιαγιά, την προγιαγιά και τη θεία του, ζούσε στο σαλόνι ένας άντρας ονόματι Τζον που τον αποκαλούσαν τον ένοικο. Ο Άντονι τον παρατηρούσε σαν τη Τζέιν Γκούνταλ τους χιμπατζήδες. Ο ένοικος τον ρωτούσε για το σχολείο και του έλεγε ότι τον αγαπάει, κάτι που τον έκανε να νιώθει άβολα. Η γιαγιά τον μισούσε γιατί έτρωγε όλο το φαγητό και κολλούσε κίτρινα χαρτάκια με την ένδειξη όχι για τον Τζον. Όταν ένας φίλος του, που επίσης λεγόταν Τζον, ήρθε στο σπίτι και είδε τα χαρτάκια, νόμισε ότι η οικογένεια τον μισεί. Ο Άντονι ανακάλυψε τότε ότι ο ένοικος ήταν στην πραγματικότητα ο παππούς του, που είχε απατήσει τη γιαγιά πριν δεκαπέντε χρόνια, και εκείνη δεν τον συγχώρεσε ποτέ.", "x": "Everybody in my house, every adult, they were just all miserable. It was me, my mom, my grandma, my great-grandma, my aunt, and then we just had a guy who lived in our family room named John that they called the tenant. And I thought, \"Holy, we have no door, no curtain. Zero privacy.\" I would just observe him like Jane Goodall and the chimps. Every day he would be like, \"How's school, Anthony?\" I'd be like, \"Oh, it's going great, John.\" But then he was like someone who's more into a relationship than you are. He'd be like, \"I love you, Anthony.\" And I'd be like, \"We're not there, tenant. Uh- ... I don't know what this is exactly.\" And my grandma hated him 'cause he ate all the food in our fridge. So she marked everything with little yellow Post-it notes, \"Not for John.\" So I never think anything of it. Then first grade I have a friend come over for the first time ever, also named John. Goes to the fridge to get a Yoo-hoo, sees a wall of Post-it notes- ... that all say, \"Not for John.\" He doesn't know any better. He turns to me, he's like, \"Why does your family hate me?\" I was like, \"No, no, that's for the tenant.\" He was like, \"What's a tenant?\" I was like, \"The man I observe.\" Do you ever think your family might be normal, but then you have a friend come over for the first time ever, and by the look on their face you're like, \"Things are afoot. Uh...\" So because of that, later on that night I asked my mom, I was like, \"Why do we call the guy in the living room the tenant?\" She was like, \"Are you serious? We're kidding. You think he's a real tenant?\" I was like, \"Yeah, I'm eight. I don't just know sarcasm, and you're my mom. Who is he?\" And she goes, \"That's your grandfather.\" So what happened, 15 years before I was born, he cheated on my grandmother. She never forgave him. Vindictive Italian woman, riddled with arthritis, can't grip a fork but could hold a grudge. Would not spend money on a divorce, wouldn't let him sleep in the bedroom with her, banishes him to the living room. He has to live like a zoo animal in front of his whole family. Can't eat any of the food in the fridge he paid for, and then I came along, but nobody looped us in on their fun little bit. He doesn't know he's the tenant. I don't know that's my grandfather. So every day he's like, \"I love you, Anthony.\" And I'm like, \"Back off, John.\" Completely altered my perception of marriage too. People would be like, \"What's the worst that could happen? You stay together or get divorced.\" I'd be like, \"There is a third thing, um- ... that is out there.\""}, {"f": "DW6Xqn8D2AM.jpg", "t": "Φωτογραφία", "s": "", "x": ""}, {"f": "DTROADqgQGk.mp4", "t": "Βίντεο", "s": "Ένας σύντομος ορισμός του πλούτου με βάση έναν απλό κανόνα. Είσαι πλούσιος όταν έχεις είκοσι πέντε φορές το ετήσιο κόστος ζωής σου. Αν μπορείς να ζήσεις με χίλια δολάρια τον χρόνο, είσαι πλούσιος αν έχεις είκοσι πέντε χιλιάδες. Αν ο τρόπος ζωής σου απαιτεί ένα εκατομμύριο δολάρια τον χρόνο, τότε χρειάζεσαι είκοσι πέντε εκατομμύρια για να είσαι πλούσιος. Η ιδέα στηρίζεται στην αρχή ότι ο πλούτος δεν είναι απόλυτο ποσό αλλά σχέση ανάμεσα στο κεφάλαιο και τις δαπάνες. Δεν μετράει πόσα έχεις αλλά πόσα χρειάζεσαι για να ζεις, και το πολλαπλάσιο που εξασφαλίζει οικονομική ανεξαρτησία. Όσο χαμηλότερες οι ανάγκες σου, τόσο λιγότερα χρειάζεσαι για να είσαι πλούσιος. Πρόκειται για μια οπτική οικονομικής ελευθερίας που συνδέει τον πλούτο με την αυτάρκεια και όχι με την κατανάλωση, και υπενθυμίζει ότι ο πλούτος ορίζεται τελικά από τον τρόπο ζωής που επιλέγεις.", "x": "You're rich when you have twenty-five times your annual spend. So if you can live on $1,000 a year, you are rich if you have $25,000. If your lifestyle takes a million dollars a year, then you need $25 million to be rich"}, {"f": "DTifm10Ex__.mp4", "t": "Βίντεο", "s": "Ένα απόσπασμα από μια συζήτηση με έναν άνθρωπο εβδομήντα πέντε ετών που τονίζει ότι δεν υπάρχει καμία λυτρωτική αξία στη σκληρότητα. Ό,τι κάνει η σκληρότητα, το κάνει καλύτερα η αγαπητική σταθερότητα. Να είσαι σταθερός αλλά με αγάπη, όχι με σκληρότητα. Αυτό ισχύει για τον τρόπο που φέρεσαι στους άλλους, για τον τρόπο που επιτρέπεις στους άλλους να σου φέρονται, και σε μεγάλο βαθμό για τον τρόπο που φέρεσαι στον εαυτό σου. Ο ομιλητής περιγράφει μια συμφωνία με το σύμπαν: αν δεν είναι ευγενικό, δεν ενδιαφέρεται. Αναφέρεται σε ένα προσαρμοσμένο παιδί μέσα του που μπορεί να γίνει πολύ σκληρό με την ατέλεια του εαυτού του, και λέει ότι σε αυτό το κομμάτι, σε έναν συνάδελφο ή σε έναν φίλο, μπορεί να πει ότι έχεις κάτι να μου πεις και μπορεί να είναι προς το συμφέρον μου να σε ακούσω, αλλά πρέπει να το πεις σαν να είσαι με το μέρος μου. Η κριτική για να λειτουργήσει οφείλει να εκφράζεται από θέση φροντίδας.", "x": "If you get one thing from our conversation today and you only get this, this one thing will be enough to change your life. I mean it. Here's what it is. There is no redeeming value in harshness. There is nothing that harshness does that loving firmness doesn't do better. Be firm, but with love, not harshness. And that's you treating others, that's the way you allow others to treat you, and very much that's the way you treat you. And it's true. At seventy-five, I have a deal with the universe. If it isn't kind, I'm not interested. And that adaptive child that lives inside me can be very harsh to my own imperfection. And I will say to that or to Belinda or to a colleague, \"You may have something to say to me, and it may be in my interest to learn and listen to you, but you have to say it like you're on my side.\""}, {"f": "DWH_yIyEVie.mp4", "t": "Βίντεο", "s": "Ένα βίντεο του Μάικλ που παρουσιάζει πέντε σωματικά σημάδια ότι πρέπει να φύγεις από μια σχέση. Πρώτο, η όσφρηση: κάτι στη φυσική μυρωδιά του άλλου σου φαίνεται ξένο, όχι θέμα υγιεινής, και το σώμα σου αποτραβιέται. Δεύτερο, η αφή: το άγγιγμά του δεν προσγειώνεται καλά, το ανέχεσαι αλλά δεν λιώνεις μέσα του, το σώμα σκληραίνει με μια μικροαπόσυρση. Τρίτο, η όραση: σκανάρεις συνεχώς τον τόνο, το πρόσωπο και τις αντιδράσεις του, είσαι σε επιτήρηση και όχι σε ηρεμία. Τέταρτο, η ακοή: η φωνή του σε βάζει σε ένταση, γιατί ο τόνος μεταφέρει απειλή γρηγορότερα από τις λέξεις. Πέμπτο, η αίσθηση: το σώμα σου δεν νιώθει σαν σπίτι όταν είναι κοντά, η αναπνοή γίνεται ρηχή, το στήθος σφίγγεται. Το κεντρικό μήνυμα είναι ότι μπορείς να παρακάμπτεις το σώμα σου για λίγο, αλλά το νευρικό σύστημα κρατάει σκορ σιωπηλά μέχρι τελικά να το ακούσεις.", "x": "Here's five signs your body's telling you to get out of a relationship. If you're new here, I'm Michael. I help you master your energy so you can up spiral your life. If you're into that, follow me and click the link in my bio. One, smell. Something about their natural scent is off for you. It's not about hygiene, it's just off. You don't wanna get close. You don't wanna breathe them in. That's not you being picky. Your brain is reading incompatibility at a biological level, and it's quietly pulling you back. Two, touch. Their touch, it doesn't land well. You tolerate it, but you don't melt into it. Your body stiffens, even if you pretend it doesn't. There's like a subtle brace, a micro-withdrawal. That's your nervous system saying, \"This doesn't feel safe enough to relax.\" Three, sight. You're always scanning them, their tone, their face, their reactions. You're always reading between the lines, trying to stay ahead of something. That's your amygdala on high alert. You're not at ease, you're on surveillance. Four, sound. Their voice, it puts you on edge. It's not always obvious. Sometimes it's low grade. But your system tightens up when they speak, especially when there's tension, because tone carries threat faster than words, and your body hears it before your mind explains it away. Five, feel. Your body doesn't feel like home when they're around. Your breathing gets shallow. Your chest tightens. Your gut clenches. You feel smaller, more careful, off center somehow. You might call it stress. Your body calls it information. Here's the big truth that most people try to overthink: you can override your body for a little while. You can explain it, minimize it, stay anyway, but your nervous system keeps the score quietly, consistently until you finally listen. Follow me and comment the word up spiral, and I'll send you some more information about my unique manifestation program. In that program, we explore with you the many ways that strong relationships can be the foundation for a fabulous life. Follow me and comment the word up spiral. Vibrant beings, have a great day."}, {"f": "DWVFe1JAVh4.mp4", "t": "Βίντεο", "s": "Ένα απόσπασμα για μια τεχνική απόσπασης ευαίσθητων πληροφοριών μέσω δηλώσεων αντί ερωτήσεων. Το παράδειγμα δείχνει πώς αν πεις σε έναν υπάλληλο πολυκαταστήματος ότι διάβασες πως ανέβασαν τον μισθό σε είκοσι εννιά δολάρια την ώρα, εκείνος θα σε διορθώσει λέγοντας ότι βγάζουν μόνο δεκαοκτώ και οι διευθυντές είκοσι έξι. Στο τέλος της μέρας ο υπάλληλος θα νομίζει ότι το είπε οικειοθελώς, ενώ στην πραγματικότητα απλώς διόρθωσε κάτι που θεώρησε λάθος. Αυτό βασίζεται σε μια έμφυτη ψυχολογική ανάγκη να διορθώνουμε ανακριβείς πληροφορίες. Η τεχνική χρησιμοποιήθηκε ακόμη και στον Ψυχρό Πόλεμο, όπου οι Σοβιετικοί την εφάρμοζαν εναντίον Αμερικανών ναυτικών για να αποσπάσουν ναυτικές πληροφορίες μέσα σε τρία με πέντε λεπτά. Το δίδαγμα είναι ότι μια εσκεμμένα λανθασμένη δήλωση μπορεί να κάνει τον άλλον να αποκαλύψει την αλήθεια από την ανάγκη του να διορθώσει το λάθος.", "x": "Statements are usually better if you want sensitive information. So if you went up to that employee at the department store, if I said, \"Hey, you know, I was just, uh, reading an article online, and I read that you guys all got bumped up to, like, $29 an hour. That's fantastic. That's more than every clothing store pays their people. Um, that's amazing.\" And they'd look at me like, \"What? No, we only make $18 an hour. Managers only make 26.\" So now if at the end of that day, if they look back at that conversation, they're gonna think that they willingly said that. What they did was they corrected something that they thought was incorrect, and this is built into our psychology, this need to correct the record. Mm-hmm. A need to correct information that's presented that's incorrect. This was even used during the Cold War. The Soviets used it against, uh, American sailors to find out naval intelligence, and this is in a matter of three to five minutes."}, {"f": "DV_pSLsABQF.mp4", "t": "Βίντεο", "s": "Ένα σύντομο βίντεο που αντιστοιχίζει τα συναισθήματα με συγκεκριμένα σημεία του σώματος. Αν το νιώθεις στο στήθος είναι φόβος, αν το νιώθεις στο στομάχι είναι διαίσθηση, αν το νιώθεις στο κεφάλι είναι θυμός, αν το νιώθεις σε όλο το σώμα είναι ευτυχία, αν το νιώθεις στους μυς είναι άγχος, αν το νιώθεις στο πρόσωπο είναι αμηχανία, αν το νιώθεις στο στόμα είναι αηδία, αν το νιώθεις στον λαιμό είναι θλίψη, και αν το νιώθεις στα κόκαλα είναι αλήθεια. Πρόκειται για μια απλοποιημένη λαϊκή ψυχοσωματική προσέγγιση που βοηθά τον θεατή να αναγνωρίσει το συναίσθημά του μέσα από τη σωματική αίσθηση. Η ιδέα ότι τα συναισθήματα έχουν σωματικό αποτύπωμα στηρίζεται στην αντίληψη ότι το σώμα εκφράζει όσα το μυαλό δεν έχει ακόμη κατονομάσει. Το μήνυμα ενθαρρύνει την επίγνωση των εσωτερικών σημάτων ως εργαλείο αυτογνωσίας, αν και οι αντιστοιχίσεις είναι περισσότερο διαισθητικές παρά επιστημονικά τεκμηριωμένες.", "x": "How old were you when you found out if you feel it in your chest, that's fear. If you feel it in your stomach, that's intuition. If you feel it in your head, that's anger. If you feel it in your whole body, that's happiness. If you feel it in your muscles, that's anxiety. If you feel it in your face, that's embarrassment. If you feel it in your mouth, that's disgust. If you feel it in your throat, that's sadness. And if you feel it in your bones, that's truth"}, {"f": "DV6410zgkt6.jpg", "t": "Φωτογραφία", "s": "", "x": ""}, {"f": "DVzVKbxgf5g.mp4", "t": "Βίντεο", "s": "Ένα σύντομο βίντεο που συμπυκνώνει όσα έμαθε ο δημιουργός στη σχολή κινηματογράφου σε λιγότερο από τριάντα δευτερόλεπτα. Το περιεχόμενο υπερισχύει πάντα της τεχνικής. Αυτό που δεν λέει το θέμα σου είναι πολύ πιο ενδιαφέρον από αυτό που λέει. Κάθε μεγάλη ταινία είναι απλώς κάποιος που θέλει κάτι και δεν μπορεί να το αποκτήσει. Οι θεατές δεν θυμούνται τα πλάνα αλλά τους χαρακτήρες. Τα ζουμ είναι κακά. Και αν δεν μπορείς να εξηγήσεις γιατί κάτι υπάρχει εκεί, κόψε το. Το βίντεο κλείνει με το αστείο ότι μόλις σου εξοικονόμησε πολλά χρήματα από δίδακτρα. Είναι μια συμπυκνωμένη σειρά αρχών κινηματογράφησης και αφήγησης που τονίζει την ουσία πάνω από το εντυπωσιακό, τη δραματουργία της επιθυμίας και της σύγκρουσης, τη σημασία των χαρακτήρων και την αξία της οικονομίας στο μοντάζ, όπου κάθε στοιχείο που δεν δικαιολογείται αφαιρείται.", "x": "Here's everything I learned in film school in less than 30 seconds. Content over technique always. What your subject isn't saying is way more interesting than what they are saying. Every great film is just someone wants something and they can't get it. People don't remember shots, they remember characters. Zooms are bad. And if you can't explain why it's there, cut it. And there you go. I just saved you a bunch of money in tuition."}, {"f": "DVohTwcDgwG.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που υποστηρίζει ότι οι ελίτ εξασκούν πράγματι τον αποκρυφισμό, αλλά και εσύ το κάνεις, απλώς πολύ άσχημα επειδή δεν ξέρεις τι κάνεις. Ο αποκρυφισμός σημαίνει κρυμμένη γνώση, που κρύφτηκε εν μέρει επειδή η Καθολική Εκκλησία σκότωνε ανθρώπους που ήξεραν πράγματα που δεν έπρεπε. Οι μυστικές εταιρείες δημιουργήθηκαν για να διατηρήσουν τη γνώση, αλλά κυριαρχήθηκαν από αριστοκράτες. Το πρώτο μάθημα είναι ότι η πραγματικότητα που βιώνεις δεν είναι η ίδια η πραγματικότητα, αλλά η πραγματικότητα όπως την απορροφούν οι αισθήσεις, την επεξεργάζεται ο εγκέφαλος και τη φιλτράρει το εγώ. Ο μάγος επιδιώκει κυριαρχία πάνω στην πραγματικότητα. Η βασική αρχή είναι όπως πάνω έτσι και κάτω: αν αλλάξεις κάτι σε ένα επίπεδο, αλλάζει σε όλα. Δεν μπορείς να αλλάξεις τις πληροφορίες που δίνουν οι αισθήσεις, αλλά αν αλλάξεις τον τρόπο που τις επεξεργάζεσαι, αλλάζεις την πραγματικότητα από τη δική σου οπτική.", "x": "Can you believe the elites are actually practicing the occult and doing magic? Yes, and so are you. You're just doing it very badly because you don't know what you're doing. So I'm gonna give you your first lesson. First, what is the occult? The occult means hidden knowledge. Now, a lot of the reason the knowledge in question became hidden is because the Catholic Church used to murder people for knowing stuff they weren't supposed to know. Secret societies started forming in order to preserve the knowledge and continue the practices associated with it. The thing is, the societies became largely populated by aristocrats whose claim to nobility came from the very same God that the church was banning knowledge in the name of. So we ended up with a situation where the people who had access to knowledge and the people who controlled what knowledge the general population had access to were kind of the same people, which, you know, is so different from today. Thank God. Okay, so lesson number one is reality exists in your mind, which is not true. Obviously, reality exists in some objective sense independently of you, probably. But the reality you experience isn't reality. It's reality after being absorbed by your senses, processed by your brain, and then filtered through your ego to create an intelligible, functional model of the world that you can interact with in order to thrive and survive. Now, what the occult practitioner, the magician, is trying to accomplish is mastery over reality. One of the basic principles is as above, so below, which also means as below, so above. Basically, if you make a change on any level, you make a similar change on every level. So you can't change the information that reality gives your senses, but if you change the way you process that information and change the way your ego relates to it, you change reality from your perspective. Right? You can't stop the wind from blowing, but you can stop it from blowing you off course, which means it may as well not exist from your perspective. You mastered the wind without changing the wind, but by changing yourself. This is how manifestation works. It's really just cause and effect. If you believe that you're confident and capable of success, then you'll act accordingly, which will make other people believe it too, and they will trust you with responsibilities that will lead to opportunity and success. The core of that lesson is basically that mastery of reality and mastery of the mind are the same, which brings us onto the whole ritualistic magic thing. See, a lot of this is self-hypnosis. Most people are not capable of just changing how they see reality by choice, so they need a bit of a song and dance to convince themselves that it's real. And the more extreme of a belief you're trying to implant, the more extreme the ritual needs to be in order to, uh, be convincing. Basically, they're not sacrificing an innocent for some supernatural fire daddy to give them power over you. The ritual is to give them power over themselves. The thing they're sacrificing is their own innocence, their own morality, their own compassion, their own humanity. The thing they're trying to become is something above morality, above humanity, in order to rule unburdened by human concerns like right and wrong or good and evil. The type of ritual that actually gives them power over you are things like this. Controlling what human beings collectively believe that reality is gives them control of reality from the human perspective. Because if you make it true on one level, it becomes true on every level. I want to be clear that this was just kind of a surface level crash course. There's an awful lot of additional information that could be added. So if you're thinking, like, it's not just this or it's not just that, it's not all just in the mind, then I'd like to remind you that the word just there kind of implies that you believe you know what the mind is and how deep the rabbit hole actually goes."}, {"f": "DUriumakTk9.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που εξηγεί τη θεωρία του καμένου τοστ μέσα από ένα προσωπικό περιστατικό σε μια διασταύρωση. Η θεωρία λέει ότι μια μικρή αναστάτωση, όπως το να ξαναφτιάξεις το τοστ σου, μπορεί να αλλάξει τον συγχρονισμό σου αρκετά ώστε να σε οδηγήσει σε κάτι καλύτερο ή να σε προστατέψει από κάτι χειρότερο. Ο ομιλητής είχε πράσινο φως όταν ένα αυτοκίνητο βγήκε από λάθος πλευρά του πάρκινγκ και κόντεψαν να συγκρουστούν. Δεν τραυματίστηκε μόνο επειδή δεν έφτασε νωρίτερα, και δεν έφτασε νωρίτερα επειδή νωρίτερα πάτησε φρένο για να δώσει χώρο σε κάποιον οδηγό. Αναφέρει τον Πάουλο Κοέλιο και την ιδέα ότι το σύμπαν συνωμοτεί για να σε βοηθήσει να κερδίσεις. Η συνωμοσία για να σε βοηθήσει μεταμφιέζεται σε αναστάτωση: το κόκκινο φανάρι που αργεί, ο αργός οδηγός. Ίσως η καθυστέρηση δεν είναι εναντίον σου, ίσως σε τοποθετεί. Το να γυρνάς σπίτι είναι η πιο υποτιμημένη ευλογία.", "x": "Do you see that traffic light? Do you see that parking garage? This intersection is where I experienced the burnt toast theory in real time, and it changed the way I experience frustrations in my life. The burnt toast theory, it says that a small inconvenience like remaking your toast can change your timing just enough to guide you to something better or to protect you from something worse. I was headed through this intersection, and I had the green light, and a car flew out of the parking garage from the wrong side, headed in the opposite direction, and we missed each other by inches. This happened years ago, and I still think about it because the only reason I did not get into an accident is because I wasn't there any sooner. And the only reason I wasn't there any sooner is because earlier, I tapped on my brakes and gave space to someone who I thought was either a new driver or someone who was lost. Paulo Coelho, in his book The Alchemist, talks about the universe having a conspiracy to help you win. The biggest win of all is you making it home at the end of the day. The conspiracy to help you win will be disguised as an inconvenience. It's that red light that takes too long. It's that person who's too slow to move when that light turns green, and it's that person camping on the fast lane. So maybe the delay is not against you. Maybe it's positioning you. Maybe it's adjusting your timing by a few seconds that you cannot see. If you're going to believe in a conspiracy, believe in the one that's trying to get you to make it home at the end of the day. Making it home is the most underrated blessing we have, and every time I wipe my shoes on the mat, that is my cue to say thank you because nothing about today was guaranteed."}, {"f": "DVi6wNNjVGr.mp4", "t": "Βίντεο", "s": "Μια συγκινητική συνέντευξη της Λιν από την Ολλανδία για μια φιλία που άλλαξε τη ζωή της. Πριν πέντε χρόνια γνώρισε μια γυναίκα εξήντα πέντε ετών και έγιναν πολύ καλές φίλες. Μια μέρα έλαβε τηλεφώνημα ότι η φίλη της ήταν στο νοσοκομείο, δεν μπορούσε να αναπνεύσει και έφτυνε αίμα. Όταν έφτασε, η φίλη της ήταν ήδη σε βαθύ ύπνο και οι γιατροί είπαν ότι είχε καρκίνο σε όλο της το σώμα και θα πέθαινε σε λίγες μέρες. Η Λιν κάθισε δίπλα της κρατώντας της το χέρι και της είπε ότι μπορεί να πεθάνει αν θέλει, και η φίλη της πέθανε ενώ την κρατούσε. Μετά από αυτό η Λιν φοβήθηκε τον ξαφνικό θάνατο και τους αποχαιρετισμούς. Το μόνο που μετανιώνει είναι ότι δεν της είπε ποτέ ότι την αγαπούσε, γιατί της φαινόταν περίεργο να το πει σε μια ηλικιωμένη που δεν ήταν γιαγιά ή μητέρα της. Μοιράζεται την ιστορία της για να νιώσει ότι η φίλη της φαίνεται και ακούγεται.", "x": "What's an experience that changed your life? Five years ago, I've met this woman. Uh, she was 65 at the time, and then we became really good friends, and the friendship lasted for five years, I think. Suddenly, one day I got a call from her that she was in the hospital, and she said she couldn't breathe and she was spitting blood. Then I went there, and she was already in a big sleep. Um, and then they s- they said she had cancer all through her body, and there was... she was going to die in like a few days. And I was sitting with her and holding her hand, and I said to her like, \"You, you can die if you want to. If you have to go, you go.\" And then she died while we held her. And I think after that I got really scared of people suddenly dying or, like, saying goodbye to people. Is there anything you regret not saying to her? I never said I loved her. I've never said that, and I regret that, that I never did, because it feels strange to say that to an elderly woman who isn't your grandmother or your mother. But I do, so I regret that. I talk to a lot of people about it. I share her story because I want her to be seen and heard, and that helps me also deal with it. What's your name, and where are you from? My name is Lynn, and I'm from Holland."}, {"f": "DVjBiwlji6Z.mp4", "t": "Βίντεο", "s": "Ένα απόσπασμα για την παθολογική ζήλια μέσα από τη σκέψη του Ζακ Λακάν. Ακόμη κι αν είναι αντικειμενικά αληθινό ότι η σύζυγός σου σε απατά, η ζήλια σου παραμένει παθολογική. Το ζήτημα που θέτει ο Λακάν δεν είναι αν προσέλαβες αρκετά καλό ιδιωτικό ντετέκτιβ ή αν του ξέφυγε κάτι, αλλά γιατί είσαι τόσο προσκολλημένος στο ερώτημα αν σε απατά ή όχι. Γιατί χρειάζεται να συντηρείς την ταυτότητά σου μέσα από την υποψία, έστω και ελάχιστη, ότι η σύζυγός σου σε απατά; Αυτή είναι η ουσία του πράγματος. Ο ομιλητής προλαμβάνει την αντίδραση ότι το παράδειγμα είναι ακραίο και προτείνει ένα παρόμοιο παράδειγμα σε διαφορετικό επίπεδο, μεταφέροντας τη συζήτηση στη ναζιστική Γερμανία του 1936-1937. Πρόκειται για μια φιλοσοφική προσέγγιση που μετατοπίζει την προσοχή από τα γεγονότα στην ψυχική ανάγκη που κρύβεται πίσω από την εμμονή, αναδεικνύοντας πώς η ταυτότητα χτίζεται συχνά πάνω σε μια υποψία.", "x": "If you are jealous pathologically of your wife, thinking she's cheating on you all the time, and even if, it's a nice point, even if factually it's all true, your jealousy is still pathological. Lacan's point is the question to ask is not, okay, did I hire a good enough private detective? Did he miss something? No. The question is, why am I so fixated on my wife cheating me or not? Why do I need to sustain my identity, a suspicion at least, of my wife is cheating on me? This is the truth of it. And now you will say ridiculous example. Ah, let's take a similar example, but at slightly a different level. Let's imagine we are in, let's say, 36, 37 in Nazi Germany."}, {"f": "DVQ6m9nifNJ.jpg", "t": "Φωτογραφία", "s": "Ένα απόσπασμα του Σενέκα που λέει ότι για να είσαι ευτυχισμένος πρέπει να εξαλείψεις δύο πράγματα: τον φόβο ενός κακού μέλλοντος και τη μνήμη ενός κακού παρελθόντος. Η στωική αυτή θέση τονίζει ότι η ευτυχία δεν εξαρτάται από τις εξωτερικές συνθήκες αλλά από το πού στρέφει το μυαλό την προσοχή του. Ο φόβος για το μέλλον και η προσκόλληση στο παρελθόν είναι δύο μορφές απουσίας από το παρόν, που είναι ο μόνος χρόνος στον οποίο μπορούμε πραγματικά να ζήσουμε. Ο άνθρωπος βασανίζεται από σενάρια που δεν έχουν συμβεί και από πληγές που έχουν ήδη συμβεί, χάνοντας τη στιγμή που υπάρχει τώρα. Ο Σενέκας καλεί σε μια εσωτερική απελευθέρωση από αυτές τις δύο ψυχικές παγίδες, προτείνοντας ότι η γαλήνη έρχεται όταν σταματάμε να τροφοδοτούμε την ανησυχία για το αύριο και την πικρία για το χθες. Είναι μια κλασική διατύπωση της στωικής εγκράτειας και της ζωής στο παρόν.", "x": "\"TO BE\nHAPPY You\nMUST ELIMINATE\nTWO THINGS:\nTHE FEAR OF A BAD\nFUTURE AND THE\nMEMORY OF A BAD\nPAST.\"\n- SENECA"}, {"f": "DU0oQDEiC5A.mp4", "t": "Βίντεο", "s": "Ένα σύντομο κωμικό μονόλογο για μια φιλία με μια κοπέλα από τη Σομαλία. Ο ομιλητής λέει ότι κάνει φίλους από παντού και γνώρισε μια νέα φίλη από τη Σομαλία. Μια μέρα της είπε ότι κάνει πολύ κρύο και ότι κρυώνει, και εκείνη απάντησε ότι αφού είναι από την Πολωνία δεν μπορεί να κρυώνει, υπονοώντας ότι οι Πολωνοί αντέχουν το κρύο. Λίγες μέρες αργότερα, όταν συναντήθηκαν ξανά, εκείνη του είπε ότι πεινάει, και ο ομιλητής κλείνει με την ατάκα ότι δεν μιλάνε πια. Το αστείο στηρίζεται στην αντιστροφή των στερεοτύπων: η κοπέλα από τη Σομαλία ακυρώνει το στερεότυπο ότι οι Πολωνοί αντέχουν το κρύο, ενώ όταν εκείνη λέει ότι πεινάει, ο ομιλητής δεν μπορεί να επιστρέψει ανάλογο σχόλιο και η φιλία τελειώνει. Πρόκειται για χιούμορ πάνω στα εθνικά στερεότυπα και τις παρεξηγήσεις μεταξύ ανθρώπων από διαφορετικές κουλτούρες.", "x": "I've been making, uh, friends from everywhere. I have made a new friend from Somalia. We were hanging out a few weeks ago, and, uh, I said, uh, \"It's very cold outside. I'm feeling cold.\" And she said, \"You're from Poland.\" \"You can't be cold.\" And then I saw her a few days ago, and she said, \"I'm hungry.\" We don't talk anymore."}, {"f": "DUvwLD_CDBl.mp4", "t": "Βίντεο", "s": "Ένα σύντομο βίντεο στα γερμανικά που δείχνει κάποιον να καθοδηγεί ένα άλλο άτομο σε μια δραστηριότητα μέσα στο νερό, πιθανώς καταδύσεις ή κολύμβηση με εξοπλισμό αναπνοής. Ο ομιλητής δίνει οδηγίες όπως μη γελάς, τώρα ξανά την άλλη πλευρά μέσα, και μετά σου δίνουμε λίγες ανάσες, τώρα εσύ, ναι εκεί μέσα, όχι αλλιώς, ναι εκεί πάει ήδη, όχι εκεί πάνω, όχι όχι πρέπει πάλι στη δεξαμενή. Ο τόνος είναι καθοδηγητικός και ενθαρρυντικός, σαν εκπαιδευτής που βοηθά έναν αρχάριο να εξοικειωθεί με την αναπνοή μέσα στο νερό. Το βίντεο φαίνεται να καταγράφει μια στιγμή εκμάθησης ή εξάσκησης, με τον ομιλητή να διορθώνει την τεχνική του άλλου ατόμου και να το ενθαρρύνει να συνεχίσει. Το περιεχόμενο είναι σύντομο και αποσπασματικό, χωρίς βαθύτερο νόημα πέρα από την πρακτική καθοδήγηση σε μια δραστηριότητα που σχετίζεται με το νερό και την αναπνοή.", "x": "Nicht lachen. So, und jetzt die andere Seite noch mal rein und okay. So, jetzt lassen wir dich jetzt ein paar Atemzüge. So, du mal jetzt. Ja, da rein. Nein, anders. Doch, da geht schon. Nein, da hoch, da. Nein, nein, ich muss wieder ins Becken. Die erste ist gut."}, {"f": "DUtv_cYksiO.mp4", "t": "Βίντεο", "s": "Ένα πολύ σύντομο δίγλωσσο μήνυμα που αναμειγνύει γαλλικά και αγγλικά: ίσως δεν μπορείς να γευτείς, αλλά μπορείς να νιώσεις. Πρόκειται για μια αινιγματική, σχεδόν ποιητική φράση που παίζει με την αντίθεση ανάμεσα στη γεύση ως αισθητηριακή λειτουργία και στο συναίσθημα ως βαθύτερη εμπειρία. Το νόημα μπορεί να διαβαστεί με πολλούς τρόπους: ίσως αναφέρεται σε κάποιον που έχει χάσει την αίσθηση της γεύσης, ή μεταφορικά σε κάποιον που δεν μπορεί να εκτιμήσει κάτι με τις αισθήσεις αλλά μπορεί να το βιώσει συναισθηματικά. Η αντίθεση γεύση εναντίον αίσθησης υποδηλώνει ότι η ουσιαστική εμπειρία δεν περνά πάντα από τις αισθήσεις αλλά από το συναίσθημα. Το μήνυμα έχει έναν τόνο παρηγοριάς και ευαισθησίας, υπονοώντας ότι ακόμη κι όταν κάτι δεν μπορεί να βιωθεί με τον συνηθισμένο τρόπο, παραμένει δυνατό να το νιώσεις βαθιά. Είναι ένα σύντομο, φιλοσοφικό απόσπασμα που προσκαλεί σε προσωπική ερμηνεία.", "x": "Peut-être que tu ne peux pas goûter, but you can feel"}, {"f": "DSVhMl3CaC_.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που εξηγεί πώς τα προβλήματά μας μετατρέπονται από κάτι που έχουμε σε κάτι που προστατεύουμε. Το σώμα δεν είναι μόνο σάρκα και κόκαλο αλλά και φαρμακείο: κάθε σκέψη απελευθερώνει μια χημική ουσία, το στρες κορτιζόλη, ο φόβος αδρεναλίνη, ο μηρυκασμός νορεπινεφρίνη. Όταν αυτές απελευθερώνονται συχνά, το σώμα αρχίζει να εξαρτάται από αυτές, όχι επειδή νιώθουν καλά αλλά επειδή είναι οικείες. Το πρόβλημα γίνεται χημικό και όχι συναισθηματικό. Το νευρικό σύστημα μαθαίνει το ακριβές κοκτέιλ που παράγει το στρες σου και αναδημιουργεί τις καταστάσεις που το τροφοδοτούν. Όταν ένα πρόβλημα εξαφανίζεται, το σώμα πανικοβάλλεται γιατί έχασε τη δόση του, και το υποσυνείδητο προστατεύει το πρόβλημα, επαναλαμβάνοντας την ιστορία και το στρες. Η ταυτότητά σου χτίζεται πάνω σε αυτό για το οποίο παραπονιέσαι περισσότερο, γιατί αυτό κρατά το φαρμακείο ανοιχτό. Η ηρεμία μοιάζει βαρετή και η σιωπή λάθος, μέχρι το σώμα να μάθει νέα χημική βάση.", "x": "This is going to feel very uncomfortable, but if you can get through it without swiping away, you're gonna be that much stronger for it. At some point, your problems stop being something you have and start being something that you protect. Please hear me when I say this because it'll all make sense, I promise. At some point, your problems stop being something that you have and start being something that you protect. Most people think they want their problems gone, but what they're actually addicted to is what their problems produce. Because your body is not just flesh and bone, it's actually a pharmacy. Every thought you think releases a chemical. Stress releases cortisol. Fear releases adrenaline. Rumination, it releases norepinephrine. And here's the part no one connects. When those chemicals are released often enough, the body starts to depend upon them, not because they feel good, but because they're familiar. So the problem stops being emotional, and it becomes chemical. Your nervous system learns the exact cocktail your stress produces, and once the body learns a chemical pattern, it will recreate the situation that delivers it. That's why people stay in cycles they swear they want to escape. The mind tells a story, but the body, it collects the drugs. And the brain doesn't care if the pharmacy is destroying you. It only cares that the supply is consistent. Here's the trap. When a problem disappears, the chemical supply disappears with it, and the body panics. It's not because you lost the problem, but because the body lost the dose. So the subconscious does something dangerous. It protects the problem. It rehearses the story. It recreates the stress, all to stay chemically familiar. Your identity is built on what you complain about most because what you complain about keeps the pharmacy open. And until the body learns a new chemical baseline, peace will feel boring, calm will feel unsafe, and silence will feel wrong. So if you've ever wondered why chaos feels normal and stillness feels uncomfortable, this is why. You're not broken. You're chemically conditioned, and the moment you stop feeding the pharmacy is the moment your life will start to change."}, {"f": "DUYIMcyAFx6.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που αντιστοιχίζει τα συναισθήματα με σημεία του σώματος, με τον ομιλητή να δηλώνει ότι έμαθε αυτή τη γνώση μόλις σήμερα. Αν το νιώθεις στο στήθος είναι φόβος, στο στομάχι διαίσθηση, στο κεφάλι θυμός, σε όλο το σώμα ευτυχία, στους μυς άγχος, στο πρόσωπο ντροπή, στο στόμα αηδία και στον λαιμό θλίψη. Πρόκειται για μια απλοποιημένη ψυχοσωματική αντιστοίχιση που βοηθά στην αναγνώριση των συναισθημάτων μέσα από τις σωματικές τους εκδηλώσεις. Η ιδέα στηρίζεται στην παρατήρηση ότι κάθε συναίσθημα έχει χαρακτηριστικό σωματικό αποτύπωμα, και ότι η προσοχή σε αυτό μπορεί να λειτουργήσει ως εργαλείο αυτοεπίγνωσης. Το βίντεο ενθαρρύνει τον θεατή να παρατηρεί πού εντοπίζει κάθε αίσθηση για να κατανοήσει καλύτερα τι νιώθει. Αν και οι αντιστοιχίσεις είναι περισσότερο διαισθητικές παρά αυστηρά επιστημονικές, το μήνυμα προωθεί μια σχέση εγγύτητας με το σώμα ως δρόμο προς τη συναισθηματική κατανόηση.", "x": "I was today years old when I learned this. If you feel it in your chest, it's fear. If you feel it in your stomach, it's intuition. If you feel it in your head, it's anger, and if you feel it throughout your body, it's happiness. If you feel it in your muscles, it's anxiety. If you feel it in your face, it's shame. If you feel it in your mouth, it's disgust, and if you feel it in your throat, it's sadness."}, {"f": "DUmGs8JjLjL.mp4", "t": "Βίντεο", "s": "Ένα εξαιρετικά σύντομο απόσπασμα στα ισπανικά όπου κάποιος λέει όχι, όχι, συγγνώμη, ευχαριστώ. Πρόκειται για
