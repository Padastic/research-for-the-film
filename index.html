ται ώστε όταν ένα μικρό παιδί τους αγκαλιάζει, να μην το αφήνουν μέχρι να το αφήσει πρώτα εκείνο. Δηλαδή αγκαλιάζεις το παιδί για όσο εκείνο θέλει να σε αγκαλιάζει. Ο συνομιλητής βρίσκει αυτόν τον κανόνα υπέροχο και προτείνει να τον εφαρμόσουμε και με τους φίλους μας, αγκαλιάζοντας τον φίλο μας μέχρι εκείνος να αφήσει πρώτος. Πρόκειται για ένα γλυκό, ανθρώπινο μήνυμα για την αξία της αγκαλιάς και της συναισθηματικής σύνδεσης, που υπογραμμίζει τη σημασία του να αφήνουμε τον άλλο να ορίζει τη διάρκεια της τρυφερότητας, χωρίς να βιαζόμαστε να αποτραβηχτούμε πρώτοι.", "x": "You know the rule at Disney, Nick, the Disney rule for hugging? No. I learned this recently. Tell me. It's the best thing in the world. At Disney, all of the characters are trained that when a little kid hugs you, you may not let go until the l- kid lets go first. Oh, that's so good. Isn't that the best? You hug the kid as long as the kid wants to hug you. And now do that with a friend. Hug your friend until they let go. You know, apply the Disney rule"}, {"f": "DMS-EWBIust.mp4", "t": "Βίντεο", "s": "Ο ομιλητής εξηγεί πώς να κάνεις οτιδήποτε δέκα φορές πιο ελκυστικό, χρησιμοποιώντας το παράδειγμα ενός στυλό. Αν θέλεις να φανεί πιο ελκυστικό χωρίς να αλλάξεις τίποτα, δείξε πρώτα κάτι χειρότερο, και τότε αυτό θα φανεί πολύ καλύτερο. Στην ψυχολογία αυτό ονομάζεται φαινόμενο της αντίθεσης. Δεν κρίνουμε τα πράγματα όπως είναι, αλλά σε σύγκριση με ό,τι είδαμε αμέσως πριν. Αν είχες ένα απαίσιο ραντεβού, το επόμενο μέτριο θα φανεί υπέροχο. Γι' αυτό οι έμποροι δεν αφαιρούν ποτέ την αρχική τιμή αλλά τη διαγράφουν, ώστε να συγκρίνεις τη νέα με την παλιά και η νέα να φαίνεται λογική. Το συμπέρασμα είναι ότι αν θέλεις κάτι να ξεχωρίσει, βάλε το να έρθει μετά από κάτι χειρότερο. Πρόκειται για εκλαϊκευμένη ψυχολογία με πρακτική εφαρμογή στο μάρκετινγκ.", "x": "How to make anything 10 times more attractive. If I want to make this pen more attractive without changing anything, what I would do is right before you saw that, I will show this to you. So when suddenly you see this, you would naturally think this is much more attractive. In psychology, this is called the contrast effect. We don't judge things as they are. We judge them based on what we saw right before. If you just had a terrible date, your next average date would feel amazing. And that's also why marketers never remove the original price. They just cross it out so you naturally compare the new price to the old one, and suddenly the new one sounds reasonable. So if you want something to stand out, let it come after something worse."}, {"f": "DM8E_wlo-0O.mp4", "t": "Βίντεο", "s": "Ο ομιλητής εξηγεί τι κάνει πραγματικά τους ανθρώπους να λένε ναι, και αποδίδει τα πάντα στη νοητική προσομοίωση. Πριν πάρει μία απόφαση, ο εγκέφαλος προσπαθεί να φανταστεί το αποτέλεσμα. Αν ενεργοποιήσεις αυτή τη νοητική προσομοίωση, οι άνθρωποι είναι πιο πιθανό να πουν ναι. Για παράδειγμα, αν ζητάς από κάποιον να βγει μαζί σου, πρέπει να περιγράψεις και να ζωγραφίσεις πώς θα είναι η μέρα. Οι έμποροι το χρησιμοποιούν διαρκώς: γι' αυτό αγοράζουμε πιο εύκολα ένα ρούχο όταν το βλέπουμε σε μοντέλο, και γι' αυτό οι ταινίες έχουν τρέιλερ, γιατί επιταχύνουν τη διαδικασία της νοητικής προσομοίωσης. Πρόκειται για εκλαϊκευμένη ψυχολογία της πειθούς, που εξηγεί πώς η δημιουργία νοερών εικόνων του αποτελέσματος αυξάνει την πιθανότητα συμφωνίας.", "x": "What actually makes people say yes to you? Psychology shows that it comes down to one thing called mental simulation. So what it means is just before making a decision or saying yes to something, your brain tries to imagine the outcome. That's why if you trigger that mental simulation, people are more likely to say yes. For example, if you're asking someone to go out with you, you should describe and paint the day of how it would look like. Marketers use this all the time. That's why we're more likely to buy a piece of clothes when we see it on a model. And that's why movies have trailers. It fastens the mental simulation process."}, {"f": "DLqZ_nMusbC.mp4", "t": "Βίντεο", "s": "Ο ομιλητής περιγράφει το πώς η συνεχής σεξουαλική απόρριψη, με φράσεις όπως «όχι απόψε, αγάπη μου, είμαι κουρασμένη», για πέντε, δέκα ή δεκαπέντε χρόνια, δεν είναι απλώς απόρριψη αλλά διάβρωση. Μιλά για το πώς ζητάμε από τους άνδρες να είναι πιστοί και δυνατοί, αλλά κανείς δεν μιλά για το τι παθαίνει ένας άνδρας που νιώθει διαρκώς ανεπιθύμητος. Δεν πρόκειται για απαίτηση αλλά για συναισθηματική πείνα. Ένα ζευγάρι από σύζυγοι γίνεται πλατωνικοί συγκάτοικοι. Η σεξουαλική απόρριψη διαλύει την αυτοπεποίθηση, τη σύνδεση και την ψυχική υγεία, μετατρέποντας την αγάπη σε μνησικακία. Ο πόνος αλλάζει τον άνδρα και αυτή η αλλαγή απομακρύνει ακόμα περισσότερο τη σύντροφό του. Γι' αυτό η οικειότητα και η επικοινωνία έχουν σημασία, γιατί ένας γάμος χωρίς στοργή δεν είναι γάμος αλλά επιβίωση.", "x": "Imagine hearing, \"Not tonight, babe, I'm too tired,\" over the course of five, ten, fifteen-plus years. That's not just rejection, that's erosion. We talk about how men should be loyal, strong, and self-controlled, but no one talks about what it does to a man who always feels unwanted. This isn't about entitlement. It's about emotional starvation. It's about going from a husband and wife to platonic roommates and wondering, how did we get here? Sexual rejection doesn't just hurt. It breaks down confidence, connection, even mental health. It turns love into resentment. It turns a strong man into someone who is constantly questioning his worth. And here's the cruelest part. That pain, the emotional weight, it changes him, and that change pushes her even further away. This is why intimacy matters. This is why communication matters. Because marriage without affection, it isn't marriage, it's survival."}, {"f": "DN5vC6uiMIi.mp4", "t": "Βίντεο", "s": "Σύντομο απόσπασμα διαλόγου με νοσταλγικό τόνο. Κάποιος ρωτά τι σκέφτεται ο άλλος, και εκείνος απαντά «εσένα, όπως πάντα». Ο πρώτος ήλπιζε να ακούσει ότι άλλαξε, και ρ \ncan have the worst days of\nyour life and a few weeks\nlater you can have the best\nday of your life. Don't give\nup. Keep going."}, {"f": "DL7vcNxTFyW.mp4", "t": "Βίντεο", "s": "Ένα πολύ σύντομο, αποσπασματικό κείμενο με τη φράση «Μπορώ να πω ότι το γρασίδι είναι», που διακόπτεται απότομα. Πρόκειται πιθανώς για την αρχή του γνωστού ρητού «το γρασίδι είναι πιο πράσινο στην άλλη πλευρά», ή για στίχο τραγουδιού με παρόμοιο νόημα. Το απόσπασμα είναι τόσο κολοβό που δεν μπορεί να εξαχθεί κάποιο πλήρες νόημα. Η φράση για το γρασίδι χρησιμοποιείται συνήθως για να περιγράψει την τάση των ανθρώπων να πιστεύουν ότι αλλού τα πράγματα είναι καλύτερα, ενώ συχνά δεν είναι. Πρόκειται πιθανώς για στίχο τραγουδιού ή για έναρξη ενός αποφθέγματος που κόπηκε λόγω σύντομης διάρκειας ή σφάλματος μεταγραφής. Χωρίς περισσότερο πλαίσιο, το περιεχόμενο είναι απλώς μία ελλιπής φράση χωρίς ολοκληρωμένο μήνυμα.", "x": "I can tell that the grass is"}, {"f": "DLmGBcEOi94.mp4", "t": "Βίντεο", "s": "Ο ομιλητής αφηγείται μία ιστορία με ηθικό δίδαγμα. Ένα μικρό πουλί ήταν τόσο χαρούμενο που ξέχασε να μεταναστεύσει νότια πριν τον χειμώνα. Όταν προσπάθησε να πετάξει, τα φτερά του πάγωσαν και έπεσε. Μία αγελάδα που περνούσε έριξε κοπριά πάνω του, και η ζέστη της ξεπάγωσε τα φτερά του. Το πουλί άρχισε να κελαηδά από χαρά μέσα στην κοπριά. Μία γάτα το άκουσε, το έβγαλε και το έφαγε. Το δίδαγμα είναι ότι δεν είναι εχθρός σου όποιος σου ρίχνει κοπριά, ούτε φίλος όποιος σε βγάζει από τα σκατά, και κυρίως όταν είσαι μέσα στα σκατά κράτα το στόμα σου κλειστό. Καταλήγει τονίζοντας την αξία της μοναξιάς και της ενδοσκόπησης, που έχει χαθεί στη γενιά μας, και προτρέπει να την επαναφέρουμε.", "x": "This happened in Michigan. A tiny little bird was very exuberant and happy, and winter started coming. It should have gone south, but it was so happy it forgot about it and little late. Then it tried to fly, but because of the cold, its wings froze and it fell down. A cow was passing that way, and it dropped a heap of dung, and it fell right on the bird. And the warmth of the dung caused thaw of the wings. The ice melted away, and it felt happy and warm. Tweet, tweet, tweet, it started tweeting from inside the dung. It couldn't get up, but it was happy inside the dung. A cat was going by. It heard this bird tweeting. It opened up the dung and ate up the bird. The moral of the story is not everybody who heaps dung on you is your enemy. Not everybody who gets you out of shit is your friend. And above all, when you're in a heap of shit, keep your mouth shut. Now, I'm saying this because we have created a world now, if I have trouble, I must talk to everybody in the world. They're all going to give thousand solutions. No. When you feel you're in trouble, please just spend some time upon yourself. Invest some time and energy upon yourself, because there is no trouble which troubles you except what you allow, isn't it? This value of solitude is totally gone in the world in this generation. Please bring it back if you want to make yourself of some substance."}, {"f": "DLN3r1nS_U7.mp4", "t": "Βίντεο", "s": "", "x": ""}, {"f": "DJ7Ypj9AIi2.mp4", "t": "Βίντεο", "s": "Ο ομιλητής εξηγεί ότι κάθε μακροχρόνια σχέση περνά μία κρίσιμη φάση που οι περισσότεροι μπερδεύουν με σημάδι να φύγουν: την απογοήτευση. Ξαφνικά οι ιδιοτροπίες του συντρόφου γίνονται εκνευριστικές και τα ελαττώματά του μεγαλώνουν, και αρχίζεις να αναρωτιέσαι αν διάλεξες λάθος. Όμως η απογοήτευση δεν είναι σημάδι φυγής αλλά πρόσκληση για ανάπτυξη, και επανέρχεται κάθε φορά που αλλάζει η ζωή, μετά από νέα δουλειά, απώλεια ή στρες. Τα πιο δυνατά ζευγάρια δεν είναι αυτά που αποφεύγουν την απογοήτευση, αλλά αυτά που την αντιμετωπίζουν μαζί, μιλούν ειλικρινά, ακούν και ξαναεπιλέγουν ο ένας τον άλλον. Έτσι χτίζεται μία αγάπη που διαρκεί, δουλεύοντας μέσα από τα δύσκολα και όχι τρέχοντας μακριά τους.", "x": "Every long-term relationship hits one critical phase, yet most couples mistake it as a sign to leave called disillusionment. Suddenly, your partner's quirks become irritations. Their flaws feel bigger. You start wondering, \"Did I choose wrong?\" But disillusionment isn't a sign to leave. It's an invitation to grow, and it doesn't just happen once. It returns whenever life shifts, like after a new job, a loss, or during stress. Each time it feels like, \"What happened to us?\" But it's not a signal to give up. It's a call to lean in. The strongest couples aren't those who avoid disillusionment, but those who face it together. They speak honestly, listen, and choose each other again and again. That's how you build a love that lasts: by working through the hard parts, not running from them. Do you feel misunderstood in love? Comment \"deep\" and I'll send you something special."}, {"f": "DGd_3_kv5pk.mp4", "t": "Βίντεο", "s": "Κωμικό σκετς για μία μηχανή του χρόνου. Κάποιος καυχιέται ότι έφτιαξε μηχανή του χρόνου, αναφέροντας ότι ο φίλος του επέστρεψε στο παρελθόν για να σταματήσει τον εαυτό του από το να κάνει τατουάζ το όνομα της πρώην του. Στη συζήτηση για το πού θα πήγαινε κανείς, λένε ότι όλοι θέλουν να σκοτώσουν τον Χίτλερ, οπότε προτείνουν να σκοτώσουν τον Χίτλερ ως μωρό. Ο ένας δηλώνει ότι μπορεί να σκοτώσει ένα μωρό και το κάνει με μία γροθιά, σχολιάζοντας πόσο εύκολο είναι. Η σκηνή κλείνει με χιούμορ όταν ανοίγουν την πόρτα και βλέπουν πολλούς Εβραίους, υπονοώντας ότι η εξόντωση του Χίτλερ άλλαξε την ιστορία. Πρόκειται για μαύρο χιούμορ γύρω από το δίλημμα του ταξιδιού στον χρόνο.", "x": "I cannot believe you turned this into a time machine. Yeah, I'm a genius, man. You used it. It works. It works. Remember I got Ashley's name tattooed on my forearm and then she broke up with me? Went back, stopped myself from doing it. That's unbelievable. Can I use this thing? Where do you wanna go? Everyone says you get a time machine, first thing you do, kill Hitler. You think you can kill Hitler? I mean, you're kinda tiny and weak. All right. Send me back to a time when he can't defend himself. I'll kill baby Hitler. You have the stomach to kill a baby? That's what you're saying? You wanna go kill a baby? I can kill a baby. All right. Get in there. Let's dial it up. There he is. You get it done? I murdered the shit out of that kid. Hell, yeah. How'd you do it? I just punched him in the face. That's it? It's shockingly easy to kill an infant. You been outside? I haven't even left the room. Let's fucking go. Holy shit. Did they just steal that? That is- A lot of Jews. So many Jews."}, {"f": "DK7CspYzpeg.jpg", "t": "Φωτογραφία", "s": "Φωτογραφία με μία συλλογή αποφθεγμάτων για την αυτοεκτίμηση και το εγώ. Οι πρώτες γραμμές προτρέπουν να αποδεχτείς την απόρριψη, να μην εκλιπαρείς, να μην κυνηγάς και να επιλέγεις τον εαυτό σου. Το σύμπαν αντικαθιστά τους ανθρώπους που δεν ανταποδίδουν την αγάπη, γι' αυτό η αγάπη δεν χάνεται ποτέ, μόνο βρίσκεται. Αν είσαι ελαστικός με τα όριά σου, οι άλλοι θα είναι ελαστικοί με το πώς σου φέρονται. Σημάδι ωριμότητας είναι να εξετάζεις τις πράξεις σου μετά από κάθε διαφωνία. Περιλαμβάνεται και απόσπασμα του Ρουμί ότι καθήκον σου δεν είναι να αναζητάς την αγάπη αλλά να βρεις τα εμπόδια που έχτισες εναντίον της. Το κείμενο συνεχίζει με παράδειγμα ενός αγοριού που ταυτίστηκε με την εικόνα του διανοούμενου και περιφρονεί όσους θεωρεί λιγότερο έξυπνους.", "x": "Accept rejection.\nDon't beg.\nNever chase.\nKnow your worth.\nChoose yourself.\n\nThe Universe will replace\npeople who do not\nreciprocate your love.\nThat is why love is never\nlost, it is only found.\n\nIf you're flexible with\nyour boundaries, people\nwill be flexible with\nhow they treat you.\n\nA sign of maturity is when you\nreview your actions after every\nsingle disagreement that\nyou have, so you can grow\nas a person.\n\nReal love rises above the ego\n'Your task is not to seek for love, but merely to seek\nand find all the barriers within yourself that you\nhave built against it?\nRumi\nLet's keep exploring this idea of the ego and the shadow it casts\nover our true selves. I want to give you an example of how this\ncould look in real life.\nImagine a boy named Dwayne. Since he was a child, Dwayne has\ncultivated a strong ego identity around being an \"intellectual'\nperson. He prides himself on being smart, reads complex books\nand uses big words when speaking. He looks down on those he\nsees as less intelligent. When he's right, and when he can show"}, {"f": "DJ62wPeMg2M.mp4", "t": "Βίντεο", "s": "", "x": ""}, {"f": "DKh1rappfY7.jpg", "t": "Φωτογραφία", "s": "Φωτογραφία από λογαριασμό life coach που εξηγεί ότι αν το σώμα σου πανικοβάλλεται όταν κάποιος άλλος αναστατώνεται, δεν σου έμαθαν να ρυθμίζεις αλλά να παρακολουθείς. Όταν μεγαλώνεις σε σπίτι όπου η διάθεση ενός γονέα καθόριζε όλο το δωμάτιο, μαθαίνεις να ανιχνεύεις τις συναισθηματικές του μεταπτώσεις πριν καν μάθεις τις δικές σου. Γίνεσαι αυτός που προβλέπει την έκρηξη για να μην χτυπήσει τόσο δυνατά. Αυτό δεν είναι ευαισθησία αλλά επιβίωση. Ως ενήλικας, όταν κάποιος που νοιάζεσαι γίνεται απόμακρος, νιώθεις ότι έκανες κάτι λάθος, και τότε αντιδράς με υπερεξηγήσεις ή καταπνίγεις την αλήθεια σου. Η ρύθμιση μέσω των άλλων δεν είναι πραγματική ρύθμιση αλλά συναισθηματική εξωτερική ανάθεση. Η λύση είναι ένας έλεγχος βασισμένος στα όρια: είναι δικό μου να το διαχειριστώ ή δικό τους να το νιώσουν;", "x": "If your body\npanics the\nmoment\nsomeone else\ngets upset... You\nweren't taught\nto regulate. You\nwere taught to\nmonitor.\n@amythelifecoach\n\nThen, breathe into\nyour own body.\nFeel your feet.\nName one thing in\nthe room.\nRemind yourself:\n\"I'm allowed to\nstay with me.\"\n@amythelifecoach\n\nYou don't have\nto lose yourself\nwhen someone\nelse becomes\ndysregulated.\n@amythelifecoach\n\nRegulation is\nsomething you\ncan build - even if\nyou never had it\nmodeled.\n@amythelifecoach\n\nYour nervous\nsystem doesn't\nhave to match\ntheir chaos. It\ncan match your\nhealing.\n@amythelifecoach\n\nBecause when you\ngrow up in a home\nwhere a parent's\nmoods dictated\nthe whole room...\nYou learn to track\ntheir emotional\nshifts before you\neven know your\nown.\n@amythelifecoach\n\nYou become the\nstorm-spotter.\nThe peacemaker.\nThe one who\nanticipates the\nexplosion... SO\nmaybe it won't hit\nas hard. That's not\nsensitivity. That's\nsurvival.\n@amythelifecoach\n\nNow, when\nsomeone you care\nabout gets quiet,\nfrustrated, or\ndistant - You feel it\nin your chest. Like\nyou did something\nwrong. Like\nconnection is about\nto disappear.\n@amythelifecoach\n\nSo... you fawn.\nYou over-explain.\nYou shut down\nyour truth to\nsoothe their pain.\nBecause if they're\nnot okay... you\ndon't feel okay.\n@amythelifecoach\n\nThis isn't about needing\nvalidation. It's about\nhow your nervous\nsystem was trained:\n→ \"Their emotions\ndetermine my safety.\"\n→ \"if I can keep them\ncalm, 'll be okay.\"\n→ \"If I disappear, maybe\nthe damage will too.\"\n@amythelifecoach\n\nBut regulating\nthrough other\npeople isn't real\nregulation. It's\nemotional\noutsourcing.\nAnd it leaves you\npowerless.\n@amythelifecoach\n\nBecause if your\npeace depends\non someone\nelse's mood...\nYou'll always\nbe chasing it.\n@amythelifecoach\n\nX In those\nmoments, try this\nboundary-based\ncheck-in:\n\"Is this mine to\nmanage... or theirs\nto feel?\"\n@amythelifecoach"}, {"f": "DJb9Yt9OJ1j.mp4", "t": "Βίντεο", "s": "Συνέντευξη με μία επιζήσασα που περιγράφει τη δοκιμασία της. Είχε ένα πολύ σοβαρό εγκεφαλικό, με εννέα ημέρες εγκεφαλικής αιμορραγίας πριν διαπιστωθεί ρήξη σπονδυλικής αρτηρίας, και κόντεψε να πεθάνει. Κατά τη διάρκεια της ανάρρωσής της, ο σύζυγός της τη χώρισε, παντρεύτηκε τη φίλη του και της έκανε μήνυση για την επιμέλεια του γιου της, ενώ εκείνη δεν ήταν αρκετά δυνατή για να παραστεί επανειλημμένα στο δικαστήριο. Ο συνομιλητής τη χαρακτηρίζει επιζήσασα. Εκείνη δηλώνει ότι η φιλοσοφία της είναι πως δεν έχει σημασία πώς πέφτεις αλλά πώς σηκώνεσαι, και αν έχεις την αξιοπρέπεια και το θάρρος να κρατήσεις την ηθική σου πυξίδα. Πιστεύει ότι η ευτυχία είναι πειθαρχία, κάτι που επιλέγεις και καλλιεργείς όπως τη γυμναστική.", "x": "You've had a tough time of life. As you know, I had a very severe stroke. I know. I had a brain hemorrhage. You nearly died. Yes, it, I had a nine-day brain hemorrhage before they found out that I had a ruptured vertebral artery. As I was recovering, my husband divorced me, um, married his girlfriend, and they sued me for custody of my son. I wasn't strong enough and healthy enough to be in court several times. You're a survivor, right? My philosophy is it's not how you fall, it's how you get up, and do you have the dignity and the courage and the integrity to get up and keep your moral compass together? I believe that happiness is a discipline. I think that we choose happiness, and it's a lot like working out. You have to stay present with it and work with it and make decisions to be happy and let go of the negative"}, {"f": "DKUB9-vy-VH.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι ένας οργισμένος μονόλογος για την οικονομική ανισότητα και την εκμετάλλευση. Ο ομιλητής θέτει το ερώτημα πώς φτάσαμε στο σημείο να δουλεύουμε σαράντα, πενήντα ή εξήντα ώρες την εβδομάδα και να παραμένουμε φτωχοί. Καταγγέλλει την αντίφαση ότι κάποιοι διαθέτουν αμύθητο πλούτο ενώ άλλοι πεινούν, και απορρίπτει τη συμβουλή πως αρκεί να δουλέψεις σκληρότερα. Το πρόβλημα, λέει, δεν είναι προσωπική αποτυχία αλλά ένα σύστημα που απομυζά τον χρόνο, τη χαρά και την ίδια τη ζωή των ανθρώπων για να τα παραδώσει στους λίγους στην κορυφή. Προτρέπει να σταματήσουμε να εξιδανικεύουμε τον αγώνα και τη θλίψη, καθώς η ζωή πρέπει να βιώνεται πλήρως, ελεύθερα και χαρούμενα ως δικαίωμα και όχι ως προνόμιο. Κλείνει καλώντας σε οργή που να μετατραπεί σε οργανωμένη δράση απέναντι σε αυτό το ψέμα.", "x": "Wake up. How the hell did we get to a point where working forty, fifty, sixty hours a week still leaves you broke? How is that normal? How is it normal that some people have so much money they couldn't spend it in a thousand lifetimes while others are starving on sidewalks? How is it normal to deny yourself joy, rest, leisure, travel, hobbies, not because you don't want them, but because you cannot afford them? Meanwhile, some parasites are buying mega yachts and vacationing year-round like it's a sport, and some people have the nerve to say, \"You just have to work harder.\" Really? Tell that to the single mom with three jobs who still cannot afford rent. Tell that to the delivery guy who breaks his back for twelve hours a day and still skips meals. This is not normal. This is not okay, and this is not your fault. This is a system built to extract your life, your time, your joy, and hand it to the few at the top. Stop romanticizing struggle. Stop glorifying grief. Life isn't supposed to be survived. It's supposed to be lived fully, joyfully, freely, and that shouldn't be a privilege. That should be a right. So if you are angry, good. Stay angry. Use that rage, organize it, and let's burn this lie to the goddamn ground."}, {"f": "DKRiGM0Rk8z.jpg", "t": "Φωτογραφία", "s": "Η εικόνα περιέχει ένα σύντομο, ειρωνικό μήνυμα που παίζει με τη γλώσσα της αυτοβελτίωσης. Η φράση, σε ελεύθερη απόδοση, λέει ότι μπορείς να διαλογιστείς για να γίνεις καλύτερος εγωιστής. Η πρόθεση είναι σατιρική: σχολιάζει πόσο συχνά ο δήθεν πνευματικός λόγος, ο διαλογισμός και οι τεχνικές εσωτερικής ανάπτυξης χρησιμοποιούνται στην πραγματικότητα για να εξυπηρετήσουν τον ίδιο τον εαυτό και όχι την αλληλεγγύη. Η αντίθεση ανάμεσα στην ιερή πρακτική του διαλογισμού και στον ωμό χαρακτηρισμό του εγωιστή δημιουργεί χιούμορ, ενώ ταυτόχρονα υπονοεί ότι μεγάλο μέρος της σύγχρονης κουλτούρας ευεξίας έχει γίνει ατομικιστική. Το μήνυμα είναι σύντομο και κοφτό, σχεδιασμένο να προκαλέσει γέλιο αλλά και μια στιγμή αναγνώρισης για το πώς ακόμη και οι πνευματικές πρακτικές μπορούν να διαστρεβλωθούν προς όφελος του εγώ.", "x": "MEDITATE TO BE\nA BETTER\nSELFISH BASTARD"}, {"f": "DKPJlV9unx2.jpg", "t": "Φωτογραφία", "s": "Η εικόνα είναι ένας οδηγός μ tdM-bb.mp4", "t": "Βίντεο", "s": "", "x": ""}, {"f": "DJbAbz2ucMh.mp4", "t": "Βίντεο", "s": "Το βίντεο μεταφέρει μια κριτική θέση για τον ρόλο της ψυχολογίας και της ψυχιατρικής στη σύγχρονη κοινωνία. Ο ομιλητής υποστηρίζει ότι οι θεραπευτές κινδυνεύουν να γίνουν οι ιερείς του βιομηχανικού συστήματος, βοηθώντας τους ανθρώπους να προσαρμοστούν σε μια ζωή που τους ζητά να παράγουν και να καταναλώνουν μαζικά χωρίς συνείδηση. Η δυσαρέσκεια από την ανία και την έλλειψη νοήματος, που ήδη οι Γάλλοι τον δέκατο όγδοο αιώνα ονόμαζαν τη νόσο του αιώνα, αντιμετωπίζεται συχνά ως νεύρωση. Έτσι, αντί να αναζητηθεί ένα πιο ουσιαστικό νόημα ζωής, ο θεραπευτής μπορεί να προσφέρει προσαρμογή ώστε ο άνθρωπος να αποδεχθεί μια ανούσια ζωή χωρίς εξέγερση και χωρίς συμπτώματα. Η ομιλία ασκεί κριτική στην τάση να εξομαλύνεται η διαμαρτυρία αντί να ακούγεται.", "x": "I'm afraid the role of the mental health movement and the role of psychology and psychiatry are to help to adjust man somewhat more, to make him function more smoothly. You might say psychology and mental health today is in danger, and psychologists are in danger to become the priests of industrial system. That is to say, to help people adjust to a system where they are supposed to produce and consume in masses, in groups, directed by central organization and slogans, and yet at the same time not to be aware. They are dissatisfied with that. They suffer from it. They suffer from what the French already called the 18th century la maladie du siècle, the illness of the century, from boredom, from the meaninglessness of life. Now, there is a danger in that, that they might get sick, that they might have manifest symptoms, that they might protest, that they might want to make life more meaningful. And then many psychologists come and say, \"You shouldn't be dissatisfied. If you are dissatisfied, that means you are neurotic. And we'll adjust you so that you accept a meaningless life without rebelling against it, without symptoms, and you will have a nice funeral anyway.\""}, {"f": "DJDG6wDNId2.mp4", "t": "Βίντεο", "s": "Το βίντεο παραθέτει έξι λόγους, βασισμένους στη νευροεπιστήμη, για να σταματήσει κανείς να παραπονιέται. Πρώτον, η γκρίνια ενισχύει τα λάθος νευρωνικά μονοπάτια, επανασυνδέοντας τον εγκέφαλο προς την απαισιοδοξία και την αδυναμία. Δεύτερον, πλημμυρίζει τον οργανισμό με ορμόνες στρες, όπως η κορτιζόλη και η αδρεναλίνη, που βλάπτουν τη μνήμη και τη συγκέντρωση. Τρίτον, εκπαιδεύει το δίκτυο σημαντικότητας του εγκεφάλου να δίνει προτεραιότητα στην αρνητικότητα, κάνοντας τον άνθρωπο να βλέπει περισσότερα προβλήματα και λιγότερες ευκαιρίες. Τέταρτον, διαταράσσει τον προμετωπιαίο φλοιό, που ευθύνεται για τις αποφάσεις και τη δημιουργικότητα, καθιστώντας μας πιο αντιδραστικούς. Πέμπτον, μειώνει τη συνδεσιμότητα και μπορεί να συρρικνώσει τον ιππόκαμπο. Έκτον, παγιδεύει το δίκτυο προεπιλεγμένης λειτουργίας σε έναν βρόχο ταλαιπωρίας, σαν προφύλαξη οθόνης που θυμίζει διαρκώς τους λόγους δυστυχίας.", "x": "Here's six neuroscience-backed reasons to stop complaining. One, you strengthen the wrong neural pathways. Your brain is plastic, and it rewires itself based on repetition. Every complaint that you speak or think rewires your brain, fires and rewires your circuits for pessimism, irritation, and helplessness. Two, you flood your system with stress hormones. When you complain, your brain treats it like a real threat in the outer world. Cortisol and adrenaline surge because chronic complaining keeps your nervous system on high alert. Chronic high alert state, chronic stress hormones are terrible for your brain. They fry your focus, destroy your memory, and give your thinking tunnel vision. Because when you're in survival mode, you're not thinking big, you're thinking, \"Survive.\" Three, you hijack your brain's salience network. The salience network decides what's important in your environment. And when you complain, you train it to prioritize negativity. So you literally start noticing more problems and fewer opportunities. Four, complaining disrupts the function of your prefrontal cortex, which is your brain's executive command center. This is the part of your brain responsible for decision-making, emotional regulation, and creativity. Complaining literally redirects blood flow from your prefrontal cortex back to your limbic system. Your limbic system is your fight or flight center, and this makes you more reactive and less rational. Five, you decrease brain connectivity. Studies show that chronic negativity actually shrinks the hippocampus, which is the brain region tied to memory, learning, and emotional resilience. In other words, more complaints, less brain power. Six, you make your default mode network stuck in a rut of suffering. Your default mode network is like your brain's mental screensaver. If you feed it with constant complaining and negativity, it's just gonna be a screensaver in your own brain, reminding you of all the reasons you should feel bad about yourself. Write brain care in the comments to remember all this in your body. Brain care in the comments. Like the video, follow me, and click the link in my bio. Vibrant beings, have a great day."}, {"f": "DHGhAqptKTM.mp4", "t": "Βίντεο", "s": "", "x": ""}, {"f": "DJyFm5XAz3F.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι ένα δραματοποιημένο σκετς γύρω από ένα μυστηριώδες βιβλίο που περιέχει τα μυστικά όλων των φίλων μιας παρέας. Ένα πρόσωπο πιάνει το βιβλίο παρά τη συμφωνία ότι μόνο ο φύλακάς του μπορεί να το αγγίζει. Ο φύλακας εξηγεί ότι η διασκέδαση και οι φιλίες στηρίζονται στο να παραμένουν αυτά τα μυστικά κρυφά, και πως όποιος διαβάσει την αλήθεια καταστρέφει όσα έχουν χτίσει. Ο άλλος αντιτείνει πως αν η αλήθεια για τους ανθρώπους μπορεί να χαλάσει τη φιλία, τότε ίσως δεν αξίζει να είναι φίλος μαζί τους. Η σύγκρουση κλιμακώνεται όταν αποκαλύπτεται ότι το βιβλίο είναι άδειο και ότι ένας άλλος χαρακτήρας δεν άντεξε την αλήθεια. Το σκετς παίζει με το θέμα της αλήθειας, της ψευδαίσθησης και του κόστους της γνώσης στις ανθρώπινες σχέσεις, με αίσθηση σασπένς και ανατροπή.", "x": "Put the book down. Ah, I pr- promise I was just moving it somewhere. We agreed that only I can touch the book. I, I, I know. Then why would you touch it? I, I was gonna read it. Oh my God. How many times do I have to tell you? You don't want to read the book. But i- is it not just a book with all our friends' secrets? I, I don't really understand why you won't let us read it. See that guy? Oh my God. I- is he? Yeah. He couldn't handle the truth. Okay. But y- you see, like, you making it seem so important is exactly what makes everyone wanna read it. But look at them. The fun, the friendships, it, it all relies on keeping the secrets in this book secret. If you read them, you ruin everything we have. Okay. But i- if knowing the truth about people would ruin my friendship with them, w- why would I wanna be friends with them? Listen, man, we've all been tempted, but we choose to keep the peace. However, if knowing the truth about everyone is more important to you than keeping the friendships, I can't stop you from opening the book, but I've said my peace. You know the risks. I'm sorry, but I, I can't live in a world of lies. This is empty. He couldn't have died from this, unless... I tried to warn you."}, {"f": "DIFVKN6y8y3.mp4", "t": "Βίντεο", "s": "Το βίντεο παρουσιάζει μια τεχνική σκέψης για όσους παγιδεύονται στην υπερανάλυση και την καταστροφολογία. Ο ομιλητής περιγράφει τη λεγόμενη καταστροφική σκέψη ως μια διαδικασία δύο βημάτων: μια καθυστέρηση δύο λεπτών γίνεται υποψία ατυχήματος, ένα μήνυμα που μένει αναπάντητο γίνεται απόρριψη. Προτείνει να αυξήσουμε τον δείκτη θετικής νοημοσύνης, που ονομάζει PQ, σε αντιδιαστολή με το γνωστό IQ και EQ. Η άσκηση που δίνει είναι να αναγνωρίσουμε ότι η εστίαση στον κίνδυνο είναι φυσικός μηχανισμός αυτοπροστασίας και να μην τιμωρούμε τον εαυτό μας γι' αυτό. Στη συνέχεια, αντί να μηρυκάζουμε το χειρότερο σενάριο, καλεί να φανταστούμε ότι όλα πήγαν τέλεια. Με επανάληψη, ισχυρίζεται, ο δείκτης PQ ανεβαίνει και η ποιότητα ζωής βελτιώνεται αισθητά, αλλάζοντας σταδιακά τον τρόπο που αντιδρούμε στην αβεβαιότητα.", "x": "Listen, if you've been stuck in your head and you've been thinking and overthinking about a bunch of dumb shit, I have a mindset hack for you. So your number one problem right now is you're stuck in what we call destructive thinking, which is a two-step thinking process. So I'll give you some examples. Let's say you're at a coffee shop, you're waiting for someone to arrive, they're two minutes late, so your first thought is, \"Oh, damn, they must have got in a car accident and died.\" Or let's say you texted someone and they left you on read, or they're taking a long time to respond. You're like, \"Oh, they must hate me. They're not interested in me. They're mad at me.\" Right? You are stuck in destructive thinking. To overcome this, you need to increase your level of PQ, positive intelligence. A lot of people are familiar with IQ, they're familiar with EQ, but increasing your PQ will greatly increase the quality of your life. So this is what I want you to do. This is your assignment. Next time you get stuck in that destructive thinking, understand, one, it is a natural mechanism of our brain to identify danger to keep us safe. So do not beat yourself up. But what I want you to do is think deeply if everything worked out perfectly and you got everything you wanted and more. And if you just keep doing this and you keep putting in the reps, over time, your level of PQ will increase and you'll see a massive difference"}, {"f": "DIpOP5TTqzr.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι μια τοποθέτηση για την κυριαρχία της αρνητικότητας στη δημόσια ζωή. Ο ομιλητής εκφράζει την ενόχλησή του που οτιδήποτε αρνητικό είναι εξαιρετικά θορυβώδες, ενώ το θετικό παραμένει σιωπηλό. Σημειώνει ότι παντού, στα κοινωνικά δίκτυα, στα μέσα ενημέρωσης, στην οικογένεια και στη δουλειά, όλοι βρίσκουν κάτι για να προσβληθούν ή να οργιστούν, ενώ η θετική στάση μένει ήσυχη. Το επιχείρημά του είναι ότι η θετικότητα αποτελεί ένδειξη εσωτερικής δύναμης, γιατί σημαίνει ότι καταλαβαίνεις πως όλος αυτός ο θόρυβος δεν έχει σημασία. Υποστηρίζει μάλιστα ότι ζούμε σε μια από τις καλύτερες περιόδους της ανθρωπότητας και ότι όποιος αρνείται να το αποδεχθεί, επιλέγει συνειδητά να παραμείνει δυστυχισμένος. Το μήνυμα έχει προκλητικό και κάπως απόλυτο τόνο, προτρέποντας σε προσωπική ευθύνη για τη στάση απέναντι στα πράγματα.", "x": "Seriously, what do you think? Because it drives me crazy that we live in a world where anything negative is so damn loud, yet anything positive is quiet. It doesn't matter if you're on social media, mainstream media, around friends, family, out in your community, at work, everybody has something to be offended about. Everybody has something to be outraged about. Everybody wants to bitch and complain, yet positivity is so quiet because what those people don't understand is being positive is a true indicator of internal strength because you realize none of that matters and we truly are living in one of the greatest periods of mankind and you neglect to understand that. And if you don't want to accept that, just stay miserable"}, {"f": "DI4x1ltTaDP.mp4", "t": "Βίντεο", "s": "Το βίντεο υποστηρίζει ότι η ζωή βελτιώθηκε ριζικά μέσα από την πρακτική του νόμου της αποστασιοποίησης, δηλαδή του να μην προσκολλάται κανείς σε όσα δεν μπορεί να ελέγξει. Ο ομιλητής εξηγεί ότι όταν λέει πως δεν τον νοιάζει, οι άλλοι απορούν, γιατί έχουν μάθει να αγωνιούν για πράγματα πέρα από τον έλεγχό τους, όπως μια σχέση που επιβάλλεται, μια οικονομική απώλεια, ένας χωρισμός ή ένα ατύχημα. Η πρότασή του είναι απλή: άφησε την κατάσταση να εξελιχθεί και ρώτα μόνο τι έπεται. Εστιάζοντας στα ελάχιστα που πραγματικά εξαρτώνται από εμάς και αποδεσμευόμενος από όλα τα υπόλοιπα, ο άνθρωπος κερδίζει ηρεμία και νόημα. Το μήνυμα προωθεί μια στωική οπτική της ζωής, όπου η απελευθέρωση έρχεται όταν σταματάμε να παλεύουμε με ό,τι δεν μας ανήκει να καθορίσουμε.", "x": "This one thing has made my life 20 times easier, 20 times better, 20 times more fulfilling, and that's just practicing the law of detachment, just not caring. And when I first tell people like, I don't care, they're like, how can you not care? This is a big deal. I can't control it. I only focus on the things that I can control. Way too many people, you're trying to force this relationship, force this friendship. When you experience a loss, you lose some money, you get into a breakup, maybe you get into a car accident, you're freaking out. You can't control it. Let the situation play out and just ask yourself, what's next? If you just focus on the simplest of things, and that is what you can control, and you just detach from everything else, your life will improve."}, {"f": "DJHsTaJShYU.mp4", "t": "Βίντεο", "s": "Ο ομιλητής μοιράζεται μια παρατήρηση που, όπως λέει, έμαθε στη φυλακή: ότι οι πιο αξιόπιστοι άνθρωποι είναι συνήθως εκείνοι με τις πιο τραχιές γωνίες, που δεν είναι πάντα ευγενικοί με όλους και που εκθέτουν ανοιχτά τα ελαττώματά τους. Αυτοί, υποστηρίζει, είναι οι πιο πιστοί και θα σε στηρίξουν πραγματικά. Αντίθετα, οι άνθρωποι που προσπαθούν να αρέσουν σε όλους, που φαίνονται άψογοι, ενάρετοι και πάντα πρόθυμοι, κρύβουν συχνά απώτερα κίνητρα και είναι εκείνοι που θα σε προδώσουν. Η θέση του είναι ότι πρέπει να είμαστε επιφυλακτικοί με όποιον δείχνει υπερβολικά καλός ή τέλειος, γιατί συνήθως κουβαλά σκοτεινές πλευρές. Το βίντεο έχει αφηγηματικό, προσωπικό ύφος, με φόντο μια παραλία και την αίσθηση εξομολόγησης από κάποιον που μιλά από εμπειρία ζωής.", "x": "So I've been low-key peeping people out on the other side of Richardson Bay, and they don't even know that I'm watching. But really what I've been thinking about as I've been standing here, and I really learned this in prison, is that it was always the people that were the roughest around the edges, who weren't always so nice to everybody, who always put all their flaws out on the table in front of them, what you see is what you get, were always the most trustworthy, were always the most loyal, would always have your back. Yet it was the people that were always people-pleasing, that had no flaws, they acted perfect, goody-goody two-shoes, they were so virtuous and helpful, those people would always stab you in the back, betray you. They always had an ulterior motive. For real, always be wary of the person who seems to be too good, too perfect, 'cause they got some real demons inside of them"}, {"f": "DJ1K4d-T1gD.jpg", "t": "Φωτογραφία", "s": "Η εικόνα συγκεντρώνει μια σειρά από σύντομα αποφθέγματα και παροιμίες. Αναφέρεται ένας ιαπωνικός μύθος που λέει ότι αν μπεις σε λάθος τρένο, κατέβα στον πλησιέστερο σταθμό, γιατί όσο αργείς τόσο ακριβότερο γίνεται το ταξίδι της επιστροφής. Περιλαμβάνει επίσης τη φράση ότι ο δρόμος προς τον παράδεισο μοιάζει με κόλαση, ενώ ο δρόμος προς την κόλαση μοιάζει με παράδεισο. Ένα άλλο απόφθεγμα σημειώνει ότι όλα είναι προσωρινά, που είναι ταυτόχρονα κακή και καλή είδηση. Ακολουθεί ο Ρίτσαρντ Φάινμαν με το ότι είναι αρκετά έξυπνος για να ξέρει ότι είναι ανόητος, ο Μαρκ Τουέιν με τη φράση ότι η ανησυχία είναι σαν να πληρώνεις χρέος που δεν χρωστάς, και ο Καρλ Γιουνγκ με το ότι δεν είμαστε ό,τι μας συνέβη αλλά ό,τι επιλέγουμε να γίνουμε. Πρόκειται για συλλογή αποφθεγμάτων με φιλοσοφικό και ενθαρρυντικό χαρακτήρα.", "x": "\"There's a Japanese\nlegend that says,\nIf you get on the wrong train,\nget off at the nearest station,\nthe longer it takes you to get\noff, the more expensive the\nreturn trip will be.\"\n\n«The road to heaven\nfeels like hell.\nThe road to hell\nfeels like heaven.\"\n-Unknown\n\n\"Bad news: everything is\ntemporary, which is also\nthe good news.\nSo if things are going well,\nenjoy it because it won't last\nforever. And if things are\ngoing badly, don't worry.\nIt can't last forever either.\"\n-Unknown\n\n\"I'm smart enough to\nknow that I'm dumb.\"\n-Richard Feynman\n\n\"Worrying is like\npaying a debt\nyou don't owe.\"\n-Mark Twain\n\n\"I am not what\nhappened to me,\nI am what I choose\nto become.\"\n- Carl Jung"}, {"f": "DH6F3LTSTUV.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι μια οργισμένη παρέμβαση για τη φτώχεια και την υποκρισία των πλουσίων. Ο ομιλητής, με καταγωγή από το ανατολικό Λονδίνο, λέει ότι οι φίλοι του δεν μπορούν να θρέψουν τα παιδιά τους ούτε να ανάψουν τη θέρμανση, και πως αν ήταν τόσο απλό να γίνεις επιχειρηματίας, θα το είχαν ήδη κάνει. Καταγγέλλει τους πολυεκατομμυριούχους που λένε στους φτωχούς να γίνουν πιο επιχειρηματικοί, χαρακτηρίζοντας τη στάση αυτή αρρωστημένη και αιτία ψυχικών ασθενειών. Υποστηρίζει ότι η προηγούμενη γενιά άρπαξε τις ευκαιρίες και τώρα είναι σχεδόν αδύνατο να βγει κανείς από τη φτώχεια. Αντί να κουνάνε τα εκατομμύριά τους μπροστά στους νέους, καλεί να διορθωθεί το σύστημα που σπρώχνει ολοένα περισσότερους ανθρώπους στη φτώχεια σε κάθε γενιά.", "x": "I come from East London, okay? My friends can't feed their kids, okay? And it's- if it was as simple as going out and being an entrepreneur, I can bet you they would do it. I can bet you they would do it. Let us... I'm, I'm sick of multimillionaires telling kids who can't afford to turn the heating on, \"You just need to be more entrepreneurial.\" It's sick, Dan. It's sick. But I sp- this gives people mental illness. It gives people mental illness. Tell them the truth, okay? We, your older generation, we took the opportunities, and now it's almost impossible to get out of poverty. And don't just, don't just stand at them and wave, you know, your millions of pounds in front of them and say, \"If you were entrepreneurial like me, you could do it. You could have it.\" Because it's sick because they can't. They can't feed their kids, Dan. They can't turn the heating on. Don't tell them to be more entrepreneurial. Fix the system that drives more and more and more of them into poverty every generation"}, {"f": "DJuMBXaMirs.mp4", "t": "Βίντεο", "s": "Το βίντεο περιέχει συμβουλές για τον φόβο και το θάρρος, πιθανώς από αθλητή ακραίων αθλημάτων ή αλεξιπτωτιστή. Ο ομιλητής συμβουλεύει να γράψει κανείς το όνειρό του και μετά μια λίστα με τα βήματα για να το πετύχει, τι πρέπει να κάνει και τι να μάθει, αντί να κάθεται και να ανησυχεί. Τονίζει ότι δεν πειράζει να φοβάσαι, αρκεί να το αναγνωρίζεις και να συνεχίζεις να δουλεύεις. Ο φόβος, λέει, είναι το άγνωστο, και είναι εντάξει να μην ξέρεις. Η λύση είναι να βγαίνεις έξω και να ενεργείς βήμα βήμα. Χρησιμοποιεί τη μεταφορά της σταδιακής προόδου: πρώτα μπουσουλάς, μετά περπατάς, μετά τρέχεις και στο τέλος σπριντάρεις. Το ύφος είναι καθησυχαστικό και ενθαρρυντικό, με έμφαση στη δράση έναντι της υπερανάλυσης.", "x": "Don't be so worried if you're afraid. It's like, \"Okay, I feel it.\" It's like, \"That's fine.\" And it's honestly admirable how you do such scary things. Thank you. What advice would you give to people who find it hard to do something brave? Here's the thing. You just have to write down your dream, and then write down a list of how do you accomplish that. What do I need to do? What do I need to learn to be able to accomplish those goals? And that's, that's what I do. I don't just sit there and worry about it. I just start doing it. And, and don't be so worried if you're afraid. It's like, \"Okay, I feel it.\" It's like, \"That's fine.\" Just keep working through it. Really, the f- the fear you feel is the unknown. It's what you don't know. And just kinda recognize that, that it's okay not to know. And work towards a knowingness of things. And the only way to do it is not to be in your head on it, but just to start looking, go out and start doing it one step at a time. When I'm training people or I'm training myself, I'm always thinking, \"I'm gonna learn how to crawl before I walk, walk before I jog, jog before I run, run before I sprint.\" Pretty much. And then I sprint out of a plane or off a cliff before I do that, so. That's what I do. Look at this. You know, how do you do that?"}, {"f": "DJZjVLuR1yU.mp4", "t": "Βίντεο", "s": "", "x": ""}, {"f": "DITqyUIRZg1.mp4", "t": "Βίντεο", "s": "Ο ομιλητής παρουσιάζει ένα ρολόι που, όπως λέει, δεν δείχνει την ώρα αλλά την προοπτική. Στη μία πλευρά του είναι χαραγμένη η φράση ότι η σύγκριση είναι ο κλέφτης της χαράς, την οποία κοιτάζει όταν αισθάνεται ανασφάλεια ή χαμηλή αυτοεκτίμηση, για να θυμηθεί ότι είναι αρκετός και άξιος αγάπης. Στην άλλη πλευρά αναγράφεται η λατινική έκφραση memento mori, δηλαδή θυμήσου ότι θα πεθάνεις, την οποία χρησιμοποιεί όταν το εγώ του φουσκώνει, για να θυμηθεί ότι είναι άνθρωπος, ότι δεν είναι ανώτερος από κανέναν και ότι δεν τα καταφέρνει μόνος του. Έτσι το αντικείμενο λειτουργεί ως υπενθύμιση ισορροπίας: η μία όψη τον προστατεύει από το αίσθημα ανεπάρκειας και η άλλη από την έπαρση. Το μήνυμα αφορά την ταπεινότητα και την αυτοαποδοχή.", "x": "This one tells time. This one tells perspective. It tells what? Perspective. Perspective. Yes. I keep it with me. It's got engravings on two sides. The back is something I used to feel uncomfortable in rooms like this, in front of people. I used to think I was not enough. I did not value self. So on the back of this watch, it simply says, \"Comparison is the thief of joy.\" So I take this, and every time I feel uncomfortable or of low self-worth, I just give it a little reminder, and it reminds me that I am enough and I'm worthy of love. And on the other side, it says, \"Memento mori.\" For when my head gets too big- ... I need to remember that I'm human, and I am above no one. And always remember where I came from, and remember those that support me, that I don't do it alone. So I have one side for when I think my ego is too big, and one side for when I, I don't feel enough, and it's a nice little keeper of perspective, not time."}, {"f": "DJaKeAYOnBJ.mp4", "t": "Βίντεο", "s": "Ο αφηγητής διηγείται την ιστορία του γιου του, ενός αντισυμβατικού χαρακτήρα. Όταν ήταν στην όγδοη τάξη, αντάλλαξε ένα βιντεοπαιχνίδι Guitar Hero με μια πραγματική κιθάρα, λέγοντας ότι οι πραγματικοί ήρωες της κιθάρας παίζουν αληθινά όργανα. Όταν μετακόμισαν στο Πόρτλαντ, ο γιος δεσμεύτηκε να κυκλοφορεί μόνο με ποδήλατο για πάντα, κάτι που βασάνιζε τον πατέρα, ο οποίος αναγκαζόταν να τον παραλαμβάνει αργά τη νύχτα και μάταια τον παρακαλούσε να βγάλει δίπλωμα. Η αλλαγή ήρθε με την εμφάνιση μιας κοπέλας, της Ζάνα, που έμενε μακριά. Όταν ο γιος ζήτησε επιτέλους αυτοκίνητο, ο πατέρας μέσα σε λίγα λεπτά βρήκε στις αγγελίες ένα Subaru του 1994 με χίλια δολάρια. Η ιστορία αποκτά ζεστασιά όταν ο πωλητής αποκαλύπτει ότι το πουλάει εξαιτίας μιας κοπέλας, και ο γιος καταλαβαίνει αμέσως.", "x": "My son has always been a little countercultural. When he was in eighth grade, he trade... Someone gave him a Guitar Hero video game, and he traded it in for a real guitar under the moniker, \"Dad, real guitar heroes play real guitars.\" When we moved here 10 years ago, he kept all of that countercultural aspect and found it in Portland in a way that Miami could not provide. \"Rule number one, I will be on my bike,\" he said, \"Forever, for all time.\" And he was committed through high school to riding that bike. It was a pain in the ass for me, because he would call me at 11 o'clock at night not wanting to ride his bike home, and I would have to go get him. So there was a couple of times where I begged him to buy a car and to get his license, and he just refused. And then came Zana. Zana lived in Beaverton. All good stories start with love. Um, and my son, while I was sitting at the dining room table one day, said to me, \"Dad, I think I want a car.\" The opportunist that I am, 90 seconds later, I was on Craigslist. Two minutes later, I had found a car. And within three minutes, I was on the phone talking to a guy. Less than an hour later, I was standing in front of him with my son behind me and $1,000 in my hand, walking around a 1994 Subaru and kicking the tires like I knew what I was doing. I did not. We drove the car around the block. It was near perfect, and I wondered why it was only $1,000. And I asked the guy, I was like, \"Hey, I'm not gonna haggle you for the price. This is a $1,000 car. It's 250,000 miles, but still, why is it only $1,000?\" And he says, \"You see, there's this girl.\" And my son, \"Say no more.\" Totally got what was happening, so I went to hand him the $1,000, and before I did, I shook my hand out and I said, \"$1,000 for the car.\" And he grabbed my hand, and he kind of looked me in the eyes, and there was a moment there when we were holding hands, and he looked me in the eyes, and we kind of had an exchange of energy. And he said, \"Before I sell you the car, there's a couple of rules, two of them to be exact.\" And I said, \"Okay.\" And he wouldn't let go of my hand. And he said, \"Rule number one, my mom was the original owner. She passed it to me. We don't refer to it as the car. We don't refer to it as the Subaru. We don't call it the Sub. We don't call it his car, your car, anyone's car. His name is Buster.\" Still holding my hands. To which I said, \"Offensive pronouns aside, we will call it Buster, no problem.\" And he said, \"One more thing, Buster doesn't have a CD player. There's no six CD changer. The AM/FM radio doesn't work very well. Buster only plays one tape.\" And I looked at my son, knowing that this could be a deal breaker for the Guitar Hero. If you get in the car every time and Cyndi Lauper comes on, not gonna work. And the guy said, \"I hope you like Led Zeppelin IV.\" This was a deal. I handed him $1,000, and we drove away with Buster. And for four years, my son drove from Southeast Portland to Lincoln High School, and it served us well. He spent a couple of nights in the back of the car, mm, going to assume drunk, plausible, plausible deniability, you know. Um, it took him to the coast once. It took him to the base of Mount Hood more than once. It was very reliable, and it was kind of a family car for us. We lent it to some friends. We kind of got attached to Buster. So you can see why I was bummed a couple of weeks ago when I went to go unlock Buster, and he was gone. Oh. He wasn't where I left him last. And my son, who's in New Zealand right now in school, I had to call and tell him that Buster was gone. And it kind of felt like your family pet had run away, like your dog had gone, and you couldn't find him, and you didn't know where he was. Um, all things kind of happened. We moved houses, and it's been a month, and on Friday this week, the Portland Police called me and said, \"We found Buster.\" I was beyond excited that we had actually found Buster, and I called Ransom immediately, and I was like, \"Yo, Buster is back. This is so cool.\" And, uh, uh, yesterday, uh, my phone rang three times from a number I didn't recognize, and the guy on the other end of the phone said to me, \"You don't know me from anyone. My name's Bob, but someone sold me your Subaru. The title and registration was in the car, and I paid $750 for it.\" And he explained to me that he was a veteran on disability and that he worked all summer long so he wouldn't have to walk to work in the wintertime. So today, at about six o'clock tonight, I met Bob at the station, at the tow station, and together we paid to get the car out of the lot, and he took the car, and he's 60-something years old, and he shook my hand, and when he did, there was a moment between the two of us. And I looked at him, and I kind of understood where he was coming from, and he looked like he had seen some hard times, blue collar, like he had seen war. And he looked me in the eyes like men of a certain age would want to do, and he said to me, \"Thank you. You will not understand how much this car means to me.\" And I didn't let go of his hand, then I looked him right back in the eyes and I said, \"We don't call it the car.\" \"His name is Buster.\" Thank you."}, {"f": "DJW_6xIJsf1.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι ένα σύντομο κωμικό σκετς που σατιρίζει την αμήχανη προσέγγιση σε μπαρ. Ένας άντρας παροτρύνεται από φίλους να μιλήσει σε μια κοπέλα και προσπαθεί με κλισέ ατάκες: τη ρωτάει αν της αρέσουν τα παπούτσια της, αν μένει εκεί κοντά, αν μπορεί να την κεράσει ποτό, αν έχουν κοινά ενδιαφέροντα. Οι απαντήσεις της είναι μονολεκτικές και αποστασιοποιημένες, γεγονός που δείχνει πλήρη έλλειψη χημείας. Η ανατροπή έρχεται όταν αποκαλύπτεται ότι η κοπέλα συνοδευόταν από φίλη της, και οι δυο τους σχολιάζουν πόσο χαριτωμένος ήταν ο άντρας, υπονοώντας ότι ίσως το ενδιαφέρον ήταν πραγματικό αλλά χάθηκε λόγω αδεξιότητας. Το σκετς καταλήγει με τις φίλες να λένε ότι οι άντρες σήμερα δεν ξέρουν τι θέλουν. Το χιούμορ στηρίζεται στην παρεξήγηση και την κοινωνική αμηχανία.", "x": "Yo, check her out. You are so in. Go talk to her. Okay, I got this. Hey, I love your shoes. They're my sister's. Cool. Well, I saw you from across the bar and just wanted to say hi. Okay. Anyways, do you live around here? Why? Just wondering. Uh, can I buy, can I buy you a drink? I don't drink. She's allergic. Maybe you have a hobby or a interest, something we might have in common. I don't know, it's possible. Uh, huh. Do you like living? Sometimes. Okay, cool. Well, enjoy your night. That guy was so cute. You guys would make the perfect couple. So how'd it go? Not good. I guess I wasn't her type. Yeah, let's just, uh, let's just get out of here. Cool. Wait, where's he going? What a jerk! It's okay, you're too pretty for him anyway. Men these days don't know what they want."}, {"f": "DJO21-pz0z3.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι διαφημιστικό περιεχόμενο για ένα εργαλείο κουζίνας που κόβει πατάτες σε πατατάκια μπροστά στους πελάτες. Ο αφηγητής τονίζει ότι σε έναν κόσμο όπου κάθε λεπτομέρεια μετράει, αυτό το εργαλείο δεν κόβει απλώς, αλλά προσθέτει θέαμα στην κουζίνα. Περιγράφει τη διαδικασία από τη στιγμή που οι ολόκληρες πατάτες πέφτουν στη χοάνη μέχρι το χειροκίνητο γύρισμα που τις κόβει κατευθείαν στο κα "Βίντεο", "s": "Το βίντεο είναι στα ελληνικά και παρουσιάζει οκτώ συνήθειες που, όπως λέει ο δημιουργός, του πήρε πέντε χρόνια να καταλάβει. Πρώτον, ύπνος από τις δέκα το βράδυ ως τις πέντε το πρωί για επτά ώρες ξεκούρασης. Δεύτερον, εκατό λεπτά κάθε πρωί για διάβασμα, γράψιμο και στοχασμό. Τρίτον, να μην ξεκινάς σχέσεις αν είσαι άφραγκος, εκτός φόρμας ή σε κακή ψυχολογική κατάσταση. Τέταρτον, να αποφεύγεις τις γρήγορες απολαύσεις που οδηγούν στην κατάθλιψη. Πέμπτον, καθημερινή γυμναστική για την ψυχική υγεία. Έκτον, κρύο ντους κάθε πρωί. Έβδομον, πλήρης ανάληψη ευθύνης χωρίς να κατηγορείς γονείς ή συνθήκες. Όγδοον, χρόνος στη φύση και περπάτημα τουλάχιστον τριάντα λεπτά στον ήλιο. Στο τέλος ζητά σχόλιο για να στείλει ένα βιβλίο αυτοβελτίωσης.", "x": "Μου πήρε πέντε χρόνια να τα καταλάβω και θα σου τα πω σε δύο λεπτά. Ένα. Πήγαινε για ύπνο στις δέκα το βράδυ και ξύπνα στις πέντε το πρωί κάθε μέρα. Ο επαρκής ύπνος εφτά ωρών θα σε βοηθήσει να παραμείνεις συγκεντρωμένος. Δύο. Πέρασε εκατό λεπτά κάθε πρωί διαβάζοντας, γράφοντας και στοχασμένος πάνω σε αυτά που μαθαίνεις. Τρία. Μην ξεκινάς να βγαίνεις ραντεβού αν είσαι απένταρος, εκτός φόρμας ή η ζωή σου είναι χάλια. Φτιάξε πρώτα τη ζωή σου. Τέσσερα. Απόφυγε το κυνήγι των γρήγορων απολαύσεων. Είναι ο πιο γρήγορος δρόμος για κατάθλιψη και δυστυχία. Πέντε. Γυμνάσου κάθε μέρα ό,τι κι αν γίνει. Είναι το καλύτερο πράγμα που μπορείς να κάνεις για την ψυχική σου υγεία. Έξι. Κάνε κρύο ντους κάθε πρωί. Θεραπεύει το σώμα σου και σε προετοιμάζει για τη μέρα. Εφτά. Ανέλαβε πλήρως την ευθύνη για τη ζωή σου. Μην κατηγορείς τους γονείς σου, τις συνθήκες ή οποιονδήποτε άλλο για τα προβλήματά σου. Οκτώ. Πέρνα χρόνο στη φύση. Περπάτα τουλάχιστον τριάντα λεπτά τη μέρα. Το περπάτημα στον ήλιο θα καθαρίσει το μυαλό σου, θα ανεβάσει τη διάθεσή σου και θα σου φέρει δημιουργικότητα. Σχολίασε \"αλλαγή\" για να σου στείλω το βιβλίο που θα σε βοηθήσει να γίνεις η καλύτερη εκδοχή του εαυτού σου."}, {"f": "DI4XvIgtBtJ.jpg", "t": "Φωτογραφία", "s": "Η εικόνα περιέχει ελληνικό κείμενο από λογαριασμό που προφανώς ασχολείται με τη σημασία λέξεων και εννοιών. Φαίνεται να παραθέτει μια σειρά από ελληνικές λέξεις μαζί με σύντομες ερμηνείες ή συνώνυμα, σε μια μορφή μικρού λεξικού ή γλωσσικού σχολίου. Το κείμενο που προκύπτει από την οπτική αναγνώριση είναι αποσπασματικό και δυσανάγνωστο, με ανακατεμένα στοιχεία, αλλά η δομή υποδηλώνει αντιστοιχίσεις λέξεων με την απόδοσή τους, πιθανώς στα πλαίσια μιας σειράς που εξηγεί τη βαθύτερη σημασία καθημερινών ή σπάνιων ελληνικών όρων. Στο τέλος υπάρχει προτροπή προς τον αναγνώστη να σχολιάσει μια συγκεκριμένη λέξη, ώστε ο δημιουργός να στείλει σχετικό βιβλίο. Πρόκειται δηλαδή για εκπαιδευτικό περιεχόμενο γύρω από τη γλώσσα και το νόημα των λέξεων.", "x": "-bathistoxastos\n6 Tóno va BentlwoELs\náuada in Suádson cou\nbathistoxastos\n\n-bathistoxastos\nkoúpaon = Kolunoou\notEvaxwpla = aoknon\nbathistoxastos-\n\n-bathistoxastos\náyxoç = uńyalva ula Bólta\nEşávtAnon anto Souzlá = бıáßaoz\nbathistoxastos\n\n-bathistoxastos\nvaúpa = ákou uoulkń\nbathistoxastos\n\n-bathistoxastos\navńnouxos = Saoyícou\nuntEpßoıKń okáwn = ypáwa\nbathistoxastos\n\n-bathistoxastos\nAV Ta ÉVIwOES aUtá...\n[xoíaos \"Aayń\" yia va\nTOU OTEÍAW TO BLBAiO TOU Đa\noE BononoEL.\nKáve inv arayń anuspa!\nbathistoxastos"}, {"f": "DIyXew8iXy3.jpg", "t": "Φωτογραφία", "s": "", "x": ""}, {"f": "DIB4yedMlQe.mp4", "t": "Βίντεο", "s": "Το βίντεο εξηγεί τη θεωρία του αναλυτικού ιδεαλισμού μέσα από το έργο του πρώην επιστήμονα του CERN, Μπερνάρντο Καστρούπ. Η βασική ιδέα είναι ότι η φυσική πραγματικότητα δεν είναι παρά προβολή του νου μας, και ότι δεν είναι η ύλη που δημιουργεί τη συνείδηση αλλά το αντίστροφο. Όπως ένα χαμόγελο δεν προκαλεί την ευτυχία αλλά είναι σύμπτωμά της, έτσι και ο εγκέφαλος δεν παράγει συνείδηση. Ο Καστρούπ προτείνει ότι υπάρχει μία μόνο καθολική συνείδηση, που ονομάζει νου εν τω συνόλω, και ότι ο καθένας μας είναι σαν ένα κύμα που αναδύεται προσωρινά από τον ωκεανό για να βιώσει μια μοναδική οπτική. Ο θάνατος, κατά την άποψη αυτή, είναι ψευδαίσθηση: όταν το κύμα σπάει, επιστρέφει στον ωκεανό. Έτσι ο άνθρωπος δεν είναι βιολογική μηχανή αλλά μέρος του δημιουργού, το σύμπαν που ξυπνά στον εαυτό του.", "x": "What if the physical reality that we all live in is actually just a projection of our mind? This sounds like the script from the movie Matrix, but I'm gonna explain how science looks at it. In the analytic idealism theory, former CERN scientist Bernardo Kastrup says that all matter is what the mind looks like from the outside. That matter does not create consciousness. It's consciousness that creates matter. He says that our physical reality is the outward appearance of our thoughts and our emotions. Just as a smile doesn't cause happiness, the brain doesn't cause consciousness. It's just a symptom of it. And Kastrup proposes that there's only one universal consciousness called the mind-at-large. Just like how the ocean creates infinite waves, each individual wave is our human experience. When the wave is above the water, it is temporarily disconnected from the body of ocean, creating our unique individual perspective on life. And this is where it gets interesting. He says that death is an illusion. When the physical body dies, your consciousness becomes reintegrated back to that one universal consciousness. Just like how a wave, when it crashes back into the ocean, becomes the ocean again. So in a world where conventional science says that we're just these biological machines that happen to have consciousness, Kastrup says that you are actually part of the creator, and you are the universe waking up to itself."}, {"f": "DGOIS_Jvnam.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι μια σκηνοθετική εξήγηση για την ταινία μικρού μήκους Vision, που πραγματεύεται τη σχέση μας με τις οθόνες και το πώς αυτές μπορούν να μας παγιδεύσουν. Ο σκηνοθέτης ήθελε να αποδώσει το αίσθημα του εγκλωβισμού αλλά και το πώς η δημιουργικότητα μπορεί να μας απελευθερώσει. Για τον σκοπό αυτό συνεργάστηκε με τον διευθυντή φωτογραφίας Τεό Φορζέ, ο οποίος είχε κατασκευάσει δύο εφευρέσεις: το Stemirax, που δημιουργεί αναπαραγωγή της εικόνας σε πραγματικό χρόνο για να δείξει τους χαρακτήρες σε κίνηση, και το Magic Shutter, που χρησιμοποιεί καθρέφτες για όμορφα εφέ κίνησης. Το μεγάλο πλεονέκτημά τους ήταν ότι τα εφέ ήταν ορατά ζωντανά στο γύρισμα χωρίς να περιμένουν το post-production. Με αυτά τα εργαλεία δημιούργησαν μια υπνωτική εμπειρία, άλλοτε ομαλή και ονειρική και άλλοτε χαοτική και έντονη.", "x": "The Stemirax makes the image duplicate in real time, which was perfect to show the characters in motions. The Magic Shutter uses mirrors to create beautiful motion effects. And the best part with these two is that we could see the effects live on set without waiting for post-production. Vision is a film about our relationship with screens and how they can trap us, and I wanted to show this feeling on being stuck, but also how creativity can help us break free. So when I talked to my DOP, Théo Forget, he told me about two inventions he created. When I saw them, I knew they were exactly what I needed. With these tools, we created a hypnotic and immersive experience, sometimes smooth and dreamlike, and sometimes chaotic and intense."}, {"f": "DIasB4EoJ2b.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι ένα κωμικό σκετς που σατιρίζει την εμμονή κάποιων ανθρώπων να μοιράζονται κάθε λεπτομέρεια της άσκησής τους με τους άλλους. Ένας άντρας, λαχανιασμένος μετά από τρέξιμο, ανακοινώνει σε έναν γνωστό του ότι έτρεξε έξι χιλιόμετρα σε τριάντα δύο λεπτά και τριάντα τέσσερα δευτερόλεπτα, αναφέροντας μέγιστο και μέσο καρδιακό ρυθμό, κλίση διαδρόμου και ρυθμό ανά χιλιόμετρο. Όταν ο συνομιλητής ρωτά γιατί του τα λέει όλα αυτά, ο δρομέας εξηγεί ότι γυρνάει σε όλους όσους ξέρει, φίλους, συμμαθητές και πρώην συναδέλφους, για να τους ενημερώσει. Μάλιστα του δίνει και έναν χάρτη με τη διαδρομή που έκανε. Στο τέλος τον ρωτά επίμονα αν του άρεσε το τρέξιμό του και πώς αισθάνεται γι' αυτό. Το χιούμορ στηρίζεται στην υπερβολή και την κοινωνική αμηχανία της υπερκοινής χρήσης.", "x": "You all right? Just been running. Yeah, just now. Uh, six kilometers, 32 minutes 34 seconds. Yeah. Uh, max heart rate 162, average heart rate, uh, 140. Yeah, so yeah. Incline 0.1%, incline. Yeah. First two kilometers the fastest, slowed down for the middle one, then picked up again for the next few. Sorry, why are you telling me this? Just letting everybody know. Just going, like, around everybody I know. Just, like, everyone, like, uh, friends, people I used to go to school with, c- ex-work colleagues. Just getting round everybody letting everyone know. Here you are, mate, take this as well. Take this. It's marked, just marked on a map, the route I did if you want to just have a look at it. So yeah. All right, mate. Do, do you like it? Do you like what I've done? The run this morning. Do, how, how do you feel about it? Would, would you say you love it, like, okay? All right. Yeah, see you in a bit."}, {"f": "DIcOGXpCiC7.mp4", "t": "Βίντεο", "s": "Το βίντεο σχολιάζει την εξάρτησή μας από τα κινητά τηλέφωνα με ένα αιχμηρό επιχείρημα. Αναφέρεται σε έναν καλλιτέχνη που φωτογράφισε ανθρώπους και αφαίρεσε ψηφιακά τα τηλέφωνα από τα χέρια τους, δείχνοντας εικόνες όπου όλοι κάθονται και κοιτούν το κενό. Η σύγκριση που κάνει ο αφηγητής είναι καυστική: αν υπήρχε ένα ναρκωτικό που σε έκανε να κοιτάς το χέρι σου έξι ώρες την ημέρα, θα το απέφευγες με τρόμο. Όμως αυτό ακριβώς κάνει το τηλέφωνό σου. Το μήνυμα υπογραμμίζει πώς η αδιάκοπη προσκόλληση στην οθόνη έχει γίνει τόσο φυσιολογική που δεν την αντιλαμβανόμαστε καν ως πρόβλημα. Η δύναμη του βίντεο βρίσκεται στην οπτική αφαίρεση των τηλεφώνων, που αποκαλύπτει πόσο κενοί και χαμένοι φαίνονται οι άνθρωποι χωρίς αυτά.", "x": "Did you see that guy who removed people's phones from their hands? He took photos of people and then CGI'd the phones out. Oh, there we go. Oh, wow. All those people just sitting there staring. Imagine if there was a drug that made you stare at your hand for six hours a day. You'd be like, \"Keep me the fuck away from that drug.\" But that's what your phone's doing"}, {"f": "DIZG0uHq2Kw.mp4", "t": "Βίντεο", "s": "Ο ομιλητής εκφράζει τη θλίψη του για το γεγονός ότι οι άνθρωποι αγαπούν τυφλά τα σκυλιά αλλά όχι τους συνανθρώπους τους. Παρατηρεί ότι πολλοί φοβούνται κυριολεκτικά κάθε άλλο άνθρωπο, και εύχεται να ήταν αντίστροφα. Η σκέψη του είναι ότι ο κυνισμός, ο θυμός, ο φόβος και το σκοτάδι είναι εύκολα συναισθήματα, ενώ η αισιοδοξία, η ελπίδα και η αγάπη απαιτούν κόπο. Γι' αυτό, πιστεύει, πολλοί επιλέγουν τον εύκολο δρόμο της καχυποψίας απέναντι στους άλλους, ενώ προσφέρουν άνευ όρων αγάπη στα ζώα. Το μήνυμα είναι μια ήσυχη διαμαρτυρία για την έλλειψη εμπιστοσύνης μεταξύ των ανθρώπων και μια έκκληση να στρέψουμε την ίδια ανιδιοτελή αγάπη που δίνουμε στα κατοικίδια και προς τους διπλανούς μας. Ο τόνος είναι μελαγχολικός αλλά και γεμάτος ελπίδα.", "x": "People blindly love dogs. Yeah. But they don't blindly love people, and it makes... It breaks my heart. I watch so many people who are literally scared of every other person, and I wish it was the other way around. Cynicism and anger and fear and darkness is easy. Optimism and hope and love is hard. So I think a lot of people just choose the easy path."}, {"f": "DIYAHjvRpqC.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι ένα απόσπασμα από παλιά ομιλία του Μπέρνι Σάντερς που εξηγεί πώς κερδίζουν οι Ρεπουμπλικανοί παρότι οι πολιτικές τους δεν αρέσουν στην πλειοψηφία. Ο Σάντερς περιγράφει ότι οι στόχοι τους είναι φοροαπαλλαγές για τους πλουσιότερους, ιδιωτικοποίηση της κοινωνικής ασφάλισης, του Medicare και της εκπαίδευσης. Επειδή μια τέτοια ατζέντα δεν θα κέρδιζε ψήφους, η στρατηγική είναι ο διχασμός. Οι άνθρωποι χωρίζονται με βάση τη φυλή, το φύλο, τις αμβλώσεις, τα όπλα και τη θρησκεία. Έτσι η εργατική τάξη στρέφεται η μία εναντίον της άλλης αντί να ενωθεί για αξιοπρεπείς δουλειές για όλους. Το αποτέλεσμα είναι ο μεσαίος πολίτης να ψηφίζει κόντρα στα συμφέροντά του, ενώ οι πλούσιοι γελούν μέχρι την τράπεζα. Το μήνυμα είναι μια διαχρονική ανάλυση της πολιτικής χειραγώγησης μέσω του διχασμού.", "x": "Video of Bernie Sanders 21 years ago explaining how the Republicans win, even though no one likes their actual policies. If you are the Republican leadership, and this is what your goals are, your goals are to give huge tax breaks to the very richest people in this country. Your goals are ultimately to privatize Social Security so that Wall Street can make money from that. Privatize Medicare, so the insurance companies can make more money. Privatize education. Do away with public schools. Now, if you had an agenda like that and you went before the American people, tax breaks for the rich, destruction of Medicare, destruction of Social Security as we know it, lowering the minimum wage or abolishing it, how many votes do you think you'd get? Not a whole lot. Maybe the richest one percent would vote for you, but that's not a lot of votes. So what do I do? Got a problem. You package it. How do you package it? And here's-- I want you to pay attention to me 'cause this is bad stuff. What you do is divide people up. Divide people up by races. Affirmative action becomes one issue. All them Black people are getting the jobs that we white people used to have. Split people, working class, white against Black, instead of working together to create decent jobs for all. Those uppity women now, they want the right to choose. We'll split people on the abortion issue. We'll split people up on the gun issue. We'll split people up on religious issues. You follow what I'm saying? So you split people up, and then they end up, if you're a middle-class person, voting against your own interests, and the rich go laughing all the way to the bank"}, {"f": "DITxJEaug_Z.jpg", "t": "Φωτογραφία", "s": "Η εικόνα περιέχει ένα απόφθεγμα του Μάρκου Αυρήλιου, του στωικού αυτοκράτορα και φιλοσόφου, σε ελεύθερη απόδοση: συγκεντρώσου σε κάθε λεπτό στο να κάνεις αυτό που έχεις μπροστά σου. Πρόκειται για μια από τις κεντρικές διδασκαλίες του στωικισμού, που τονίζει τη σημασία της εστίασης στο παρόν και στο καθήκον που έχουμε μπροστά μας, αντί να αφήνουμε το μυαλό να παρασύρεται από παρελθόν και μέλλον ή από περισπασμούς. Το απόσπασμα προέρχεται πιθανώς από τα Εις εαυτόν, το προσωπικό ημερολόγιο του αυτοκράτορα. Η ανάρτηση ανήκει σε λογαριασμό αφιερωμένο στον στωικισμό και φέρει καθαρό, μινιμαλιστικό σχεδιασμό, με στόχο να εμπνεύσει τον αναγνώστη να επικεντρωθεί στην παρούσα στιγμή και στη δράση που απαιτείται εδώ και τώρα.", "x": "Concentrate every\nminute on doing\nwhat's in front of you.\n- Marcus Aurelius\n@dailystoic"}, {"f": "DIEorVCsKUx.jpg", "t": "Φωτογραφία", "s": "Η εικόνα παραθέτει ένα απόφθεγμα του σεναριογράφου Πολ Σρέιντερ, γνωστού για ταινίες όπως το Taxi Driver. Η φράση, σε ελεύθερη απόδοση, λέει ότι στη συγγραφή, οι άνθρωποι που ενεργούν ενάντια στο ίδιο τους το συμφέρον είναι ενδιαφέροντες χαρακτήρες. Πρόκειται για μια σημείωση πάνω στη δραματουργία: οι πιο συναρπαστικοί ήρωες δεν είναι εκείνοι που παίρνουν πάντα τις σωστές ή λογικές αποφάσεις, αλλά εκείνοι που αυτοϋπονομεύονται, που σαμποτάρουν τον εαυτό τους, που κάνουν επιλογές που τους βλάπτουν. Αυτή η εσωτερική αντίφαση δημιουργεί βάθος, ένταση και αληθοφάνεια στους χαρακτήρες. Το απόσπασμα απευθύνεται κυρίως σε σεναριογράφους και συγγραφείς, προσφέροντας μια πολύτιμη αρχή για τη δημιουργία πειστικών και αξέχαστων ηρώων. Η ανάρτηση προέρχεται από λογαριασμό αφιερωμένο στη σεναριογραφία.", "x": "\"IN WRITING\nPEOPLE WHO\nACT AGAINST\nTHEIR OWN BEST\nINTERESTS ARE\nINTERESTING\nCHARACTERS.\"\nPaul Schrader\n@Outstanding.Screenplays"}, {"f": "DISpE-2MZaq.mp4", "t": "Βίντεο", "s": "Ο ογδονταεξάχρονος κλινικός ψυχολόγος δρ. Ρίτσαρντ Λούις Μίλερ, με εξήντα χρόνια επαγγελματικής εμπειρίας, προειδοποιεί για τη δύναμη της γλώσσας που χρησιμοποιούμε για τον εαυτό μας. Το μυαλό, λέει, καταγράφει τα πάντα: ό,τι βλέπει, ακούει, μυρίζει. Όταν λες ότι έχεις κακή πλάτη, το μυαλό το ακούει. Όταν κάνεις αρνητικά σχόλια για τον εαυτό σου, το μυαλό τα απορροφά. Αντίθετα, προτείνει θετικές διατυπώσεις, όπως ότι είσαι ευγνώμων που η πλάτη σου κάνει το καλύτερο δυνατό, ή ότι τα πόδια σου σε πηγαίνουν όπου χρειάζεσαι. Θέτει το ερώτημα τι είναι πιο ευχάριστο: να λες θετικά πράγματα στο σώμα σου ή να γκρινιάζεις ότι φθείρεται. Η απάντηση είναι προφανής. Το μήνυμα είναι να προσέχουμε τον εσωτερικό διάλογο και να επιλέγουμε συνειδητά θετική γλώσσα για το σώμα μας.", "x": "Be very careful about what you say to yourself in your head or out loud. Hi, this is Dr. Richard Louis Miller. I'm an eighty-six-year-old clinical psychologist with sixty years of professional practice. The mind records everything. It records everything it sees, it records everything that it hears, it records everything that it smells. It records everything. When you criticize your back, \"I've got a bad back,\" the mind hears that. When you make any kind of comments that are negative about yourself, the mind hears that. But suppose you said positive things. Say something like, \"I'm really glad my back is doing its best under challenging circumstances. I'm so happy my head was able to get rid of that ache.\" What's more fun? What feels better? Saying positive things to your body, \"What a great set of legs I have that get me going everywhere I need to go\"? Or is it more fun and make us feel better to say, \"Oh, my legs, they're wearing out,\" or other negatives? Of course, the positives feel better, and that's why it's better to stay on the positive and be aware of the language you use when you're describing your own body."}, {"f": "DGNP5WDo-UN.mp4", "t": "Βίντεο", "s": "Ο αφηγητής διηγείται τη σχέση του με τον πατέρα του, που πέρασε περίπου είκοσι χρόνια στη φυλακή. Όταν βγήκε, ο γιος ήταν είκοσι ενός, και η επικοινωνία τους ήταν επιφανειακή, κυρίως για αθλητικά, με σπάνιες ευχές. Ένα βράδυ, σε ηλικία είκοσι εννέα, ο γιος δέχεται τηλεφώνημα από τον πατέρα του, κάτι που δεν είχε συμβεί ποτέ, και καταλαβαίνει αμέσως ότι κάτι κακό συνέβη. Ο πατέρας είναι πάλι φυλακισμένος και χρειάζεται πέντε χιλιάδες για εγγύηση. Παρά τους δισταγμούς, ο γιος πληρώνει και τον βγάζει. Επειδή ο πατέρας δεν είχε πού να μείνει, ο γιος και η σύντροφός του τον φιλοξενούν. Τρία χρόνια αργότερα, ο πατέρας έχει γίνει ο καλύτερός του φίλος, ο γιος του τον λατρεύει και η συγκατοίκηση αποδείχθηκε υπέροχη, ενάντια σε κάθε προσδοκία.", "x": "Dad did about 20 years in jail. He got out when I was 21, and we started texting right away, and mostly about sports and bullshit, nothing too deep. Occasionally, we'd throw in a happy birthday or merry Christmas. We'd see each other maybe once a year, once every other year, and this went on till three years ago. I was 29. And so at this point, we're still basically strangers. We're cordial, but we don't really know each other that well. So he calls me one night, which is already like, doesn't make sense. Something's gotta be wrong. I know instantly 'cause in all of our years of communication, we have never once called each other. So shit has hit the fan. I already know before I answer this phone. I answer the phone. Sure enough, he's in jail, locked up again. He needs five grand to get out, and I'm the only person who knows who could possibly do that for him. Otherwise, he's there till trial, which could be anywhere from six months to three years. Who knows? Like, could be forever until he gets to go to trial. I'm debating on it, going back and forth for obvious reasons, but ultimately, I don't have the heart to not pay the money, even if I don't want to. So fuck it, I gotta pay. I take the three-hour trip, bail him out. Next problem, he has nowhere to go. He got in trouble at the place he was living. He can't go back there. He, he has nothing. So Babe and I talked about it, and eventually we just decided for whatever reason, fuck it, he's coming to live with us. We have an extra guest bedroom. We don't know each other. Whatever though, here we go. Let's see what happens. So he moved in with us, and let me tell you, it's been fucking amazing. He's lived with us for three years now, and he's like my best friend in the world, and my son loves him. Loves him, loves his papa, and it's nice to have him around and just have somebody to be there and support and it's just been fucking amazing. Who would have ever guessed? I didn't know this man for like 20 years, and then all of a sudden as a grown man, here he is, and bam, now we best friends. Life's fucking crazy. That's all."}, {"f": "DB1DTYwK0ub.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι ένας παθιασμένος ερωτικός μονόλογος εξομολόγησης. Ο ομιλητής δηλώνει ερωτευμένος, λέγοντας ότι είναι τελείως τρελός για το άλλο πρόσωπο και ότι η καρδιά του σταματά κάθε φορά που το κοιτάζει. Εκφράζει την επιθυμία του να παντρευτούν και να κάνουν τέσσερα ή πέντε παιδιά, αν είναι δυνατόν. Τονίζει ότι επιτέλους το είπε δυνατά και ότι δεν ήταν τόσο δύσκολο, σαν να αφαιρέθηκε ένα βάρος από πάνω του. Διευκρινίζει ότι ο άλλος δεν χρειάζεται να απαντήσει αμέσως, καθώς το μόνο που ήθελε ήταν να βγάλει από μέσα του αυτό που ένιωθε. Το κείμενο αποτυπώνει την ανακούφιση και την ευφορία που συνοδεύουν μια ειλικρινή εξομολόγηση αγάπης, με έντονο συναίσθημα και μια νότα ευαλωτότητας.", "x": "I'm in love with you. I love you. I am totally, completely mad for you. I, I, my heart stops every time I look at you. Personally, I think we should be married. I definitely wanna have kids, four or five, if possible. There, I said it. Wasn't so difficult. You don't have to say anything. It's fine with me. I just wanted to get it out myself. Talk about a load off"}, {"f": "DEd-EEOO0Kx.mp4", "t": "Βίντεο", "s": "Το βίντεο αφηγείται ένα σύντομο ανέκδοτο που διαδραματίζεται σε μια αίθουσα πανεπιστημίου. Ένας φοιτητής ρωτά τον καθηγητή αγγλικής φιλολογίας ποιος είναι ο ορισμός του διλήμματος. Ο καθηγητής απαντά ότι τίποτα δεν είναι καλύτερο από ένα παράδειγμα για να το εξηγήσει, και περιγράφει το εξής σενάριο: φαντάσου ότι είσαι ξαπλωμένος σε ένα κρεβάτι με μια όμορφη γυμνή γυναίκα από τη μία πλευρά και έναν ομοφυλόφιλο άντρα από την άλλη. Σε ποιον θα γυρίσεις την πλάτη; Το ανέκδοτο στηρίζεται στο διφορούμενο νόημα της έκφρασης γυρίζω την πλάτη, που μπορεί να σημαίνει είτε αποστρέφομαι κάποιον είτε στρέφομαι προς τον άλλον, δημιουργώντας έτσι μια υπονοούμενη παγίδα. Το χιούμορ βασίζεται στην αμηχανία και το λογοπαίγνιο, και αποτελεί κλασικό παράδειγμα πανεπιστημιακού αστείου.", "x": "A student asked his English professor, \"What is the definition of a dilemma?\" The professor said, \"Well, there's nothing better than an example to illustrate that. Imagine you are lying in a bed with a beautiful naked woman on one side of you and a gay man on the other side of you. Who are you gonna turn your back on?\""}, {"f": "DDxUlsiv0rB.jpg", "t": "Φωτογραφία", "s": "Η εικόνα περιέχει ένα λιτό, εορταστικό μήνυμα που αναγγέλλει την έναρξη της χριστουγεννιάτικης περιόδου. Η φράση, σε ελεύθερη απόδοση, λέει ότι τα Χριστούγεννα ξεκινούν εδώ. Πρόκειται πιθανότατα για διαφημιστικό ή προωθητικό υλικό, ίσως από κατάστημα, εμπορικό κέντρο ή εταιρεία που επιθυμεί να σηματοδοτήσει την έναρξη της εορταστικής αγοραστικής περιόδου. Το μήνυμα είναι σύντομο και άμεσο, σχεδιασμένο να δημιουργήσει αίσθηση προσμονής και ζεστασιάς ενόψει των γιορτών. Η επιλογή της φράσης υποδηλώνει ότι ο δημιουργός θέλει να τοποθετηθεί ως σημείο εκκίνησης για την εορταστική ατμόσφαιρα, καλώντας τον θεατή να μπει στο πνεύμα των Χριστουγέννων και να αρχίσει να σκέφτεται δώρα, διακόσμηση και γιορτινές στιγμές. Χωρίς περαιτέρω πλαίσιο, η εικόνα λειτουργεί ως απλή ανακοίνωση ή ατμοσφαιρική προτροπή, πιθανώς συνδεδεμένη με κάποια καμπάνια ή προϊόν. Το ύφος είναι καθαρό και γιορτινό, χωρίς πρόσθετες πληροφορίες, αφήνοντας το οπτικό στοιχείο να μεταφέρει το μήνυμα.", "x": "Christmas\nStarts Here"}, {"f": "DDFyB5HKCP8.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι ένα κωμικό μονόλογο  wanna be where I w- I wake up and say, \"Where is she?\" The interview we're doing, it will be broadcasted on, uh, social media and stuff, and so people will watch it on a mobile phone. Do you think it's possible to make cinema on mobile phone, for instance? Sure. I mean, you can, you can make, uh-- of course you can. You can, you can watch it on your watch, but the-- you can't have the, the, the most profound experience, which is to see it the way the Greeks saw their theater, with, with an audience. Because the beauty of, of art is that you're sharing an experience with other human beings, and thea- and, and theater, we- who is our, our ancestor, you know? Cinema came from theater. And, and, uh, uh, and Edison, when he invented, uh, the cinema, he invented you look in a little thing. That's like a mobile phone. But it was the Lumière brothers who made it so you see it with an audience, and that is, uh, the real cinema was invented in France, and French are the best audiences for movies in the world. Really? Oh, without a doubt. The cinema, they, they love to go and see movies. I tell you, I saw, I saw Lawrence of Arabia in a big theater, and I will never forget that experience. I don't believe you can, uh, uh... You know, and this idea, this thing they call streaming, that's just home video. It's just another name for home video. That's always existed. Dur- during The Godfather, we used to have The Godfather on, on cassettes. But if you want an experience the way, uh, both theater and cinema is meant to be, you should see it in a big theater with at least 600 people, and then that's a thrill. And, and it's nothing can compare. You can, you can see it on a, on a phone. You can see it at home on your television set with your wife. But it's not the same thing. And, um, at Cannes press c- conference for Megalopolis, you said it was a collective piece of art with the whole casting. But y- you're the writer of the movie, you're the director, the, the producer, even the  wants to make movies in the 21st century? Do what you love. Don't, don't let anyone tell you that you have to do this to... If you love cinema, if you wanna do cinema, then, uh, the best way in my opinion is find other people who feel as you do and do one-act plays live because, uh, you may think that's strange. Why would you do that if you want cinema? Because what you really want is to see the reaction of audiences to your work, and if you do it as a film, it's gonna take you eight months by the time you're finished shooting and cutting, getting, and, you know, by the time you get the reaction, it's, you've wasted time. So do one-act plays with people who also wanna do one-act plays, and learn the most important thing of cinema is acting and writing. The other stuff you can learn quickly. Acting and writing, that's the hard part, so do one-act plays."}, {"f": "DC2PBtKhozz.mp4", "t": "Βίντεο", "s": "Το βίντεο είναι μια αντίδραση σε πλάνα από λεωφορείο όπου ακούγονται έντονες φωνές και βρισιές, με κάποιον να φωνάζει σε ένα άτομο να κατέβει από το λεωφορείο. Οι θεατές που σχολιάζουν αρχικά αγανακτούν, αναρωτιούνται ποιος φέρεται έτσι σε ένα παιδί και εκφράζουν σοκ. Στη συνέχεια όμως συνειδητοποιούν ότι το άτομο που δέχεται τις φωνές δεν είναι παιδί αλλά ενήλικας άντρας, γεγονός που αλλάζει ριζικά την αντίδρασή τους και την ερμηνεία του περιστατικού. Η σκηνή είναι χαοτική, με έντονη γλώσσα και συναισθηματική φόρτιση, και αναδεικνύει το πώς το πλαίσιο και η αντίληψή μας για το ποιος εμπλέκεται διαμορφώνουν την κρίση μας. Το βίντεο έχει τον χαρακτήρα αυθόρμητης αντίδρασης σε viral υλικό, με χιούμορ που προκύπτει από την ανατροπή της αρχικής εντύπωσης.", "x": "Get up the fucking bus. What the hell? Get up the bus. Mm-hmm. Fat ass bitch, get off the bus. Get off the fucking bus. Whoa, whoa. Get off the bus, yo. Whoa. Get off the bus. Oh my God, who does that to a fucking kid? What you mean? What you mean? Fucking kid. This man. He's a fucking kid, nigga. Oh my God. Wow,
