k into these videos, and some people do try and steal them. So if you wanna support me, just hit follow and maybe go to the bottom link in my bio."}, {"f": "DTWYeUHlP1Q.jpg", "t": "Φωτογραφία", "s": "Ένα κείμενο για ιαπωνικές λέξεις που περιγράφουν συναισθήματα τα οποία δεν έχουν ακριβές αντίστοιχο σε άλλες γλώσσες. Το μόνο νο αγουάρε είναι η γλυκιά θλίψη της επίγνωσης ότι κάθε ωραίο είναι προσωρινό, και το ότι το αγαπάς περισσότερο επειδή δεν θα κρατήσει. Το κομορέμπι είναι το φως που φτάνει σε σένα μόνο επειδή κάτι στέκεται εμπόδιο, ομορφιά γεννημένη από την απόφραξη. Το γιούγκεν είναι βάθος που αποκαλύπτεται ήσυχα, αυτό που νιώθεις αλλά δεν μπορείς να δείξεις. Το μα είναι η σημασία που ζει στην παύση, η σιωπή ως παρουσία και όχι κενό. Το σιζουκέσα είναι ακινησία με βάρος. Το χακανάι είναι όμορφο επειδή εξαφανίζεται. Το γιοχάκου είναι ο χώρος που αφήνεται άδειος ως πρόθεση. Το γουάμπι-σάμπι είναι η αποδοχή ότι τίποτα δεν είναι τέλειο, μόνιμο ή ολοκληρωμένο, και η εύρεση ήσυχης ομορφιάς σε αυτή την πραγματικότητα.", "x": "Emotions That Only\nExist in Japanese:\n\nCertain emotions remain unwritten,\nnot from silence, but from intimacy.\n\nMono no aware\nThe gentle sadness of knowing\neverything beautiful is temporary,\nand loving it more because it will\nnot last.\n\nKomorebi\nLight that reaches you only because\nsomething stands in the way.\nBeauty created by obstruction,\nnot absence.\n\nYugen\nDepth that reveals itself quietly.\nWhat you feel but can't point to\nand shouldn't try to explain.\nTarab\nFET\n\nMa\nMeaning lives in the pause.\nThe silence, the gap, the breath;\ntreated as presence,\nnot emptiness.\n\nShizukesa\nA stillness that carries weight.\nSilence that feels inhabited.\n\nHakanai\nBeautiful because it disappears.\nFragility as value, not weakness.\n\nYohaku\nWhat's left unsaid\ngives meaning to what\nremains.\nSpace as intention.\n\nWabi-Sabi\nThe acceptance that nothing is perfect,\nnothing is permanent, and nothing is\ncomplete and finding quiet beauty in\nthat reality instead of fighting it."}, {"f": "DTEJ6mSAdR9.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που εξηγεί ότι νευρολογικά ο εγκέφαλος αντιμετωπίζει το μέλλον σαν μια μνήμη που δεν έχεις ζήσει ακόμη. Αυτός είναι ο λόγος που η προσδοκία αλλάζει τη συμπεριφορά, που ο υπερβολικός αισιόδοξος βελτιώνει τις εκβάσεις και που το τραύμα αναδιαμορφώνει το πεδίο αποφάσεων. Ο εγκέφαλος δεν βλέπει το μέλλον, το προβλέπει, και μετά διαμορφώνει τη συμπεριφορά για να ταιριάξει με αυτή την πρόβλεψη. Κάθε εκδοχή του εαυτού σου, η γεμάτη αυτοπεποίθηση, η εξουθενωμένη, η θαρραλέα, η απομονωμένη, είναι ήδη ένα δυνητικό νευρωνικό μοτίβο. Αν δούμε την ταυτότητα ως πρόβλεψη, τότε η αλλαγή του μέλλοντός μας δεν είναι θέμα κινήτρου, δύναμης θέλησης ή μάντρα, αλλά θέμα ενημέρωσης της πρόβλεψης του εγκεφάλου. Δεν έχεις ένα μέλλον αλλά χιλιάδες, εκατομμύρια πιθανά μέλλοντα, το καθένα συνδεδεμένο με μια διαφορετική εκδοχή σου που ο εγκέφαλος μπορεί να κατοικήσει τώρα.", "x": "Neurologically speaking, your future is treated like a memory that you haven't lived yet. This is why expectation changes behavior. This is why super optimism improves everyone's outcomes. This is why trauma, when people go into a psychiatrist with trauma, that stuff can reshape our decision landscape. The brain's not seeing the future, it's predicting it, and then it shapes your behavior to match that prediction. So every version of you, the super confident one, the one that's burned out, the one that's courageous or brave, the isolated version of you, is already a potential neural pattern. So if we look at identity as a forecast, and the brain is choosing behaviors based on that forecast, then changing our future isn't about motivation. It's not about willpower or mantras or Post-it notes with smiley faces on them. It's about updating the brain's prediction. You do not have one future. You have thousands, maybe millions of plausible and maybe billions of possible futures. Each of one of those is attached to a different version of you that your brain could inhabit right now."}, {"f": "DRcb5gFj1bS.mp4", "t": "Βίντεο", "s": "Ένα βίντεο για το διάσημο πείραμα του Ρώσου βιολόγου Ντμίτρι Μπελιάεφ, ο οποίος από τη δεκαετία του 1950 άρχισε να επιλέγει αλεπούδες με βάση τη μειωμένη αντιδραστική επιθετικότητα. Οι ερευνητές πλησίαζαν τα νεαρά αλεπουδάκια και κατέγραφαν σε ποια απόσταση αντιδρούσαν φοβισμένα, εκτρέφοντας όσα επέτρεπαν στον άνθρωπο να πλησιάσει περισσότερο. Μέσα σε λίγα χρόνια εμφανίστηκαν χαρακτηριστικά εξημερωμένων ζώων, όπως λευκές κηλίδες στη γούνα και κρεμαστά αυτιά, που θυμίζουν οικόσιτο σκύλο. Αυτά είναι χαρακτηριστικά του συνδρόμου εξημέρωσης, που εμφανίζεται όταν επιλέγεις ενάντια στην αντιδραστική επιθετικότητα. Το συμπέρασμα είναι ότι μπορούμε να αναγνωρίσουμε το σύνδρομο εξημέρωσης και να συμπεράνουμε ότι υπήρξε επιλογή κατά της επιθετικότητας. Το ενδιαφέρον είναι ότι και ο σύγχρονος άνθρωπος εμφανίζει βασικά χαρακτηριστικά εξημερωμένων ειδών, σύμφωνα με αρχαιολόγους, υποδηλώνοντας ότι οι πρόγονοί μας υπέστησαν παρόμοια διαδικασία αυτοεξημέρωσης.", "x": "The famous experiment by the Russian biologist Dmitry Belyaev, who in the 1950s started selecting foxes on the basis of reduced reactive aggression. So here's what he did. He took foxes, slightly black version that, uh, occurs in, in Canada. They'd been in Russia for 50 years, breeding without anyone deliberately selecting them. And so what Belyaev did was to arrange for people to walk towards the young foxes when they were something like six weeks old. And, uh, at the point that the young fox said, \"Ah,\" then they would write down, well, how far was that? And they would breed from the ones who got closest, who, who allowed the human to get closest. And within a few years, in sometimes three years, sometimes five years, sometimes ten years, different features that are found in domesticated animals suddenly appeared, such as these white patches. Doesn't look much like a fox anymore, does it? It looks like Fido. Floppy ears. You probably remember though there's only one animal in the wild that has floppy ears, or one kind, and that's elephants. Floppy ears are characteristic of our friendliest dogs. So these are examples of features of the domestication syndrome, and what we're seeing here is evidence that you select against reactive aggression and then boom, magic, you get these features of the domestication syndrome, which is why goats and horses and cows and cats and dogs all have individuals that have got white patches of fur on them. Floppy ears occur in all of these animals too. And it means we can now reverse engineer, as it were, and go backwards and say, \"Okay, if you show a self-domestication syndrome, or if you show a domestication syndrome, that means that there was selection against reactive aggression.\" And fascinatingly, Homo sapiens, that's you and me, or most of us anyway, I think here has key features of domesticated species as determined by archaeologists. So archaeologists working in the range of, say, five to ten thousand years quite often find an animal, animal bones, and they wanna know, was this a domesticated species or was it a wild version? Was it a, a wolf or was it already a dog by this time? So they look at the bones, and they say, \"Well, okay, how do we tell?\" And here's how they tell. Lighter body, shorter face, smaller teeth, feminization of the skull and the skeleton, and, uh, brain reduction. And guess what? Homo sapiens shows all of these features in relationship to our earlier ancestors. So why did it happen?"}, {"f": "DSVUhJ8DC8N.mp4", "t": "Βίντεο", "s": "Μια συζήτηση με τη φυσικό Σαμπίνε Χόσενφελντερ για το αν τα σωματίδια είναι πραγματικά. Η ίδια αυτοχαρακτηρίζεται οργανολόγος, δηλώνοντας ότι δεν πιστεύει πως τα μαθηματικά είναι πραγματικά, αλλά ότι αποτελούν εργαλείο που χρησιμοποιούν οι φυσικοί για να περιγράψουν τον κόσμο. Σε αυτά τα μαθηματικά υπάρχουν ορισμοί για πράγματα που ονομάζουμε σωματίδια, όπως μια διέγερση σε ένα πεδίο ή ένα κβάντο ενέργειας. Αυτό εννοεί όταν μιλά για σωματίδιο, αλλά το αν τα σωματίδια είναι πραγματικά δεν είναι σίγουρη ότι το καταλαβαίνει καν, αφήνοντας το ερώτημα στους φιλοσόφους. Για εκείνη το ενδιαφέρον ερώτημα είναι αν τα σωματίδια είναι θεμελιώδη: αν τα ηλεκτρόνια, τα κουάρκ και τα φωτόνια του καθιερωμένου μοντέλου είναι θεμελιώδη ή αποτελούνται από κάτι άλλο. Η στάση της είναι αντιρεαλιστική ως προς τα μαθηματικά αλλά πραγματιστική ως προς τη φυσική περιγραφή, μεταθέτοντας το φιλοσοφικό βάρος του ερωτήματος εκτός επιστήμης.", "x": "Sabine, what, what's your opinion? Are particles real? Are particles real? Um, so I would describe myself as, as an instrumentalist. I don't believe that mathematics is real. I think mathematics is a tool that we as physicists use to describe the world. And in this mathematics, we have definitions for things that we call particles, and that might be an excitation in a field, or it might be an irreducible representation of the Lorentz group, or it might be a quantum of energy, and these are all related. And then we know what we're talking about. Um, that is what I mean by a particle, but are particles real? I don't know. I'm not sure I know what this even means. This is a question I leave to philosophers. Lucky we've got one. For me, the interesting question is, are particles fundamental? The particles that we currently know of in the standard model of particle physics, electrons, quarks, photons, and so on, are they fundamental or are they made of something else?"}, {"f": "DSYW137gc9i.mp4", "t": "Βίντεο", "s": "Ένα βίντεο με πέντε λόγους για να σταματήσεις να νοιάζεσαι υπερβολικά. Πρώτος, σύντομα θα πεθάνεις και αν είσαι τυχερός θα κάνεις ένα πράγμα στη ζωή σου που πραγματικά μετράει σε εκατό χρόνια, οπότε αναρωτήσου αν αυτό που σε αγχώνει είναι εκείνο. Δεύτερος, τα πιο σημαντικά πράγματα στη ζωή βελτιώνονται τη στιγμή που σταματάς να νοιάζεσαι για αυτά: γίνεσαι σίγουρος όταν σταματάς να προσπαθείς να είσαι σίγουρος, αγαπητός όταν σταματάς να κυνηγάς την αγάπη. Τρίτος, κανείς δεν σε προσέχει όσο εσύ, όλοι ασχολούνται με το τι σκέφτονται οι άλλοι για εκείνους. Τέταρτος, αν δεν μπορείς να το αλλάξεις, γιατί ανησυχείς, και αν μπορείς να μάθεις από αυτό, προχώρα. Πέμπτος, αν δεν θα δεχόσουν τη συμβουλή κάποιου, γιατί να ακούς την κριτική του, αφού ήδη αυτοκριτικάρεσαι αρκετά. Το μήνυμα είναι μια προτροπή προς την απελευθέρωση από την υπερβολική ενασχόληση με τη γνώμη των άλλων.", "x": "Here are five reasons you should stop giving a fuck. Number one, you're gonna be dead soon, and if you're lucky, you'll do one thing in your life that actually matters 100 years from now. So ask yourself, is this that thing? If not, who gives a fuck? Number two, the most important things in life improve the minute you stop caring about them. You become confident when you stop trying to be confident. You become loved when you stop trying to be loved. You become calm the minute you stop freaking out and trying to be calm. Number three, no one is paying attention to you as much as you are. Sorry to report that no one is thinking about that ketchup stain on your shirt or how your socks are mismatched. They're too busy freaking out about what other people might be thinking about them. Number four, can you change it? No? Then why are you fucking worrying about it? Can you learn from it? Great. Now you can move on. And number five, if you wouldn't take their advice, then why the fuck would you ever listen to their criticism? I mean, you criticize yourself enough already for God's sake. Why would you go looking for more people to take it from?"}, {"f": "DSz0oe0j2mV.mp4", "t": "Βίντεο", "s": "Ένα απόσπασμα από την ταινία Fences, όπου ένας πατέρας εξηγεί στον γιο του τη διαφορά ανάμεσα στο να τον αγαπάει και στο να τον φροντίζει από καθήκον. Ο πατέρας λέει ότι δεν υπάρχει νόμος που να τον υποχρεώνει να τον συμπαθεί, και ότι βγαίνει κάθε πρωί και μοχθεί ανάμεσα σε ανθρώπους που τον προσβάλλουν όχι επειδή τον συμπαθεί αλλά επειδή είναι καθήκον του. Το ίδιο ισχύει και για τον γιο του: ζει στο σπίτι του, τρώει το φαγητό του και κοιμάται στο κρεβάτι του επειδή είναι γιος του, όχι επειδή τον συμπαθεί. Ο πατέρας τονίζει ότι η φροντίδα της οικογένειας είναι ευθύνη και υποχρέωση, όχι θέμα συμπάθειας. Κλείνει με μια συμβουλή ζωής: μην περνάς τη ζωή σου ανησυχώντας αν σε συμπαθούν οι άλλοι, αλλά φρόντισε να σου φέρονται σωστά. Είναι μια σκληρή αλλά βαθιά σκηνή για την αξιοπρέπεια, το καθήκον και τη διαφορά τους από το συναίσθημα.", "x": "What law is there say I got to like you? None. All right, then. Don't you eat every day? Answer me when I talk to you. Don't you eat every day? Yeah. Nigga, as long as you in my house, you put a sir on the end of it when you talk to me. Yes, sir. You eat every day. Yes, sir. Got a roof over your head. Yes, sir. Got clothes on your back. Yes, sir. Why you think that is? 'Cause of you. Hell, I know it's 'cause of me, but why do you think that is? 'Cause you like me. Like you. I go out of here every morning, I bust my butt putting up with them crackers every day 'cause I like you. You're about the biggest fool I ever saw. It's my job. It's my responsibility. A man is supposed to take care of his family. You live in my house, fill your belly with my food, put your behind on my bed because you're my son. Not because I like you, 'cause it's my duty to take care of you. I owe a responsibility to you. Now, let's get this straight right here and now before I go along any further. I ain't got to like you. Mr. Rand don't give me my money come payday 'cause he like me, he give it to me 'cause he owe me. Now, I don't give you everything I got to give you, I give you your life. Me and your mama worked that out between us and liking your Black ass wasn't part of the bargain. Now, don't you go through life worrying about whether somebody like you or not. You best be making sure they're doing right by you. You understand what I'm saying? Yes, sir. Then get the hell out of my face and get on down to that A&P."}, {"f": "DSIOSniEgeB.mp4", "t": "Βίντεο", "s": "Ένα βίντεο για το πώς να αποκαλύψεις τι θέλει κάποιος από σένα, αντιστρέφοντας την κατάσταση. Ο ομιλητής εξηγεί ότι αν κάποιος προσπαθεί να αποσπάσει ευαίσθητες πληροφορίες από εσένα, μπορείς να αποκαλύψεις την τακτική λέγοντας δυνατά αυτό που συμβαίνει, γιατί όταν επισημαίνεις μια τακτική αφαιρείς τη δύναμή της. Το παράδειγμα είναι να πεις κατά τη διάρκεια της συνομιλίας ότι νιώθεις πως αποκαλύπτεις πολλές ευαίσθητες πληροφορίες. Αν δεις τον άλλον να αγχώνεται, αυτόματα γίνεσαι υπερβολικά προσεκτικός και ανθεκτικός σε μελλοντικές προσπάθειες. Η ουσία είναι να κάνεις το ασυνείδητο συνειδητό. Ονομάζοντας ανοιχτά αυτό που κρύβεται κάτω από την επιφάνεια μιας συνομιλίας, αποδυναμώνεις τον μηχανισμό χειραγώγησης και ανακτάς τον έλεγχο. Πρόκειται για μια συμβουλή αυτοπροστασίας σε κοινωνικές συναναστροφές, βασισμένη στην ιδέα ότι η επίγνωση και η ονομασία μιας τακτικής είναι από μόνες τους μια μορφή άμυνας.", "x": "How do you get someone to reveal what they want from you? I would say if I was in a conversation with somebody, if someone's trying to get sensitive information out of me, I would call out the script right away. When you call attention to a tactic being done, it takes the power away from that tactic completely. Let's say we're talking to each other, you're talking to me, and I said, \"Wow, it feels like I'm just revealing a whole lot of sensitive information here. It feels like I'm giving away a whole lot of info.\" And if I see you get nervous, that's automatically gonna make me hyper-aware of what's going on, and it's gonna make me very resistant to doing anything in the future. Make the unconscious conscious."}, {"f": "DSp84RrAVl2.mp4", "t": "Βίντεο", "s": "Ένα βίντεο στα ισπανικά που παρουσιάζει βήμα προς βήμα την κατασκευή ενός νιχου στην ντουζιέρα ως έργο ακρίβειας. Πρώτα ισοπεδώνεται και προετοιμάζεται η βάση με κονίαμα, τοποθετώντας ένα πλακίδιο στήριξης τέλεια ευθυγραμμισμένο. Στη συνέχεια επενδύονται τα εσωτερικά τοιχώματα του νιχου, κόβοντας και προσαρμόζοντας τα πλακίδια ώστε να ταιριάζουν χωρίς να σπάει η συνέχεια των αρμών. Το πιο λεπτό σημείο είναι η κατασκευή του τριγωνικού ραφιού, με μέτρηση με γωνία, κοπή με τροχό και λοξοτόμηση των άκρων για ακριβή εφαρμογή. Τέλος εφαρμόζεται κόλλα και τοποθετείται το ράφι, επαναλαμβάνοντας τη διαδικασία για δεύτερο πάνω ράφι, επιτυγχάνοντας συμμετρία και οπτική συνέχεια των νερών του μαρμάρου. Το αποτέλεσμα είναι λειτουργικό, κομψό και ανθεκτικό, συνδυάζοντας πολυτελή αισθητική με χειροτεχνική τεχνική που εγγυάται διάρκεια. Το βίντεο ρωτά αν τέτοια ράφια εκτιμώνται περισσότερο για την αισθητική ή την ακρίβεια της εγκατάστασης.", "x": "Si alguna vez pensaste que un nicho de ducha es solo un detalle, mira cómo se convierte en una obra de precisión. Primero se nivela y prepara la base con mortero, colocando un azulejo de soporte perfectamente alineado. Luego se revisten las paredes internas del nicho cortando y ajustando los azulejos para que encajen sin romper la continuidad de las juntas. La parte más delicada es fabricar la repisa triangular, midiendo con escuadra, cortando con amoladora y biselando los bordes para un encaje exacto. Finalmente, se aplica adhesivo y se coloca la repisa, repitiendo el proceso para un segundo estante superior y logrando simetría y continuidad visual de las vetas de mármol. El resultado es funcional, elegante y resistente, combinando estética de lujo con técnica artesanal que garantiza durabilidad. ¿Crees que estos estantes se valoran más por su estética o por la precisión de la instalación?"}, {"f": "DSsMII8k0GT.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που υποστηρίζει ότι δεν προσελκύουμε ό,τι σκεφτόμαστε αλλά ό,τι νιώθουμε. Αν συμβαίνει κάτι στη ζωή σου που δεν θέλεις, το προσέλκυσες εξαιτίας του πώς νιώθεις, όχι του τι σκέφτηκες. Η ενέργεια στο σώμα μας καθορίζει τι κάνουμε, και αυτό που κάνουμε καθορίζει τι παίρνουμε στη ζωή. Γι' αυτό οι άνθρωποι αυτοσαμποτάρονται και αναβάλλουν, επειδή αποφασίζουν με βάση το συναίσθημα. Πριν πάρεις νέες αποφάσεις, φρόντισε το πώς νιώθεις. Η πρόταση περιλαμβάνει τρία βήματα: πρώτον, κινήσου καθημερινά για να ρέει η ενέργεια, δεύτερον, τρώγε καλύτερα, με τον γρηγορότερο τρόπο να είναι το να σταματήσεις να τρως τόσο πολύ και τόσο αργά, και τρίτον, κοιμήσου περισσότερο, επενδύοντας στον ύπνο αντί για το στρες. Αφού αλλάξεις το πώς νιώθεις, φτιάξε νέο σχέδιο δράσης. Το μήνυμα συνδέει τη σωματική φροντίδα με την αλλαγή ζωής.", "x": "Do you know that we don't attract what we think? We actually attract in our lives how we feel. So if you have something happening in your life right now and it's not what you want, well, you attracted it into your life because of the way you feel, because of your energy, not because of what you thought. The energy in our body determines what we do, and what we do determines what we get in our life. It determines our choices. So if you want to make changes in your life, you got to change the way you feel. So this way you can change that program that's running in the background. That's why people self-sabotage. That's why people are procrastinating, because they are constantly being dictated, making decisions in their life based on the way they feel. So that's why before you make any new decisions or make any new plans, take care of the way you feel. That means doing the three things. You got to, A, start to move. Get that energy flowing. Do movement every single day no matter what. Number two, you got to eat better. The number one fastest way to start eating better is to stop eating so much, okay? And stop eating so late. Get that food out of your house. Get it out of your way. And then number three, get more sleep. We usually don't get a lot of sleep if we are busy working and stressing about something. So get more sleep. Invest in that. Do those three things. Change the way you feel, and then make a new action plan to make some big changes in your life. This is how it works for real change to happen. Hope this helps. Try it out. Let me know how it goes."}, {"f": "DSqerFHE891.mp4", "t": "Βίντεο", "s": "", "x": ""}, {"f": "DRznlMtDAVE.jpg", "t": "Φωτογραφία", "s": "Ένα κείμενο από τον λογαριασμό bookswithswapnil με συμβουλές για το πώς να μιλάς στον καθένα. Η πρώτη συμβουλή είναι να ξεκινάς με ζεστό χαμόγελο, που δείχνει αυτοπεποίθηση και ήρεμη ενέργεια. Η δεύτερη είναι ο χρυσός κανόνας της οπτικής επαφής: κοίτα τον άλλον στα μάτια αρκετά ώστε να προσέξεις το χρώμα τους και μετά κοίτα αλλού, βρίσκοντας ισορροπία ανάμεσα σε αυτοπεποίθηση και άνεση. Η τρίτη είναι να λες το όνομά του, που είναι ο πιο γλυκός ήχος για τον ίδιο, χωρίς όμως υπερβολές. Η τέταρτη είναι να κάνεις ερωτήσεις που τον βάζουν να σκεφτεί, όπως τι σε ενθουσιάζει αυτή την εβδομάδα, αντί για το τυπικό πώς είσαι. Η πέμπτη είναι να ταιριάζεις την ενέργεια και τον τόνο του συνομιλητή σου μέσω καθρεφτίσματος. Η έκτη είναι να ακούς με το πρόσωπο, γνέφοντας, χαμογελώντας και γέρνοντας ελαφρώς μπροστά, γιατί το ενδιαφέρον χτίζει σύνδεση. Το κείμενο κλείνει με προτροπή αποθήκευσης της ανάρτησης.", "x": "How to\nTalk to\nAnyone\n@bookswithswapnil\n\n1. Start With a Warm Smile\nA slow, relaxed smile shows\nconfidence and calm energy. It\nmakes you look approachable,\nnot nervous.\n@bookswithswapnil\n\n2. Use The \"Golden Eye\nContact Rule\"\nLook into someone's eyes long\nenough to notice their eye color\nthen look away. It's the perfect\nbalance between confidence\nand comfort.\n@bookswithswapnil\n\n3. Say Their Name-People\nLOVE It\n\"Nice talking to you, Aisha.\"\nTheir name is the sweetest\nsound to them.\nUse it, but don't overdo it.\n@bookswithswapnil\n\n4. Ask Questions That Make\nThem Think\n× \"How are you?\"\n/ \"What's one thing you're\nexcited about this week?\"\nPeople open up when they feel\nsafe and valued.\n@bookswithswapnil\n\n5. Match Their Energy & Tone\nIf they talk fast - match it.\nIf they talk softly - soften.\nMirroring makes conversations\nfeel natural and comfortable.\n@bookswithswapnil\n\n6. Listen With Your Face, Not\nJust Your Ears Nod, Smile.\nLean slightly forward.\nThese small signals show\ninterest- and interest builds\nconnection.\n@bookswithswapnil\n\nSave this Post & Follow\nfor More!\n@bookswithswapnil"}, {"f": "DSKJnBEjNpa.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που προτείνει ένα βραδινό πείραμα επικοινωνίας για ζευγάρια. Μετά το δείπνο, αφού κοιμηθούν τα παιδιά, οι δύο σύντροφοι κάθονται αντικριστά χωρίς τηλέφωνα ή τηλεόραση και βάζουν χρονόμετρο δέκα λεπτών. Μιλούν εναλλάξ από δύο λεπτά ο καθένας, με τον έναν να μιλάει και τον άλλον να ακούει χωρίς διακοπές, υπεράσπιση ή προτάσεις επίλυσης. Ο ομιλητής πρέπει να πει πώς νιώθει πραγματικά, όχι αυτό που νομίζει ότι θέλει να ακούσει ο άλλος, όπως νιώθω αποσυνδεδεμένος από σένα ή μου λείπεις αν και είσαι εδώ. Όταν χτυπήσει το χρονόμετρο, αλλάζουν ρόλους. Στην αρχή θα είναι άβολο και ίσως κλάψουν, αλλά κάπου μέσα σε αυτά τα δέκα λεπτά κάτι θα μετατοπιστεί και θα ξαναδούν ο ένας τον άλλον, τον άνθρωπο που ερωτεύτηκαν. Οι σχέσεις δεν τελειώνουν όταν πεθαίνει η αγάπη αλλά όταν πεθαίνει η σύνδεση, που πεθαίνει όταν σταματάμε να ακούμε.", "x": "Tonight, I want you to try something with your partner. It's gonna feel a little bit awkward in the beginning, but trust me, just do it anyway. After dinner, whether you have kids or not, and you put the kids to sleep, sit facing each other. No phones, no TV, just you two. Set a timer for 10 minutes, and here's what I want you to do. I want you to take turns, two minutes each. Person one, you're gonna talk. Person two, you just keep quiet and you listen. No interrupting, no defending, no fixing. Just listen. Person one, tell them how you're really feeling. Not what you think they want to hear, but the real truth from the heart. Here's an example. \"I feel disconnected from you,\" or, \"I feel like we're roommates,\" or, \"I miss you even though you're right here.\" You know? Whatever it is, say it from the heart. When the timer goes off, switch roles. Now person two talks, person one listens. Do this back and forth for 10 minutes. Here's what's gonna happen. At first, it's gonna feel uncomfortable. You might cry. It's okay. But somewhere in those 10 minutes, something will shift between the two of you. You'll actually see each other again. Not the person you're mad at, not the person who forgot to do the dishes. The person you fell in love with because they're still here. They're still there right with you. You've just been too busy, like all of us, to notice. See, most relationships don't end because love dies. They end because connection dies. And connection dies because we stop doing simple things like this, just listening. Ten minutes tonight, guys. No excuses. Your relationship is worth the 10 minutes."}, {"f": "DSNU7rOFfUp.jpg", "t": "Φωτογραφία", "s": "Ένα σύντομο κείμενο με τίτλο σχέδιο 2026 που λειτουργεί ως μανιφέστο νέου ξεκινήματος. Οι τέσσερις οδηγίες είναι: διέγραψε τους αρνητικούς ανθρώπους, αποδέξου τα λάθη σου, ξέχασε το παρελθόν σου και επανεκκίνησε τη ζωή σου. Πρόκειται για μια απλοποιημένη λίστα στόχων για τη νέα χρονιά, που ενθαρρύνει τον αναγνώστη να απομακρυνθεί από τοξικές σχέσεις, να συμφιλιωθεί με τα λάθη του, να αφήσει πίσω ό,τι τον βαραίνει και να κάνει μια φρέσκια αρχή. Το μήνυμα ανήκει στην κατηγορία της αυτοβελτίωσης και της νοοτροπίας της νέας αρχής, όπου η αλλαγή προϋποθέτει αποκοπή από ό,τι μας κρατά πίσω. Αν και διατυπωμένο με απλό και σχεδόν τελετουργικό τρόπο, το νόημα είναι ουσιαστικό: η ανανέωση απαιτεί συνειδητή απόφαση να εγκαταλείψεις ό,τι σε βλάπτει και να δεχτείς την ατέλειά σου ως μέρος της πορείας. Είναι ένα μήνυμα ελπίδας και ανασύνταξης για την αρχή ενός νέου έτους.", "x": "2026 Plan\nDelete negative people\nAccept your mistakes\nForget your past\nRestart your life..."}, {"f": "DSGw4wLkZXt.mp4", "t": "Βίντεο", "s": "Ένα έντονο προφορικό ποίημα για μια αγάπη που δεν ήταν αμοιβαία. Ο ομιλητής εκφράζει την επιθυμία να είχε χάσει τον άλλον με τον ίδιο τρόπο που έχασε τον εαυτό του προσπαθώντας να τον βρει. Ο άλλος του είπε σ' αγαπώ αλλά παρέλειψε όλα τα υπόλοιπα που συνοδεύουν αυτή τη φράση, όπως η ειλικρίνεια. Ο ομιλητής άλλαξε τον εαυτό του επειδή νόμιζε ότι ο άλλος τον ήθελε, έκανε τα πάντα για να γίνει κάποιος που εκείνος δεν ήθελε ποτέ. Ο άλλος δεν τον ήθελε πραγματικά, ήθελε να είναι ερωτευμένος περισσότερο από όσο ήθελε να αγαπήσει, ήθελε να τον θέλουν. Του έδινε μικρά προβλήματα που μπορούσε να λύσει για να ξαναπέφτει στην παγίδα. Ο ομιλητής καταλήγει ότι η μοναξιά του άλλου δεν αξίζει περισσότερο από τον χρόνο του, και ότι δέκα λεπτά πριν δέκα μήνες θα τον είχαν γλιτώσει από όλη αυτή τη θλίψη.", "x": "I wish I could have lost you the way I lost myself finding you, 'cause you forgot to give me everything else you're supposed to when you tell someone, \"I love you,\" like honesty. Because honestly, I changed myself because I thought you wanted me. I did everything I could to be someone you never even wanted. You never wanted to be with me. I loved you, and you didn't even love me enough to let me go. Instead, you cast me in this selfish show with these, these lies, these little things. \"Oh, you're perfect, but we can't be together 'cause X, Y, Z.\" I changed the whole alphabet, and you still don't wanna be with me. You gave me these small problems that I could fix. I'd fall for again and again. I thought I was playing a game that I could win. You never wanted me. You wanted to be in love more than you wanted to love. You wanted to be wanted. I, I wanna be done. 'Cause guess what? Your loneliness is not worth more than my time, and 10 minutes 10 months ago would've saved me all this grief, and maybe now I would be with someone who wanted to want me"}, {"f": "DRkyYwdCGFR.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που εξηγεί ότι ο γρηγορότερος τρόπος να αποδεσμευτείς από κάποιον που αγαπάς πολύ είναι να τον αφήσεις να κάνει ό,τι θέλει, ώστε να δεις τι προτιμά πραγματικά. Αν θέλει να σε χάσει, άφησέ τον. Αν θέλει να διαλέξει κάποιον άλλον αντί για σένα, άφησέ τον. Αν μπορεί να φανταστεί τη ζωή του χωρίς εσένα, άφησέ τον. Ο ομιλητής τονίζει ότι σπαταλάς τεράστιο χρόνο και ενέργεια εστιάζοντας σε ό,τι δεν μπορείς να ελέγξεις. Δεν μπορείς να αναγκάσεις κάποιον να δει την αξία σου, αλλά μπορείς να επιλέξεις να μην αφήνεις τους άλλους να καθορίζουν την αξία σου. Η συμβουλή είναι να σταματήσεις να δένεις την ευτυχία σου με τις πράξεις των άλλων. Πρόκειται για ένα μήνυμα συναισθηματικής απελευθέρωσης, που προτείνει την αποδοχή της ελευθερίας του άλλου ως δρόμο προς τη δική σου απελευθέρωση, αντί για την προσπάθεια ελέγχου που οδηγεί σε εξάντληση.", "x": "The fastest way to detach from someone you really love is by letting them do what they want to do so you can see what they would rather do. If they want to lose you, let them. If they want to choose someone else over you, let them. If they can picture their life without you, let them. You don't know how much time and energy you are wasting being hyper-fixated on what you cannot control. You can't force someone see your value. You can choose not to allow others to dictate your worth. Stop tying your happiness to other people's actions."}, {"f": "DQ9ZLjXjKHM.mp4", "t": "Βίντεο", "s": "Ένα ποίημα του Μιχάλη Γκανά για την αγάπη που κουράστηκε αλλά δεν πέθανε. Ο ποιητής λέει ότι επειδή σε αγάπησα και σε αγαπώ ακόμη κι αν δεν είναι όπως παλιά, δεν σημαίνει ότι πέθανε η αγάπη, απλώς κουράστηκε όπως κάθε τι που ανασαίνει. Είναι δύσκολο να αγαπάς και δυσκολότερο να αγαπάς τον ίδιο άνθρωπο για καιρό, κάνοντας μαζί σχέδια, παιδιά, καυγάδες, εκδρομές, έρωτα, χρέη, αρρώστιες, Χριστούγεννα, Κυριακές και Δευτέρες, νόστιμα φαγητά και καμένα. Καθένας θέλει να είναι για τον άλλον γεφύρι, δέντρο και πηγή ανάλογα με τις περιστάσεις, ή και όλα μαζί στην ανάγκη. Ο ποιητής δηλώνει ότι μπορεί να γίνει κάτι από όλα αυτά ή και όλα μαζί, και ότι αν είναι να περάσει μια ζωή στη σκλαβιά, ας είναι σκλάβος της αγάπης. Είναι ένας ύμνος στην ανθεκτικότητα της αγάπης μέσα στην καθημερινότητα και τη φθορά του χρόνου.", "x": "Επειδή σ' αγάπησα και σ' αγαπώ ακόμη κι ας μην είναι όπως παλιά, δεν θα πει πως πέθανε η αγάπη. Κουράστηκε ίσως σαν κάθε τι που ανασαίνει. Επειδή είναι δύσκολο να αγαπάς και δυσκολότερο να αγαπάς τον ίδιο άνθρωπο για καιρό, κάνοντας σχέδια και παιδιά και καυγάδες, εκδρομές, έρωτα, χρέη και αρρώστιες, Χριστούγεννα, Κυριακές και Δευτέρες, νόστιμα φαγητά και καμένα. Θέλοντας ο καθένας να είναι ο άλλος γεφύρι και δέντρο και πηγή κατά τις περιστάσεις ή και όλα μαζί στην ανάγκη. Δεν θα πει πως εγώ δεν μπορώ να γίνω κάτι από όλα αυτά ή και όλα μαζί. Κι αν είναι να περάσω μια ζωή στη σκλαβιά έτσι κι αλλιώς. Ας είμαι λέω σκλάβος της αγάπης. Προσωπικό του Μιχάλη Γκανά."}, {"f": "DSKNvBQDJPB.jpg", "t": "Φωτογραφία", "s": "Ένα κείμενο στα ελληνικά, με αλλοιωμένη οπτική αναγνώριση, που περιγράφει το βασανιστήριο του χάλκινου ταύρου. Πρόκειται για μια αρχαία συσκευή βασανισμού, έναν χάλκινο ταύρο σχεδιασμένο για να χωρά στο εσωτερικό του ένας ολόκληρος άνθρωπος. Το θύμα έκλεινε ερμητικά μέσα και άναβαν φωτιά από κάτω, με αποτέλεσμα να ψήνεται ζωντανός στο εσωτερικό. Οι κραυγές του θύματος μετατρέπονταν μέσα από έναν μηχανισμό σε ήχους που έμοιαζαν με μουγκρητό ταύρου. Δημιουργός του θεωρείται ο χαλκουργός Περίλαος, που το παρουσίασε στον τύραννο Φάλαρη του Ακράγαντα στη Σικελία, και σύμφωνα με την παράδοση ο ίδιος έγινε το πρώτο θύμα της συσκευής του. Ο χάλκινος ταύρος λειτούργησε ως ιστορικό παράδειγμα ακραίας βαρβαρότητας, εδραιώνοντας τη φήμη του Φάλαρη ως σκληρού και τυραννικού άρχοντα. Από αυτή την ιστορία προέκυψε και ο όρος ταύρειος χαλκός για την περιγραφή πράξεων ακραίας ωμότητας.", "x": "TO BAZANIZTHPIO ПОУ AEN\nXOPAEI ANOPONINOL NOYZ\n\nO Xá)kivos Taúpos ntav éva artó ro t10\nBávavoa kai okAnpá Baoavio tńora.\nO TaÚDOS ýTaV @TIayHÉvOS aTó Xalkó\nKOI OXEdIOcopévos yIa vo Xupós oTo\nSOWTEDIKÓ TOU ÉVO OLÓKAnDO áVEpWTtO.\n\nO к@adıkaouévos KJaıdwvótœv uéoa\nOTó jO Tlacivý MópTO t gave a reward only sometimes, that's when the obsession started. It's called the variable reward effect. Your brain releases more dopamine when the reward is unpredictable. So when someone texts you one day like you're their whole world and disappears the next day like you never mattered, your brain is not reacting to the person, it's reacting to the timing of the attention. And unpredictable attention becomes the most addictive kind"}, {"f": "DRdYX0TCTZ_.mp4", "t": "Βίντεο", "s": "Ένα βίντεο για το φαινόμενο του πλαισίου στην αντίληψη της φωτογραφίας, γνωστό ως Japan effect. Μια συνηθισμένη φωτογραφία που θα προσπερνούσες γίνεται ξαφνικά ενδιαφέρουσα αν μάθεις ότι τραβήχτηκε στην Ιαπωνία. Ο εγκέφαλος συμπληρώνει αυτόματα όλα τα κενά με ό,τι αντιπροσωπεύει η Ιαπωνία, ακόμη κι αν τίποτα από αυτά δεν φαίνεται στη φωτογραφία. Αυτό ονομάζεται πλαισίωση βάσει συμφραζομένων και λειτουργεί γιατί η Ιαπωνία έχει μια από τις ισχυρότερες αισθητικές προκαταλήψεις στον κόσμο. Το φαινόμενο διαμορφώνει την ιστορία πολύ πριν τη φωτογραφία: η Μόνα Λίζα για τετρακόσια χρόνια ήταν απλώς ένα ωραίο πορτρέτο που οι επισκέπτες προσπερνούσαν, μέχρι που κλάπηκε από το Λούβρο το 1911, και αυτή η κλοπή της έδωσε νέο πλαίσιο και την ανέδειξε σε αριστούργημα. Το μήνυμα είναι ότι το πλαίσιο καθορίζει την αξία που αποδίδουμε στα πράγματα.", "x": "Take a look at this photo. It's pretty basic, right? If I told you that this was Wisconsin, you'd probably say, \"Okay, cool. This is some sort of test shot. Nothing special.\" But then if I told you that this was actually Japan, suddenly your brain goes, \"Wait, this is actually kind of aesthetic. Really liking this vibe.\" That switch up is exactly what we're talking in today's video. This is something called the Japan effect. We've got this photo from Boston, or is it Japan? This one from LA, or Japan. Ohio, or Japan. Mentally, something very interesting is happening. We go from a photo that we'd absolutely scroll past to a photo that suddenly has meaning, maybe even a story behind it, and this isn't random. This is a real psychological phenomenon called contextual framing. The reason this happens is when you see a photo and your brain thinks it's Japan, it automatically fills all the gaps as though this is Japan, and everything Japan represents, even if none of those things are in the photo. And the reason this works so well for Japan is it just so happens to have one of the strongest aesthetic bias in the world. We romanticize the culture, a place that a lot of us see as highly aesthetic. It's a country known for its design, color, its unique style. So when you take a bland photo like this and say, \"Hey, this was actually taken in Japan,\" our brain starts to give it more credit, essentially upgrading the photo. But here's where it gets interesting. Contextual framing has been shaping history long before photography. Take the Mona Lisa, for an example. When Leonardo da Vinci painted it, it wasn't considered the greatest work of all time. It was just a nice portrait, one of many, in fact. And for nearly four hundred years, people would just walk right by it, not even giving it a second glance. Then, in nineteen eleven, the Mona Lisa was stolen from none other than the Louvre. Yeah, the same museum in Paris that just got robbed recently. Now, this heist made global news, and crowds didn't rush to see all the art in the museum. In fact, they lined up for hours just to see the empty space on the wall where the Mona Lisa once hung. Then when the painting was finally returned, it returned as a world famous icon. The story surrounding it reframing the art itself, taking what was once just an ordinary portrait and making it the most famous image in the world. It's the very same painting, but now the framing of it, completely different. Now let's stick with art for a second. The same thing happened to Van Gogh. While he was alive, he only sold one painting. People saw him as unstable, too emotional, and not even technically impressive. But then after he died, the whole narrative shifted. He was then reframed as a visionary, someone far ahead of his time. It's the same art, the same brush strokes, but now completely different meaning. So framing doesn't just change how we see a photo, it changes how we see everything. A meal tastes better when you're told it's gourmet. A painting looks deeper when you're told that it's been done by a master. The context will shape the experience. And once you understand that, something internally shifts because you start to realize all of the meaning that you are giving things. So the real message of the Japan theory is you don't need a different life. You just need a different lens. Look for meaning in something that you may have been overlooking because the world doesn't change when you reframe it. You do. I would love to know in the comments anything that you've changed in your life just by reframing it. It is such a powerful message. Okay, if you guys enjoyed this video, please be sure to like and follow for more videos like this. Thank you so much for watching, and I'll catch you in my next one. See you guys later."}, {"f": "DRkZ-YzAZDD.mp4", "t": "Βίντεο", "s": "Ένα σύντομο μήνυμα για τον κίνδυνο της οργής. Ο ομιλητής προειδοποιεί να προσέχεις τον θυμό που κρατάς μέσα σου, γιατί αν τον κρατήσεις αρκετά, σιγά σιγά θα αρχίσει να σε μετατρέπει στο πρόσωπο που σου τον προκάλεσε. Πρόκειται για μια φιλοσοφική παρατήρηση με ψυχολογικό βάθος: η εμμονή με την αδικία που υποστήκαμε και η συνεχής αναβίωση του θυμού μπορεί να μας κάνει να μοιάσουμε σε εκείνους που μας έβλαψαν. Ο θυμός, όταν δεν εκτονώνεται και δεν επεξεργάζεται, γίνεται τρόπος ζωής και διαμορφώνει τον χαρακτήρα μας προς το χειρότερο. Το μήνυμα λειτουργεί ως υπενθύμιση της ανάγκης να αφήνουμε πίσω τον θυμό, όχι για χάρη του άλλου αλλά για τη δική μας ψυχική υγεία. Είναι μια σύντομη αλλά ουσιαστική προτροπή προς τη συγχώρεση ή τουλάχιστον προς την αποδέσμευση από το συναίσθημα που μας φθείρει, ώστε να μην επαναλάβουμε το κακό που μας έγινε.", "x": "That anger you're holding onto, be careful with that because if you hold onto it long enough, it'll slowly start to turn you into the person who gave it to you. Just a friendly reminder"}, {"f": "DNhNjlYsQR4.mp4", "t": "Βίντεο", "s": "", "x": ""}, {"f": "DRNJ4szCNju.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που εξηγεί πώς να γίνεις αξέχαστος χρησιμοποιώντας τον κανόνα κορυφής και τέλους. Οι έρευνες δείχνουν ότι δεν θυμόμαστε ολόκληρη την εμπειρία, αλλά την κορύφωση και το τέλος της. Σε μια μελέτη, δύο ομάδες είχαν την ίδια επώδυνη εμπειρία, αλλά η μία έκδοση τελείωνε με ελαφρώς λιγότερο πόνο. Το παράδοξο είναι ότι οι άνθρωποι βαθμολόγησαν αυτή ως καλύτερη, παρότι κράτησε περισσότερο και πόνεσε συνολικά πιο πολύ. Δεν κρίνουμε την πραγματικότητα, κρίνουμε το τέλος. Γι' αυτό τα τελευταία δέκα δευτερόλεπτα κάθε αλληλεπίδρασης, μιας συνέντευξης για δουλειά, ενός ραντεβού ή μιας συνομιλίας, καθορίζουν πώς θα σε θυμηθούν. Η συμβουλή είναι να τελειώνεις δυνατά, με ζεστό τόνο και ήρεμο χαμόγελο, να είσαι σκόπιμος, γιατί δεν χρειάζεσαι τέλεια εμπειρία αλλά τέλειο τέλος. Πρόκειται για μια πρακτική εφαρμογή της ψυχολογικής έρευνας στις κοινωνικές σχέσεις και τις πρώτες εντυπώσεις.", "x": "How to go from forgettable to unforgettable using one fucked up psychological memory glitch. Studies shows that we don't remember an entire experience. We remember the peak and the end. In one study, two groups of people had the same painful experience, but one version ended with slightly less pain. Here's the fucked up part. People rated that as better even though it lasted longer and it hurt more. We don't judge reality. We judge the ending. That's why the last ten seconds of any interaction, a job interview, a date, or any conversation decides how they remember you. End strong with a warm note, with a calm smile. Be intentional, because you don't need a perfect experience. You need a perfect ending."}, {"f": "DRU1_uqiNhH.mp4", "t": "Βίντεο", "s": "Ένα βίντεο που παρουσιάζει μια ψυχολογική τεχνική για να αλλάξεις τη γνώμη κάποιου χωρίς καβγά ή παρακάλια, βασισμένη στην αρχή της αυτοσυνέπειας. Η ιδέα είναι να επαινέσεις την εκδοχή του άλλου που θέλεις να δεις, ώστε ο εγκέφαλός του να προσπαθήσει φυσικά να μείνει συνεπής με αυτήν. Το παράδειγμα είναι να πεις σε κάποιον ότι ήταν πάντα άνθρωπος που εξετάζει διαφορετικές οπτικές, οπότε άσε με να μοιραστώ τη δική μου. Η αντίσταση πέφτει γρήγορα, γιατί ο άλλος νιώθει την ανάγκη να επιβεβαιώσει τη θετική εικόνα που του αποδόθηκε. Ωστόσο ο ομιλητής διευκρινίζει ότι αυτό λειτουργεί μόνο αν ο άλλος έχει πράγματι αυτή την αξία, αλλιώς πρόκειται για εξαπάτηση. Η τεχνική στηρίζεται στην ανθρώπινη τάση να διατηρούμε μια συνεπή εικόνα του εαυτού μας, και προτείνεται ως εργαλείο πειθούς που σέβεται τον άλλον αντί να τον πιέζει.", "x": "How to change anyone's mind without arguing or begging. This is a psychological hack backed by the principle of self-consistency, and it actually works. So here's what to do. Compliment the version of them that you want to see so their brain naturally tries to stay consistent with it. For example, if you want someone to see your side of things, say this: \"You've always been someone who considers different perspectives, so let me share mine.\" And watch how fast the resistance drops. But remember, this only works if they have that value. Otherwise, it's deception."}, {"f": "DRQPtRqEWyM.mp4", "t": "Βίντεο", "s": "Ένα βίντεο του Μάικλ που εντοπίζει την περιφρόνηση ως το πρώτο σημάδι ότι μια σχέση είναι καταδικασμένη. Η περιφρόνηση δεν είναι εκνευρισμός ή μια κακή μέρα, ούτε το ότι μαλώνετε μερικές φορές. Είναι η στιγμή που ο σύντροφός σου σε κοιτάζει σαν να είναι ανώτερός σου, με γουρλώματα ματιών, κοροϊδευτικό τόνο και ύφος ότι είσαι γελοίος. Όλα αυτά λένε δεν σε σέβομαι. Σύμφωνα με δεκαετίες έρευνας στο Ινστιτούτο Γκότμαν, η περιφρόνηση είναι ο πρώτος προγνωστικός παράγοντας διάλυσης μιας σχέσης. Δεν μπορείς να χτίσεις σύνδεση atic, she's not overreacting, and she's not doing this on purpose. She's doing is holding steady while her biology tilts the floor underneath her. Have some respect for that and stop taking her monthly cycle personally, because her cycle is chemical, it's rhythmic, and it's real. And if you get that, you'll understand women better than most men ever will, and you have a chance to be a hero in her life. Write love story in the comments to remember that when you're a hero in your woman's life, you're living out a love story. Love story in the comments. Like the video, follow me, and click the link in my bio. I'm enrolling my program in manifestation right now. That program lives inside its own app, and inside that app, there's a community of people, and we're all upspiraling our lives together. Vibrant beings, upspiral your life."}, {"f": "DQ8AaDYkRRC.mp4", "t": "Βίντεο", "s": "Ο ομιλητής Μάικλ περιγράφει τη μνησικακία ως ένα είδος συναισθηματικής καούρας που κάθεται στο στήθος και ξαναζεσταίνει ό,τι μισήσαμε. Την ορίζει ως θυμό που δεν πρόλαβε να μιλήσει, ως ένα κομμάτι μας που πιστεύει ότι κάποιος άλλος κρατά τη δύναμή μας. Προτείνει τρία βήματα για να την πάρουμε πίσω. Πρώτα να ονομάσουμε το συναίσθημα, κάτι που η νευροεπιστήμη αποκαλεί affect labeling, ώστε να ηρεμήσει η αμυγδαλή και να επανέλθει ο προμετωπιαίος φλοιός. Δεύτερον, να βάλουμε όριο με μία καθαρή φράση προς τον άλλον, χωρίς μακροσκελείς εξηγήσεις. Τρίτον, να ρυθμίσουμε τη χημεία μας με βαθιές αναπνοές που επαναφέρουν το πνευμονογαστρικό νεύρο. Το κεντρικό μήνυμα είναι ότι οι επιτυχημένοι άνθρωποι δεν αφήνουν την πικρία να τους κυβερνά, αλλά ελέγχουν το μυαλό, το στόμα και τη διάθεσή τους.", "x": "So resentment is like emotional heartburn. It sits inside your chest and it goes, \"Hey, remember that thing you hated? I reheated it for you.\" Let's fix that before your soul gets acid reflux. If you're new here, I'm Michael. I help you up spiral your life. If you're into that, follow me and click the link ay to not face your own wounding of I'm not enough"}, {"f": "DQKldR0j_h9.mp4", "t": "Βίντεο", "s": "Η ομιλήτρια εξηγεί ότι όταν θυσιάζει τις ανάγκες και τα συναισθήματά της για τους άλλους, μετατρέπει εκείνους σε κακούς στη ζωή της χωρίς τη συγκατάθεσή τους, και θα τους μνησικακεί ανάλογα με τη θυσία της. Νόμιζε πως ήταν καλός άνθρωπος καταπίνοντας τα συναισθήματά της και βάζοντας τους άλλους πρώτα, ενώ στην πραγματικότητα καταδίκαζε τα αγαπημένα της πρόσωπα να γίνουν αυτοί που την πληγώνουν περισσότερο. Η αγάπη και η σύνδεση είναι πόρτες που κλειδώνουν από μέσα. Περίμενε να την αγαπήσει κάποιος τόσο πολύ ώστε να επιτρέψει στον εαυτό της να αγαπηθεί, αλλά κανείς δεν μπορούσε να το κάνει. Έπρεπε πρώτα να αγαπήσει και να φροντίσει τον εαυτό της, και τότε αυτή η συμπόνια απλώνεται και στους άλλους.", "x": "If I sacrifice my needs and my feelings for you, then I am turning you into the villain in my life without your consent, and I will resent you to whatever level I sacrifice myself. I thought I was being a good person. I thought I was being the good person by s- by stuffing my feelings and by not getting my needs met and by putting everyone else before me, and what I was actually doing was damning the people who loved me the most to be the people who hurt me the most. It was like I was taking their hands and smacking myself in the face with it without them wanting to, without their consent. Dang hair tie. Love, connection, these are doors locked from the inside. I was waiting for you to love me so hard I would finally allow myself to be loved, and you couldn't do it. He couldn't do it. She couldn't do it. Nobody could do it. I had to love me first. I had to care for me first. Before I care for anyone else, I have to care for me. Before I go and understand my husband and where he's coming from, I turn to me and I go, \"Hey, babe. Everybody gets upset sometimes. It's all right.\" Real compassionate curiosity towards me, and guess what? I can't help but give it to others ou're saying... So that is... It, it almost is in some respects. Although isn't the fragility of... Should we be that afraid of something that to, to destroy it, we just have to unplug it? Um, yes, we should. Because something you said earlier, it'll be very good at persuasion. When it's much smarter than us, it'll be much better than any person at persuasion. Right. And you won't... It- So it'll be able to talk to the guy who's in charge of unplugging it- Right ... and persuade him that would be a very bad idea. So let me give you an example of how you can get things done without actually doing them yourself. Right. Suppose you wanted to invade the capital of the US. Do you have to go there and do it yourself? No, you just have to be good at persuasion."}, {"f": "DPg9SVIj01u.mp4", "t": "Βίντεο", "s": "Απόσπασμα διαλόγου όπου κάποιος ρωτά γιατί ο συνομιλητής του δεν παντρεύεται. Εκείνος απαντά ότι φτιάχνει φορέματα και πως είναι σίγουρος πως δεν προορίστηκε ποτέ για γάμο, δηλώνοντας «επιβεβαιωμένος εργένης» και αθεράπευτος. Εξηγεί ότι ο γάμος θα τον έκανε υποκριτή και δεν το θέλει. Όταν η συνομιλήτριά του παρατηρεί ότι μόνο δυνατός παριστάνει, εκείνος επιμένει ότι είναι πραγματικά δυνατός. Το απόσπασμα κλείνει με τη σκέψη ότι οι προσδοκίες και οι υποθέσεις των άλλων είναι αυτές που προκαλούν τον πόνο στην καρδιά. Πρόκειται για μια ήρεμη σκηνή που εξετάζει την ελευθερία της επιλογής να μείνει κανείς μόνος και το βάρος που επιβάλλουν οι κοινωνικές προσδοκίες, με μία αίσθηση κινηματογραφικού διαλόγου εποχής.", "x": "Why are you not married? I make dresses. You cannot be married when you make dresses? I'm certain I was never meant to marry. I'm a confirmed bachelor. I'm incurable. Marriage would make me deceitful, and I don't ever want that. You sound so sure about things. I'm sure about that. I think you are only acting strong. No, I am strong. For who? Not for me, I hope. I think it's the expectations and assumptions of others that cause heartache."}, {"f": "DPpFUKYD26S.mp4", "t": "Βίντεο", "s": "Η θεραπεύτρια ζευγαριών υποστηρίζει ότι οι άνθρωποι που απατούν είναι τις περισσότερες φορές people pleasers, δηλαδή άνθρωποι που προσπαθούν να αρέσουν. Σε αντίθεση με την εικόνα του εγωιστή στις ταινίες, στην πραγματικότητα ο άπιστος κρύβει τον αληθινό του εαυτό από φόβο μήπως χάσει την αποδοχή. Υποτιμά τα συναισθήματά του, τα θάβει, και επειδή δυσκολεύεται να εντυπωσιάσει πια τον σύντροφό του, αναζητά εκτός σχέσης την επιβεβαίωση. Το πρόβλημα δεν είναι το πρόσωπο που απατά, αλλά ο τρόμος του ότι δεν αξίζει αγάπη. Ζητά να ακουστούν οι ιστορίες τους γιατί οι άπιστοι δεν παίρνουν ποτέ επιείκεια και έτσι δεν θεραπεύονται. Απευθύνεται και στους απατημένους, τονίζοντας ότι η απιστία δεν αφορά εκείνους.", "x": "Cheaters are people pleasers. Most of the time. I didn't know that. People get this wrong because in the movies it's, like, some selfish, douchey person. But in real life, working as a couples therapist, working as a relationship coach, what I keep seeing is that the person who cheats is actually the person who's really good at people-pleasing. Because if I don't believe that you trusting me is more important than you liking me, I will hide who I am so that you like me, and I will call it love. I will say, \"Well, it's not that big of a deal, so I'm not gonna bring it up. Oh, my feelings, uh, aren't that important. It's so silly that I have that feeling.\" Little things like that, I'll shove them away. And because I'm so afraid that if you stop liking me for a moment, I will lose you forever, I will go outside the relationship to feel accepted, to feel seen, to wow somebody again, because it's getting harder to wow you. I'm exhausted. I'm feeling drained, and that feels safer than showing up as my full self. It's not about the person that I'm cheating on. It's about me and how terrified I am that I don't actually matter, my feelings don't actually matter, and I don't actually deserve love. Those are the people who cheat. If that was y at's good."}, {"f": "DQIlTgxDrY4.jpg", "t": "Φωτογραφία", "s": "Φωτογραφία με μία συλλογή θετικών μηνυμάτων αυτοβελτίωσης. Το κεντρικό μήνυμα είναι η αισιόδοξη ανατροπή: αντί για καταστροφή, όλα πηγαίνουν καλά και η ζωή συνεχώς βελτιώνεται. Περιλαμβάνονται φράσεις όπως ότι ακόμα και μία κακή μέρα κρατά μόνο 24 ώρες, ότι το ρίσκο είναι πάντα καλύτερο από τη μεταμέλεια, και ότι η ζωή αρχίζει στο τέλος της ζώνης άνεσης. Επίσης τονίζεται η σημασία του να ζεις στον δικό σου ρυθμό και να σε ενδιαφέρει περισσότερο πώς νιώθεις εσύ για τη ζωή σου παρά πώς φαίνεται στους άλλους. Μία άλλη φράση επισημαίνει ότι η ζωή σου αλλάζει πραγματικά από τη μία μέρα στην άλλη, απλώς χρειάζονται χρόνια για να φτάσεις σε εκείνη τη νύχτα. Το περιεχόμενο είναι τυπικό motivational υλικό κοινωνικών δικτύων.", "x": "PLOT TWIST:\nIT ALL GOES WELL\nAND LIFE KEEPS\nGETTING BETTER\n\nEVEN A\nBAD DAY\nIS JUST\n24 HOURS.\n\nRiSK IS\nALWANS\nBETTER\nTHAN\nREGRET.\n\nLIFE\nBEGINS\nAT THE\nEND OF\nYOUR\nCOMFORT\nZONE.\n\nin my own\nlane.\n\n*way more\ninterested in\nhow my life\nfeels to me\nthan how it\nlooks to\nothers:\n\nYOUR LIFE ACTUALLY\nCHANGES\nOVERNIGHT.\nIT JUST TAKES YEARS\nTO GET TO THAT\nNIGHT.\n\nYou will never see\nthis page again unless\nyou follow us right now\n70"}, {"f": "DQO0ZjOE3tm.mp4", "t": "Βίντεο", "s": "Ο ομιλητής ρωτά γιατί κάποιος έχασε την αυτοπεποίθησή του, θυμίζοντάς του ότι ως παιδί χόρευε δημόσια και ρωτούσε χωρίς να τον νοιάζει η γνώμη των άλλων. Η κοινωνία μας έμαθε να αμφιβάλλουμε για τον εαυτό μας. Αναφέρεται στη νευροεπιστήμη και στη μνήμη, εξηγώντας ότι όταν ανακαλείς μία ανάμνηση με συγκεκριμένο συναίσθημα και το αντικαθιστάς με νέο, μπορείς να επαναπρογραμματίσεις τον εγκέφαλο. Αυτό είναι που μπορεί να κάνει η ύπνωση. Η αυτοπεποίθηση δεν είναι αλαζονεία ούτε επίδειξη, αλλά βεβαιότητα, γνώση της αξίας σου και καθαρή θέαση της ουσίας σου. Γι' αυτό δεν πρέπει να κυνηγάς την επιβεβαίωση από τους άλλους, αλλά να την δίνεις στον εαυτό σου, επιτρέποντάς του να είναι σίγ rough with somebody else that I send them an orchid, um, with a note that says, \"Thank you so much for the opportunity, um, and I'm sorry for your loss.\""}, {"f": "DPQ9kp4jCWh.mp4", "t": "Βίντεο", "s": "Ελληνικό βίντεο για τον κλασικό τρόπο με τον οποίο μία νάρκισσος βγάζει τον σύντροφό της εκτός εαυτού. Πρώτα τον σπρώχνει στα άκρα με την αγένειά της και, μόλις εκείνος αντιδράσει, δείχνει έκπληκτη με την αντίδρασή του, ρωτώντας γιατί θυμώνει. Δεν αναφέρει ποτέ τι έκανε η ίδια, ούτε την έλλειψη σεβασμού που δείχνει, αλλά εστιάζει αποκλειστικά στη δική σου αντίδραση, κάνοντάς σε να αμφιβάλλεις αν τελικά φταις εσύ, αν είσαι εσύ ο τρελός ή ο νάρκισσος. Ο ομιλητής τονίζει ότι αυτή η γυναίκα δεν επιζητά ηρεμία αλλά έλεγχο, και ότι ο μόνος τρόπος να κερδίσεις είναι να την αγνοήσεις και να απομακρυνθείς. Κλείνει λέγοντας ότι αν αναρωτιέσαι μήπως είσαι νάρκισσος, μάλλον δεν είσαι, γιατί ο νάρκισσος δεν έχει επίγνωση της τοξικότητάς του.", "x": "Κλασικός τρόπος που η γυναίκα νάρκισσος θα σε βγάλει εκτός εαυτού. Θα σε σπρώξει πρώτα στα άκρα με τον αγενή της τρόπο. Και μόλις αντιδράσεις θα δείξει έκπληκτη με το πώς αντέδρασες. \"Τι είναι αυτό; Γιατί θυμώνεις; Πώς κάνεις έτσι; Δεν πας καλά αγόρι μου.\" Δεν θα μιλήσει όμως καθόλου για το τι έκανε η ίδια. Δεν θα αναφέρει καθόλου για την έλλειψη σεβασμού που σου δείχνει, ούτε για το ότι σε συγχλάει. Όλα θα έχουν να κάνουν με το πώς εσύ αντιδράς και ότι είσαι τρελός. Εν τέλει λοιπόν, θα σε κάνει να απορείς αν όντως φταις εσύ. Αν όντως είσαι εσύ ο τρελός και ο τοξικός. Αν είσαι εσύ ο νάρκισσος. Χώνεψε το καλά. Δεν αναζητά ηρεμία και γαλήνη αυτή η γυναίκα. Θέλει μόνο να έχει τον έλεγχο και να σε σπάσει. Είναι ένας πόλεμος που θα κερδίσεις μόνο αν αποφασίσεις να την αγνοήσεις και να απομακρυνθείς. Και να θυμάσαι, αν φοβάσαι και αναρωτιέσαι μήπως είσαι νάρκισσος, το πιο πιθανό είναι να μην είσαι. Ο νάρκισσος δεν έχει επίγνωση του πόσο τοξικός είναι, ούτε θα το παραδεχτεί ποτέ, ούτε στον εαυτό του."}, {"f": "DOw3K9FDHKE.mp4", "t": "Βίν ecomes stronger than his father. The first way happens around 14. He slams doors. He refuses to move. He challenges every boundary. You say, \"We're going for a run to burn out your anger.\" He says, \"No.\" And you freeze because moving him means conflict, maybe getting physical, and you're tired or scared or just want peace. So you back down, you negotiate, you let it go. In that moment, you've handed your authority as a father to a child, a child whose brain isn't even developed, who doesn't provide, protect, or contribute, but who now knows, \"Dad's a coward who won't face me.\" Here's what happens next. He learns he comes from weakness, and that disgust burrows deep. He'll spend his whole life overcompensating, acting harder, angrier, more aggressive, trying to prove he's not you. Or he becomes exactly like you, another man who backs down when things get hard. Another father who one day let his own son run the house. But there's a second way. You hold the line every time. \"Shoes, now. We're going.\" Not negotiable, not optional. Yes, sometimes it means getting him physically moving. Yes, he'll rage against you. Yes, it'll be hard. But he needs to know there's at least one force in this world he can't bulldoze with anger. One man who won't crumble when he pushes. Because if you won't contain his chaos, your wife has to, and she shouldn't have to wrestle your son's untamed dogs. Years pass. He keeps training, growing, building himself, and somewhere around 24 it happens. He beats you at arm wrestling, out-lifts you at the gym, runs faster, jumps higher, grows stronger. But this time, he's earned it through competence, not defiance, through years of effort, not tantrums at 14. And when he finally legitimately surpasses you, he'll respect you for being the wall he had to build himself to climb. Most importantly, though, he'll respect himself because he knows his strength is real, not stolen and not given."}, {"f": "DOblkHbgK4u.mp4", "t": "Βίντεο", "s": "Ο ομιλητής εξηγεί την τεχνική του looping, μία μέθοδο βαθιάς ακρόασης που έμαθε από τον Γκάρι Φρίντμαν στο Κέντρο Κατανόησης και Σύγκρουσης. Σκοπός της είναι να αποδείξεις στον άλλο ότι πραγματικά προσπαθείς να τον καταλάβεις ακόμα κι αν διαφωνείς βαθιά. Τα τέσσερα βήματα είναι: πρώτα να ακούσεις τι είναι πιο σημαντικό για εκείνον, όχι για εσένα, προσέχοντας μεταφορές και δυνατές λέξεις. Δεύτερον, να αναδιατυπώσεις με δικά σου λόγια όσα άκουσες για να ελέγξεις αν καταλαβαίνεις. Τρίτον, να ρωτήσεις αν το πέτυχες σωστά και αν χάνεις κάτι, με γνήσια περιέργεια. Οι άνθρωποι συνήθως προσθέτουν ή διορθώνουν, αποκαλύπτοντας σταδιακά την ουσία της σύγκρουσης. Μόνο όταν ο άλλος πει «ναι, ακριβώς», προχωράς στην επόμενη ερώτηση. Η φυσική παρόρμηση είναι να προσφέρεις συμβουλές ή παρόμοιες ιστορίες, αλλά το looping απαιτεί να την αποφύγεις.", "x": "Looping is a deep listening technique that I learned from Gary Friedman at the Center for Understanding and Conflict. And it is a way to prove to the other person that you are really trying to understand them, even as you profoundly disagree. And this has totally transformed how I operate in the world as a journalist, but also just as a human, as a parent, as a spouse. The four steps of looping are to first listen to what the other person is saying, but really listen to what seems most important to them, not to you. Really, what are they most upset about? What do they wanna tell you underneath what they're saying? Listening for metaphors, for strong words. The next step is to use your own language, the most elegant language you can come up with, and play it back to them to see if you're understanding them. Summarize what you're hearing in your own language. And then the next step is to check if you got it right, to literally say, \"Is that right? Am I missing anything?\" And be genuinely curious. Don't just say it, right? But really wanna know the answer. What you find is usually people will add on to what they've said, or they'll correct you in some way. But they're slowly peeling away and revealing more and more of the understory, like what the conflict's really about, what they care most about. This is everything, right? 'Cause not only are you now starting to understand them better, but they're starting to trust that you want to understand them, which is like the skeleton key to conflict. And then if you get to a point where you check if you got it right and the person says, \"Yes, exactly,\" then and only then can you go to your next question or ask them to tell you more. The impulse very often, and I know I did this for years as a journalist, is to ask plot questions or to offer a similar story that you went through and try to connect with them, or, um, to maybe even try to offer advice, right? This is the natural inclination we all have. But what we found from the research is that before you do any of that, you have to prove to the person that you're trying to get them, and that makes everything else possible."}, {"f": "DPI967CCG0x.mp4", "t": "Βίντεο", "s": "Ελληνικό βίντεο που εξηγεί γιατί είναι δύσκολο να φύγουμε από μία τοξική σχέση, και ότι δεν είναι μόνο ψυχολογικό αλλά και βιοχημικό. Ο εγκέφαλος λειτουργεί με χημικές ουσίες που μας παγιδεύουν σε κύκλο εξάρτησης. Η ντοπαμίνη, ο νευροδιαβιβαστής της επιβράβευσης, εκκρίνεται στην αρχή της σχέσης από την έντονη έλξη και δημιουργεί ευφορία, παρόμοια με αυτή που προκαλούν οι εθιστικές ουσίες. Η ωκυτοκίνη, η ορμόνη της αγάπης, ενισχύει τον δεσμό με κάθε σωματική επαφή, ακόμα και σε προβληματικές σχέσεις. Στις τοξικές σχέσεις, όταν χωρίζεις ή τσακώνεσαι, αυξάνεται η νορεπινεφρίνη, η ορμόνη του στρες, προκαλώντας εμμονικές σκέψεις και την ανάγκη επιστροφής. Το χρόνιο στρες μειώνει τη σεροτονίνη, ενισχύοντας τη δυστυχία και την ανάγκη επιστροφής στη σχέση για ψεύτικη λύτρωση, δημιουργώντας έτσι έναν φαύλο κύκλο.", "x": "Γιατί είναι τόσο δύσκολο να φύγουμε από μια τοξική σχέση; Δεν είναι μόνο ψυχολογικό, είναι και βιοχημικό. Ο εγκέφαλός μας λειτουργεί με συγκεκριμένες χημικές ουσίες που μας παγιδεύουν σε έναν κύκλο εξάρτησης. Οι βασικοί πρωταγωνιστές είναι η ντοπαμίνη και η ωκιτοκίνη. Η ντοπαμίνη είναι ο νευροδιαβιβαστής του κινήτρου και της επιβράβευσης. Στην αρχή μιας σχέσης, τα μεγάλα λόγια, η έντονη έλξη, η προσδοκία για μεγάλο έρωτα προκαλούν έκκριση ντοπαμίνης. Ο εγκέφαλος μας δίνει μια αίσθηση ευφορίας. Μας λέει\" αυτό είναι καλό. Συνέχισε\". Αυτός ο μηχανισμός είναι παρόμοιος με αυτόν που ενεργοποιείται από εθιστικές ουσίες, όπως η κοκαΐνη, δημιουργώντας μια έντονη επιθυμία για επανάληψη της συμπεριφοράς, για να ξαναπάρουμε. Η ωκιτοκίνη, γνωστή ως ορμόνη της αγάπης, παίζει επίσης κεντρικό ρόλο. Είναι υπεύθυνη για τον δεσμό και την προσκόλληση. Εκκρίνεται σε στιγμές σωματικής επαφής, όπως οι αγκαλιές, τα φιλιά και κατά τη διάρκεια του σεξ. Κάθε φορά που συνδεόμαστε σωματικά, η ωκιτοκίνη ενισχύει τον δεσμό μας με το άλλο άτομο, ακόμη και αν η σχέση είναι προβληματική. Στις τοξικές σχέσεις αυτό που μας παγιδεύει είναι ο φαύλος κύκλος των έντονων συναισθημάτων. Όταν χωρίζουμε ή τσακωνόμαστε, και έχουν πολλά on off οι τοξικές σχέσεις, τα επίπεδα νορεπινεφρίνης αυξάνονται. Η νορεπινεφρίνη είναι η ορμόνη του στρες και του άγχους. Προκαλεί έντονη δυσφορία και εμμονικές σκέψεις για τον άλλον, κάνοντάς μας να νιώθουμε ότι τον, την χρειαζόμαστε επειγόντως για να ανακουφιστούμε. Την ίδια στιγμή, το χρόνιο στρες επηρεάζει αρνητικά τη σεροτονίνη, που είναι υπεύθυνη για την ευτυχία και την καλή μας διάθεση. Αυτή η μείωση της σεροτονίνης μας κάνει να νιώθουμε δυστυχία και ανασφάλεια, ενισχύοντας την ανάγκη να επιστρέψουμε στη σχέση για να βρούμε την ψεύτικη λύτρωση. Έτσι το σενάριο επαναλαμβάνεται. Ο πόνος του χωρισμού, νορεπινεφρίνη, μας οδηγεί να επιστρέψουμε στη σχέση όπου αναζητούμε την ευφορία, ντοπαμίνη, και τον δεσμό, ωκιτοκίνη, για να βρεθούμε εγκλωβισμένοι ξανά και ξανά στον ίδιο κύκλο. Αυτή η συνεχής εναλλαγή μας καθιστά βιοχημικά εθισμένους στο άλλο άτομο, ακριβώς όπως ένας εθισμός σε μια ουσία. Η γνώση του μηχανισμού είναι το πρώτο βήμα για να φύγεις από μια τοξική σχέση. Τα υπόλοιπα θα τα πούμε αναλυτικά στο διαδικτυακό σεμινάριο Τοξικές Σχέσεις που θα πραγματοποιηθεί στις 11 Οκτωβρίου. Πληροφορίες και δηλώσεις συμμετοχής στο sexacademy.eu."}, {"f": "DOyszpfgdRZ.mp4", "t": "Βίντεο", "s": "Ο ομιλητής μεταφέρει τη συμβουλή ενός έξυπνου ανθρώπου ότι οι ταινίες μικρού μήκους αφορούν το γεγονός, ενώ οι ταινίες μεγάλου μήκους αφορούν τον χαρακτήρα. Αν προσπαθήσεις να κάνεις μία ταινία μικρού μήκους που εστιάζει σε μία δυσκίνητη ιστορία γύρω από τον χαρακτήρα, με φλας μπακ και ιστορικό, το κοινό κοιμάται. Αντίθετα, αν έχεις ένα γεγονός που εκτυλίσσεται σε πέντε με δέκα λεπτά και το κάνεις να ξεχωρίσει, τότε δουλεύει. Σε μία μεγάλου μήκους ταινία, εκτός αν είναι μελόδραμα, το θέμα είναι οι χαρακτήρες και τι τους συμβαίνει μετά από ένα γεγονός ή μία σειρά γεγονότων. Επομένως τα δύο μέσα είναι από τη φύση τους σε αντίθεση, και γι' αυτό δεν συνιστά τη μετατροπή μίας μικρού μήκους ταινίας σε μεγάλου μήκους, παρόλο που ο ίδιος το έχει κάνει.", "x": "A really smart guy once told me that short films are about event and feature films are about character. So if you try to make a short film that focuses on this kind of unwieldy story that's around this character, I'm getting backstory and all this kind of stuff, everyone's asleep. But if you have this event, this short film that happens in five to 10 minutes and you can make it pop, yes, characters are involved, but it's about the event. So like in a feature, unless it's a melodrama, it's about the characters, what happens to them after a given event or a series of events. Therefore, I feel like the mediums are at odds just naturally. So I don't really recommend it. I've done it, but I don't recommend it."}, {"f": "DOqjxndjMIX.mp4", "t": "Βίντεο", "s": "", "x": ""}, {"f": "DN1N2UAUHeh.mp4", "t": "Βίντεο", "s": "Ο ομιλητής δίνει βήμα προς βήμα συμβουλές σε κάποιον που ξεκινά ως σκηνοθέτης. Πρώτα να ανοίξει λογαριασμό στο TikTok και να δημοσιεύει για τη σκηνοθεσία, γιατί κανείς δεν θα δει την ταινία σου αν δεν ξέρει ότι υπάρχεις. Δεύτερον, να γράψει μία πολύ φθηνή ταινία μικρού μήκους, με εκπληκτικά πρώτα τρία δευτερόλεπτα και συναρπαστικά πρώτα τριάντα δευτερόλεπτα, μαζεύοντας λίγα χρήματα από φίλους και οικογένεια. Ο εξοπλισμός μετρά λιγότερο από τον χρόνο σύνθεσης των πλάνων, και οι διάλογοι λιγότερο από τις ερμηνείες. Στη συνέχεια να ανεβάσει την ταινία στο Vimeo On Demand με χαμηλή τιμή, να διαφημίσει στο TikTok, να συνδέσει το TikTok pixel, και να δημοσιεύει καθημερινά βίντεο για την ταινία, δοκιμάζοντας ποιο περιεχόμενο αποδίδει, μέχρι να αποκτήσει εκατό πελάτες και να υπολογίσει το κόστος απόκτησης πελάτη.", "x": "Here's exactly what I would do if I was starting out as a director in the film industry right now. Step one, open a TikTok account and start posting about being a director or being creative in some way. Nobody wants to watch your film if they don't know that you exist. Step two, I would focus on writing a very, very cheap to make short film. I'd make the first three seconds very surprising, the first 30 seconds very compelling, and the first three minutes great watching. I would raise a very small amount of money to make this film. We're probably talking about parents, friends, family. The equipment that you shoot it on is way less important than the time that you take to compose those shots and make it look great. And the actual dialogue matters way less than the performances that you capture. Spend time getting the best out of your actors. Once it's ready, I would host it on OLIN or Vimeo Video on Demand with a relatively low price point, £2 maybe. I'd spend a little bit of money on my TikTok page if I wasn't already above 1,000 followers. That gives you access to put a link in your bio and link to the film. Then set up your TikTok pixel and put that pixel on OLIN or Vimeo Video on Demand. And now you make videos about your film every single day. As many as you can. You know, eight is probably the upper limit, but as many as you can. Clip up the film, put sections of the film on, test what works, test what works organic, and see what gets the best reaction. Don't spend any money on ads at this stage. You are just trying to get 100 people to pay £2 to watch the film. Once you've got that, however long it takes, then you can start pushing a little bit of paid spend behind content that you know works and pushing people to the film. Doing this will give you a customer acquisition cost, so you will know how much money it costs you with the content that you have to get somebody to pay £2 for your film. If that number is £6 that you need to spend to get somebody to pay £2, that is still a great result. But now you need to get focused on making your next two short films that probably link in some way so that you can get people to upsell into two additional purchases. Make it part of your content. Make it part of your story. You will be picking people up organically along this journey as well. Once you've released those other films, you will now have a customer acquisition cost which is balanced with your LTV, your lifetime value of a customer. Let's just for argument's sake say that it's £6. That means for every £6 you spend on advertising, you are making £6. So keep spending that £6 until you have a bajillion followers. And with films that people love and a bajillion followers, the industry is yours for the taking. Congratulations. I've got a free PDF telling you how to get started in the link in my bio, and I run a community full of filmmakers who are doing this right now. Come and join us."}, {"f": "DOa897AkzzT.mp4", "t": "Βίντεο", "s": "Ο ομιλητής ρωτά γιατί ακολουθείς τους κανόνες και επισημαίνει ότι υπάρχουν πάρα πολλοί κανόνες, στα σχολεία και στις εταιρείες, που είναι ο λόγος που δεν ζεις τη ζωή που θέλεις. Υποστηρίζει ότι ακολουθείς απλώς λάθος κανόνες, οι οποίοι σε προγραμματίζουν να μην μπορείς να κάνεις άλμα πίστης ή να βγεις από τη ζώνη άνεσής σου. Οι κανόνες φτιάχνονται για να ελέγχουν τους ανθρώπους, οπότε αν ακολουθείς λάθος κανόνες, σε ελέγχουν λάθος άνθρωποι. Αναφέρει τον Δαλάι Λάμα που είπε ότι πρέπει να μάθεις τους κανόνες για να τους παραβιάσεις σωστά. Καλεί να σταματήσουμε να ακολουθούμε τους λάθος κανόνες και να δημιουργήσουμε τους δικούς μας κανόνες για την ευτυχία και την επιτυχία μας. Πρόκειται για περιεχόμενο ενδυνάμωσης και αμφισβήτησης της κοινωνικής συμμόρφωσης.", "x": "Why are you following the rules? Have you ever thought about this? There are so many rules. We have so many rules back in the schools, and then you have so many rules in your company. You might gonna hate me for saying this, but those are the reason why you're not living the life you want to live. You're just simply following the wrong rules. Those rules you have been following literally programming you to not be able to take a leap of faith or not be able to step outside of your comfort zone. The rules are made to control people, so if you follow the wrong rules, then you're gonna be controlled by the wrong people. Dalai Lama said this: \"You have to learn the rules to properly break the rules.\" So stop following the wrong rules. Now you have to create the rules for your happiness and for your success. Wake me up when this is all over."}, {"f": "DOYrlDUgZDs.mp4", "t": "Βίντεο", "s": "", "x": ""}, {"f": "DN02y1rZDvR.jpg", "t": "Φωτογραφία", "s": "Φωτογραφία με οδηγό για το πώς να κάνεις επανεκκίνηση στη ζωή σου. Περιλαμβάνει έξι βήματα. Πρώτον, αποδέξου πού βρίσκεσαι: σταμάτα να πολεμάς την πραγματικότητα και αναγνώρισε τα λάθη χωρίς αυτομίσος. Δεύτερον, αποσυνδέσου από το παρελθόν: άφησε μνησικακίες και τύψεις και συγχώρεσε τον εαυτό σου. Τρίτον, ξεκαθάρισε τι θέλεις: όρισε τη ζωή για την οποία θα ήσουν περήφανος και εστίασε στους επόμενους έξι με δώδεκα μήνες. Τέταρτον, απλοποίησε το περιβάλλον σου: ξεκαθάρισε τον χώρο για να ξεκαθαρίσει το μυαλό. Πέμπτον, χτίσε μικρές συνήθειες: μικρές καθημερινές δράσεις αποδίδουν περισσότερο από μεγάλα σχέδια. Έκτον, περιβάλλεσαι με ενέργεια ανάπτυξης: πέρνα χρόνο με ανθρώπους που εμπνέουν πρόοδο. Είναι τυπικό περιεχόμενο αυτοβελτίωσης.", "x": "How to\nRestart\n(Life Again)\n@growthmindwave\n\nAccept Where You Are\n• Stop fighting reality.\n• Acknowledge mistakes\nwithout self-hate.\n• This is your current\nchapter, not your ending\n@growthmindwave\n\nDetach from the Past\n• Let go of grudges and\nregrets.\n• Remove reminders that\ntrigger old pain.\n• Forgive yourself so you\ncan move forward.\n@growthmindwave\n\nGet Clear on What You Want\n• Define the kind of life\nyou'd be proud of.\n• Write down your non-\nnegotiables.\n• Focus on the next 6-12\nmonths not forever.\n@growthmindwave\n\nSimplify Your Environment\n• Declutter your space to\ndeclutter your mind.\n• Keep only what supports\nyour new path.\n• Create a physical reset to\nmatch your mental one.\n@growthmindwave\n\nBuild Micro-Habits\n• Small daily actions\ncompound faster than big\nplans.\n• Start with one keystone\nhabit (sleep, movement,\njournaling).\n• Make habits so small\nthey're hard to skip.\n@growthmindwave\n\nSurround Yourself with\nGrowth Energy\n• Spend more time with\npeople who inspire\nprogress.\n• Distance yourself from\nconstant negativity.\n• Follow content that feeds\nyour goals, not your\nfears.\n@growthmindwave"}, {"f": "DOZGV2TE7am.mp4", "t": "Βίντεο", "s": "Ο Μάικλ παρουσιάζει μία επιστημονική φόρμουλα για να σταματήσεις τις αρνητικές σκέψεις, τονίζοντας ότι δεν είναι ελάττωμα χαρακτήρα αλλά εγκέφαλος σε αυτόματο πιλότο. Πρώτο βήμα, πιάσε τον βρόχο: ονομάτισε τη σκέψη, όπως «α, πάλι το τραγούδι δεν είμαι αρκετός», γιατί η επίγνωση σπάει τον αυτοματισμό και ο σκεπτόμενος εγκέφαλος ηρεμεί τον συναισθηματικό. Δεύτερο βήμα, άλλαξε τη χημεία: οι αρνητικές σκέψεις αυξάνουν την κορτιζόλη, οπότε κούνησε το σώμα σου με κάμψεις, ρίξε κρύο νερό στο πρόσωπο και πάρε βαθιές αναπνοές με εκπνοή μεγαλύτερη από την εισπνοή, για να γυρίσει το σώμα σε κατάσταση ηρεμί d. So instead of, \"I'll never get it,\" say, \"I'm figuring it out as I go.\" Repeat that, and each rep is literally rewiring your neural pathways. That's the formula. Catch it, flip it, and recode it. Three steps to stop negative thinking on demand. Write formula in the comments to remember this three-step formula in your body. Formula in the comments. Like the video, follow me, and click the link in my bio. I'm enrolling my program in manifestation right now, and that program lives in our own private app where a community of people are up spiraling our lives together. Vibrant beings, have a great day."}, {"f": "DOQhhzujKKh.jpg", "t": "Φωτογραφία", "s": "Φωτογραφία με πολύ αποσπασματικό κείμενο από OCR, που περιλαμβάνει επαναλαμβανόμενες λέξεις όπως «teRider», «eRider» και «R lone Rid», πιθανώς σχετικές με τη λέξη «rider». Το περιεχόμενο είναι ουσιαστικά δυσανάγνωστο και δεν μεταφέρει κάποιο συνεκτικό μήνυμα. Φαίνεται να πρόκειται για εικόνα με λογότυπο ή τυπογραφία που σχετίζεται με κάποια μάρκα ή concept που περιλαμβάνει τη λέξη «rider», ίσως μοτοσικλέτα ή κάποιο εμπορικό σήμα. Δεν υπάρχει αρκετό κατανοητό κείμενο για να εξαχθεί κάποιο νόημα ή θέμα. Πρόκειται πιθανώς για διαφημιστικό ή καλλιτεχνικό γραφικό όπου κυριαρχεί το οπτικό στοιχείο και η τυπογραφία έναντι του γραπτού λόγου, και η εξαγωγή κειμένου απέτυχε να αποδώσει το πραγματικό περιεχόμενο.", "x": "teRider\n\neRider\n\nR lone Rid"}, {"f": "DOOYyoRDJ30.mp4", "t": "Βίντεο", "s": "Απόσπασμα από το κλασικό τραγούδι Happy Together των The Turtles. Οι στίχοι εκφράζουν τη χαρά και την αφοσίωση ενός ερωτευμένου ανθρώπου που δηλώνει ότι δεν μπορεί να φανταστεί να αγαπά κανέναν άλλον σε όλη του τη ζωή. Η φράση «όταν είσαι μαζί μου, μωρό μου, ο ουρανός θα είναι γαλάζιος για όλη μου τη ζωή» μεταφέρει την αίσθηση ότι η παρουσία του αγαπημένου προσώπου φέρνει φως και ευτυχία. Είναι ένα αισιόδοξο, ρομαντικό τραγούδι της δεκαετίας του εξήντα που εξυμνεί τη συντροφικότητα και τη χαρά της αμοιβαίας αγάπης. Το βίντεο πιθ  και μετά αρχίζεις να ζεις πραγματικά.", "x": "Αν είσαι σαράντα και αυξάνεται το κοντέ, πιθανότατα να έχεις πια συνειδητοποιήσει ότι μεγαλώνουν και τα προβλήματα. Μέχρι τα είκοσι, εικοσιπέντε, τριάντα λες, έλα μωρέ να τελειώσει αυτό το πρόβλημα για να μπορέσω να το χαρώ, να χαρώ τη ζωή. Να τελειώσω το θέμα με τα προσωπικά μου, τα συναισθηματικά, με τα επαγγελματικά μου και τότε θα δώσω την ευκαιρία στον εαυτό μου να χαρεί. Συνειδητοποιείς ότι αυτό δε θα γίνει ποτέ. Όχι μόνο γιατί μεγαλώνουν τα προβλήματα, αλλά γιατί μεγαλώνει η ψυχοσυναισθηματική σου καμπούρα. Τι σημαίνει πρακτικά αυτό; Έχεις ήδη να διαχειριστείς ένα μεγάλο χωρισμό ή δύο ή και τρεις. Έχεις παιδιά κατά πάσα πιθανότητα. Μπορεί τα παιδιά σου να είναι και μεγάλα, άρα μεγαλύτερα παιδιά, μεγαλύτερα προβλήματα. Και ταυτόχρονα αρχίζουνε ματαιώσεις. Όνειρα που έκανες μέχρι τα είκοσι, εικοσιπέντε, τριάντα. Κάποια από αυτά μπορεί να μην έχουν ευοδωθεί, οπότε ξεκινάνε ματαιώσεις και δουλεύουν μέσα σου τα απωθημένα. Όλα αυτά φορτώνουν, οπότε αυξάνεται η ανάγκη διαχείρισης και συνειδητοποιείς ότι δεν μπορείς να περιμένεις να τελειώσουν τα προβλήματα που δεν τελειώνουν ποτέ, αλλά πρέπει να διαχειριστείς με όσο δυνατόν καλύτερο τρόπο αυτό που συμβαίνει. Γιατί η ζωή είναι τώρα. Αρχίζεις και τους γράφεις όλους, μην πω που, να πω στα παλιά σου τα παπούτσια που είναι πιο κόσμιο. Και αρχίζεις από τα σαράντα και μετά να ζεις πραγματικά."}, {"f": "DOG7oXJDKdV.mp4", "t": "Βίντεο", "s": "Ο αφηγητής περιγράφει ότι όταν δεν μπορούσε να ξανακοιμηθεί το πρωί, πήγε να δει την ανατολή και είδε όλους αυτούς τους ανθρώπους να ξεκινούν τη μέρα τους με τόση επιμονή και σφρίγος, προσπαθώντας να κάνουν κάτι από τον εαυτό τους και τον κόσμο. Ένιωσε τυχερός που είναι μέρος αυτού. Όμως μετά θυμήθηκε πώς είναι πραγματικά ο κόσμος και κατέληξε σε μία πιο ακριβή συνειδητοποίηση: ότι στην πραγματικότητα μισεί τους ανθρώπους. Πρόκειται για ένα σύντομο, χιουμοριστικό μονόλογο με ανατροπή, που παίζει με την αντίθεση ανάμεσα στην αισιόδοξη εικόνα
